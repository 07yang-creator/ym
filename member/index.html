<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>我的页面 · ym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--felt:#16241E;--felt-up:#1E3129;--stock:#E8E0CD;--stock-dim:#8E9A90;
    --brass:#C9A356;--brass-dim:#6E5F36;--ink:#0E1512;--muted:#7C8F85;--line:#2C4238;--ok:#7FA98A;
    --alarm:#D2604A}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:#0E1713;color:var(--stock);
    font:14px/1.7 "Noto Sans JP",-apple-system,"PingFang SC","Hiragino Sans",sans-serif}
  .num{font-family:Oswald,sans-serif;font-variant-numeric:tabular-nums}
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--felt);padding:0 16px 44px}
  .top{display:flex;align-items:center;gap:10px;height:50px;border-bottom:1px solid var(--line)}
  .top .logo{font-family:Oswald,sans-serif;font-size:17px;color:var(--brass)}
  .top .t{font-size:12px;color:var(--muted);letter-spacing:.18em}
  .top .sp{flex:1}
  .lbl{font-size:10px;letter-spacing:.2em;color:var(--muted)}
  .muted{color:var(--muted)}
  input{font:inherit;color:var(--stock);background:var(--felt-up);border:1px solid var(--line);
    border-radius:4px;padding:10px 12px;width:100%}
  input:focus{outline:1px solid var(--brass);border-color:var(--brass)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  .btn{background:var(--brass);color:var(--ink);border-radius:4px;padding:10px 16px;
    font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:none;color:var(--brass);border:1px solid var(--brass-dim)}
  .btn.sm{padding:7px 12px;font-size:11.5px}
  .card{background:var(--felt-up);border:1px solid var(--line);border-radius:6px;padding:13px 14px;margin:12px 0}
  .ev{font-size:15px;font-weight:700}
  .meta{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
  /* 你要做的事 */
  .duty{border-bottom:1px solid var(--line);padding:10px 0}
  .duty:last-child{border-bottom:0}
  .duty .dn{font-size:14px;font-weight:600}
  .duty .dm{font-size:11px;color:var(--muted);margin-top:2px}
  .duty .st{font-size:10.5px;color:var(--brass)}
  .duty .acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .duty .said{font-size:11.5px;color:var(--ok)}
  .duty .back{font-size:11.5px;color:var(--alarm)}
  .duty .diff{font-size:9.5px;color:var(--brass);border:1px solid var(--brass-dim);border-radius:3px;
    padding:1px 5px;margin-left:6px;vertical-align:middle}
  /* 发布池: 星级不够的显示但锁住 (§B5) —— 藏起来只会让人以为没任务，锁住才有升级动力 */
  .duty.lk{opacity:.55}
  .duty .lock{font-size:11.5px;color:var(--muted)}
  .subm{width:100%;margin-top:6px}
  .subm input{margin-bottom:6px;padding:8px 10px;font-size:12.5px}
  .ico{width:1.05em;height:1.05em;vertical-align:-.16em;fill:none;stroke:currentColor;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ico+*{margin-left:.34em}
  .fileup{border:1px solid var(--brass-dim);color:var(--brass);border-radius:4px;
    padding:7px 12px;font-size:11.5px;cursor:pointer}
  /* 被主办方点名邀请的那一场 */
  .card.invited{border-color:var(--brass-dim)}
  .invtag{font-size:11px;color:var(--brass);margin-bottom:4px;letter-spacing:.04em}
  .mine{font-size:11px;color:var(--brass);margin-top:5px}
  .mine .x{color:var(--muted);cursor:pointer;margin-left:6px}
  /* 捐赠票据 —— .duty の外にあるので said/back/acts はここで持つ（同名クラスだが別スコープ） */
  .give{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .give .acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .give .said{font-size:11.5px;color:var(--ok);margin-left:6px}
  .give .back{font-size:11.5px;color:var(--alarm);margin-left:6px}
  .give .note{margin-top:6px}
  /* 当天流程 */
  .rd{display:flex;gap:9px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rd:last-child{border-bottom:0}
  .rd .tm{font-family:Oswald,sans-serif;width:46px;flex:none;color:var(--stock-dim)}
  .rd .sg{flex:1;min-width:0}
  .rd .ds{display:block;font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:2px}
  .rd .me{font-size:10px;color:var(--brass);flex:none}
  .fold{font-size:12px;color:var(--brass);cursor:pointer;padding:8px 0;display:inline-block}
  /* 嘉宾: 号牌 + 主办方通知 */
  .badge{display:flex;align-items:baseline;gap:10px;margin-top:12px;padding-top:10px;
    border-top:1px solid var(--line)}
  .badge .bn{font-family:Oswald,sans-serif;font-size:26px;color:var(--brass);line-height:1}
  .badge .bl{font-size:11px;color:var(--muted);letter-spacing:.1em}
  .notice{margin-top:12px;padding:10px 11px;border:1px dashed var(--brass-dim);border-radius:6px;
    font-size:12.5px;line-height:1.8}
  .cstat{display:flex;gap:18px;align-items:baseline}
  .cstat b{font-family:Oswald,sans-serif;font-size:22px;color:var(--brass);display:block;line-height:1.1}
  .cstat span{font-size:10px;letter-spacing:.16em;color:var(--muted)}
  .rv{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px}
  .rv b{color:var(--brass)}
  .note{font-size:10.5px;color:var(--muted);line-height:1.8;margin-top:18px}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:2}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:60;background:var(--stock);
    color:var(--ink);font-size:12.5px;padding:9px 16px;border-radius:4px;box-shadow:0 8px 20px -4px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
'use strict';
/* 线条图标 —— 和主办端同一套（两个 app 是独立单文件，函数不共享，改一处要想到另一处）。
   owner universal rule 2026-07-27：默认总是用简单线条 icon，不用彩色 emoji。 */
const ICON={
  clip:'<path d="M20 11.5 12 19.4a4.6 4.6 0 0 1-6.5-6.5l8.4-8.3a3 3 0 0 1 4.3 4.3l-8.3 8.3a1.5 1.5 0 0 1-2.1-2.1l7.6-7.6"/>',
  lock:'<rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.4a4 4 0 0 1 8 0v3.1"/>',
  cam:'<circle cx="12" cy="13" r="3.4"/><path d="M3 8.5h3.2l1.6-2.2h8.4l1.6 2.2H21v10H3z"/>',
  hand:'<path d="M9 11V5.4a1.6 1.6 0 0 1 3.2 0V11M12.2 11V4.2a1.6 1.6 0 0 1 3.2 0V11M15.4 11V6.6a1.6 1.6 0 0 1 3.2 0v7.6a6.6 6.6 0 0 1-6.6 6.6h-.8a6 6 0 0 1-4.6-2.2L4 15.2a1.7 1.7 0 0 1 2.5-2.2L9 15.4"/>'
};
function ico(n,cls){return `<svg class="ico${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||''}</svg>`;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;').replace(/</g,'&lt;');}
// esc() is NOT enough inside on*="f('HERE')": the parser entity-decodes before the handler
// body is compiled, so &#39; becomes a live quote. Backslash-escape first.
function escq(v){return esc(String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function fmtDate(s){if(!s)return '';const d=new Date(s+'T00:00:00');if(isNaN(d))return s;
  return (d.getMonth()+1)+'/'+d.getDate()+'('+'日一二三四五六'[d.getDay()]+')';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function shrink(file,cb){ // photos → ≤1600px jpeg before upload (same as the host app)
  const img=new Image();
  img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',.85).split(',')[1]);URL.revokeObjectURL(img.src);};
  img.src=URL.createObjectURL(file);
}
const SB_URL='https://ugkopxmeqsbtjeimultz.supabase.co', SB_KEY='sb_publishable_IRGVl9uD8uvqJrEPn1r0ZA_14praaii';
/* 必须在 createClient 之前读：supabase-js 一建好就异步吃掉 URL 里的 #token 并清空地址栏，
   PASSWORD_RECOVERY 有可能在下面 subscribe 之前就发完了 —— 那样点进来只会正常登录，
   「设一个新密码」永远不出现。事件之外再留一份 URL 证据。 */
const _mhash=(location.hash||'')+'&'+(location.search||'');
const RECOVERY_URL=/type=recovery/.test(_mhash);
const RECOVERY_ERR=(/error_description=([^&]+)/.exec(_mhash)||[])[1];
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
const API='https://www.jjconnect.tokyo';
let SESSION=null,MYCODES=null,SHARES=null,MINE=[],_busy=false,_bad='',OPEN={},TAB='login',RECOVERY=false;
/* 首页的「登录 / 加入」菜单直接指到这三块，别让人先落在登录框上再自己找入口
   （2026-07-27 可达性复查的判据：上线了但看不见 = 等于没上线）。 */
if(/^#reg\b/.test(location.hash))TAB='reg';
else if(/^#apply\b/.test(location.hash))TAB='apply';
// 自助申请的表单状态。类型默认志愿者；主办方名字**只能手打** —— 全站没有任何接口
// 返回主办名单，也没有「找不到该主办」的提示（owner: neither，见 docs/STAGE_SELF_REG.md §6）。
let APPLY={role:'V',sent:false};
// Role comes from ym_code (server data, read under RLS with our own token), never from the shape
// of what was published to us, and never from user_metadata (which is user-writable).
// An array, not maybeSingle(): one person may hold an identity with more than one host.
function codeFor(h){return (MYCODES||[]).find(c=>c.host===h)||null;}
function roleFor(h){const c=codeFor(h);return c?(c.role==='V'&&c.paid?'VN':c.role):'';}
function myCode(){const c=(MYCODES||[])[0];return c?c.code:'';}
const CAN_DUTY={V:1,VN:1}, CAN_JOIN={P:1};
// mirrors 0015's ym_rank_n() exactly. A drift here only mis-greys a button — the gate is the RPC,
// which reads ym_code.rank server-side — but keep them equal anyway.
const RANK_N={C:0,B:1,A:2,S:3,SS:4};
// 星级 comes from MY OWN ym_code row (read under RLS with my own token), NEVER from payload.rank,
// which is a display copy the host may not have refreshed.
function rankFor(h){const c=codeFor(h);return c&&c.rank?String(c.rank).toUpperCase():'C';}
// chips this SESSION has learned are gone, from a 'taken' answer. It never says who took them, it
// is never published to anyone, and it is not persisted: the chip leaves the pool for good on the
// host's next save. Publishing a `taken` flag into everybody's payload would be telling volunteers
// about each other, which is exactly what hub-and-spoke forbids.
let TAKEN={},_clk=false;
const $=id=>document.getElementById(id);

/* ---------- render ---------- */
function render(){
  let body;
  if(RECOVERY)          body=newPwHtml(true);          // 从重设邮件的链接回来
  else if(!SESSION)     body=_bad?badHtml():(TAB==='reg'?regHtml():TAB==='apply'?applyHtml()
                             :TAB==='forgot'?forgotHtml():loginHtml());
  else if(TAB==='pw')   body=newPwHtml(false);
  else if(MYCODES===null)body=`<div class="empty">读取中…</div>`;
  else if(!MYCODES.length)body=bindHtml();     // signed in, but no 编码 bound to this account
  else if(SHARES===null) body=`<div class="empty">读取中…</div>`;
  else if(!SHARES.length)body=revokedHtml();
  else body=SHARES.map(shareHtml).join('');
  const guest=(MYCODES||[]).length&&(MYCODES||[]).every(c=>c.role==='P');
  $('app').innerHTML=`
    <div class="top"><span class="logo">ym</span>
      <span class="t">${guest?'我的活动页':'我的成员页'}</span><span class="sp"></span>
      ${myCode()?`<span class="num" style="color:var(--brass);font-size:13px">${esc(myCode())}</span>`:''}
      ${SESSION&&!RECOVERY?`<span class="fold" style="padding:0 8px" onclick="TAB='pw';render()">改密码</span>
        <button class="btn ghost sm" onclick="signOut()">退出</button>`:''}</div>
    ${body}
    <p class="note">${guest
      ? '这里只显示主办方发布给你的内容：公开信息、当天流程、你的号牌和主办方通知。参加者之间互不可见 —— 有任何问题请直接联系主办方。'
      : '这里只显示主办方发布给你本人的内容。成员之间互不可见 —— 有任何问题请直接联系主办方。'}</p>`;
}
function loginHtml(){
  return `<div class="card" style="margin-top:28px">
    <div class="lbl" style="margin-bottom:10px">登录</div>
    <input id="lid" type="email" placeholder="你的邮箱" autocapitalize="off" spellcheck="false" style="margin-bottom:8px">
    <input id="lpw" type="password" placeholder="密码" style="margin-bottom:10px"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" style="width:100%" ${_busy?'disabled':''} onclick="doLogin()">${_busy?'登录中…':'登录'}</button>
    <div style="text-align:center;margin-top:12px">
      <span class="fold" onclick="TAB='forgot';render()">忘记密码了</span></div>
    <div style="text-align:center;margin-top:6px">
      <span class="fold" onclick="TAB='reg';render()">我有邀请码，还没注册 →</span></div>
    <div style="text-align:center">
      <span class="fold" onclick="TAB='apply';render()">没有邀请码，想加入 →</span></div></div>`;
}
/* 忘记密码 —— 自己走，主办不介入。Supabase 发一封带链接的信，点开落回这一页并进入
   PASSWORD_RECOVERY 状态，直接设新密码。编号（V0014）自始至终不变。 */
function forgotHtml(){
  return `<div class="card" style="margin-top:28px">
    <div class="lbl" style="margin-bottom:10px">重设密码</div>
    <p class="note" style="margin:0 0 10px">填注册时用的邮箱，我们给你发一封信；点信里的链接回到这一页设新密码。</p>
    <input id="fem" type="email" placeholder="你的邮箱" autocapitalize="off" spellcheck="false" style="margin-bottom:10px"
      onkeydown="if(event.key==='Enter')doForgot()">
    <button class="btn" style="width:100%" ${_busy?'disabled':''} onclick="doForgot()">${_busy?'发送中…':'发送重设邮件'}</button>
    <div style="text-align:center;margin-top:12px">
      <span class="fold" onclick="TAB='login';render()">← 回登录</span></div></div>`;
}
/* 邮件链接回来后 —— 也用于登录状态下主动改密码 */
function newPwHtml(recovery){
  return `<div class="card" style="margin-top:${recovery?28:12}px">
    <div class="lbl" style="margin-bottom:10px">${recovery?'设一个新密码':'修改密码'}</div>
    <input id="np1" type="password" placeholder="新密码（至少 8 位）" style="margin-bottom:8px">
    <input id="np2" type="password" placeholder="再输一次" style="margin-bottom:10px"
      onkeydown="if(event.key==='Enter')doNewPw()">
    <button class="btn" style="width:100%" ${_busy?'disabled':''} onclick="doNewPw()">${_busy?'保存中…':'保存'}</button>
    ${recovery?'':`<div style="text-align:center;margin-top:12px">
      <span class="fold" onclick="TAB='';render()">← 不改了</span></div>`}</div>`;
}
function regHtml(){
  return `<div class="card" style="margin-top:28px">
    <div class="lbl" style="margin-bottom:10px">用主办方给你的邀请码注册</div>
    <input id="rc" placeholder="16 位邀请码" autocapitalize="characters" autocomplete="off" spellcheck="false" style="margin-bottom:8px">
    <input id="re" type="email" placeholder="你自己的邮箱" style="margin-bottom:8px">
    <input id="rp" type="password" placeholder="设一个密码（至少 8 位）" style="margin-bottom:10px"
      onkeydown="if(event.key==='Enter')doRegister()">
    <button class="btn" style="width:100%" ${_busy?'disabled':''} onclick="doRegister()">${_busy?'注册中…':'注册'}</button>
    <p class="note"><b style="color:var(--brass)">你的身份（志愿者 / 嘉宾 / 捐赠者）和归属的主办方，
      都由这串邀请码决定</b> —— 这里不需要选，也选不了：码是谁发的，你就在谁名下，
      主办方发码时指定的是什么身份，你注册出来就是什么身份。<br>
      邮箱和密码都由你自己决定 —— 主办方不知道，也不需要知道。邀请码一周内有效，
      只能用一次；注册成功后你会拿到一个永久编号（例如 V0014），以后用编号或邮箱登录都行。</p>
    <div style="text-align:center;margin-top:14px">
      <span class="fold" onclick="TAB='login';render()">← 我已经注册过了</span></div></div>`;
}
/* 自助申请 (owner 2026-07-27 裁决 → 0019)。**注册和报名是两件事**：这里申请的是一个账号，
   不是某一场活动的名额。
   主办方的名字只能手打：这个 app 不负责让人发现主办 —— 申请人必须本来就知道
   （听人说的、名片上的、活动上认识的）。没有目录、没有下拉、没有搜索建议，
   也没有「找不到该主办」。提交之后**永远只有一种回应**，因为
   「名字打错了」和「被婉拒了」从外面看必须一模一样；任何一处让两者可区分，
   这张表单就变成了主办名单的枚举器。 */
function applyHtml(){
  if(APPLY.sent)return `<div class="card" style="margin-top:28px">
    <div class="lbl" style="margin-bottom:10px">已收到</div>
    <div style="font-size:13px;line-height:1.9">你的申请已经送出。<br>
      如果通过，主办方会直接联系你，把邀请码发给你 —— 拿到码之后回到这一页「注册」。</div>
    <p class="note">这里不会显示申请进度，也不需要你再来刷新。</p>
    <div style="text-align:center;margin-top:14px">
      <span class="fold" onclick="TAB='login';APPLY.sent=false;render()">← 回登录</span></div></div>`;
  const rb=(k,l)=>`<button class="btn ${APPLY.role===k?'':'ghost'} sm" style="flex:1"
    onclick="APPLY.role='${k}';render()">${l}</button>`;
  return `<div class="card" style="margin-top:28px">
    <div class="lbl" style="margin-bottom:10px">申请加入</div>
    <div class="sub" style="font-size:12px;color:var(--muted);margin-bottom:10px">
      你需要知道主办方对外用的名字 —— 请照着 TA 报给你的那个名字打。</div>
    ${/* ⚠ 四个框都必须自己带 value 并 oninput 回写。任何一次 render（切类型、提交失败、
          _busy 变化）都会整块重画，而主办方的名字**必须一字不差手打**、全站又不给任何提示 ——
          清空它等于让人从头猜一遍。复查 2026-07-28。 */''}
    <div style="display:flex;gap:8px;margin-bottom:10px">${rb('V','我想当志愿者')}${rb('P','我想参加活动')}</div>
    <input id="ah" placeholder="主办方的名字" autocomplete="off" autocorrect="off"
      spellcheck="false" style="margin-bottom:8px"
      value="${esc(APPLY.host||'')}" oninput="APPLY.host=this.value">
    <input id="an" placeholder="怎么称呼你" autocomplete="off" style="margin-bottom:8px"
      value="${esc(APPLY.name||'')}" oninput="APPLY.name=this.value">
    <input id="ae" type="email" placeholder="你的邮箱（主办方用它联系你）" autocapitalize="off"
      spellcheck="false" style="margin-bottom:8px"
      value="${esc(APPLY.email||'')}" oninput="APPLY.email=this.value">

async function doApply(){
  if(_busy)return;
  const g=i=>{const el=$(i);return el?el.value.trim():'';};
  const host=g('ah'),name=g('an'),email=g('ae').toLowerCase(),note=g('am');
  // 先存起来再说：下面任何一条失败路径都会 render()，不存就全清空了
  APPLY.host=host;APPLY.name=name;APPLY.email=email;APPLY.note=note;
  // 只校验**申请人自己填的东西的形状**。主办方的名字除了「不能空」以外一个字都不判断：
  // 任何一句「这个名字不对」都是在回答「哪些主办存在」。
  if(!host){toast('请填主办方的名字');return;}
  if(!name){toast('请填怎么称呼你');return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('邮箱格式不对');return;}
  _busy=true;render();
  try{
    const {status}=await post('/api/ym_join',{host,role:APPLY.role,email,name,note});
    _busy=false;
    if(status===429){toast('试得太频繁了，请过一会儿再来');render();return;}
    if(status!==200){toast('提交失败，请稍后再试（这跟你填的内容无关）');render();return;}
    // 名字对上没对上、主办批不批 —— 到这里为止我们都不说，因为说了就等于泄露。
    APPLY.sent=true;APPLY.host='';APPLY.name='';APPLY.email='';APPLY.note='';render();
  }catch(e){_busy=false;toast('网络不太稳，请重试');render();}
}

/* 发布池的一项 (PLAN-Y7 §B6)。这里只有 环节 / 时间 / 难度 / 说明 —— 绝不会出现另一位志愿者的
   名字，被别人接走后也只显示「该任务已经被领取」，不会显示是谁，也不会在你没点之前就告诉你
   有人动过。星级不够的显示但锁住 (§B5)。
   这里所有的判断都只是把按钮画对；真正的胜负由 0016 的 ym_claim_task() 在数据库里定。 */
function poolHtml(host,j,x){

  const meta=[x.where,x.time,x.needs?'需要 '+x.needs:'',x.due?'截止 '+fmtDate(x.due):'']
    .filter(Boolean).join(' · ');
  let act;
  if(mine&&mine.status==='accepted')

      <button class="btn ghost sm" onclick="dropClaim('${escq(mine.id)}',1)">知道了 · 可以重新接</button>`;

  else act=`<button class="btn sm"

/* 主办退回过的认领。如果那件事已经不在你的认领池里（主办改派了、或收回了发布），上面就没有地方
   显示 §B3 那句必填的说明 —— 而那条被退回的行还会一直挡着你以后再接同一件事。所以单独列出来。*/
function claimNotes(row){
  const d=row.payload||{},host=row.host,shown={};
  (d.jobs||[]).forEach(j=>{const k=String(j.eventId||'');
    (j.pool||[]).forEach(x=>{shown[k+'|'+String(x.chipId||'')]=1;});
    (j.duties||[]).forEach(x=>{shown[k+'|'+String(x.chipId||'')]=1;});});
  const rows=MINE.filter(r=>r.host===host&&r.kind==='claim'&&r.status==='rejected'
    &&!shown[r.event_id+'|'+r.chip_id]);
  if(!rows.length)return '';
  return `<div class="card"><div class="lbl" style="margin-bottom:6px">主办方的回复</div>`

        <div class="acts"><button class="btn ghost sm"
          onclick="dropClaim('${escq(r.id)}',1)">知道了</button></div></div>`).join('')+`</div>`;

/* 抢单。胜负在服务端定，不在这里 —— 这个函数唯一的工作是把三个 id 交给 RPC 并把回答念出来。
   绝不直接往 ym_submit 插一行认领：0015 的策略把 claim 那一支写死成 false，先到先得必须由数据库
   的唯一索引来定，前端谁先发出请求不算数。 */
async function claimTask(host,evId,cid){
  if(_clk||!sb)return;_clk=true;
  let data=null,error=null;
  // try/finally, not a bare await: a network exception that escaped would leave _clk stuck true
  // and the 接任务 button dead for the rest of the session, with nothing on screen to explain it.
  try{({data,error}=await sb.rpc('ym_claim_task',{p_host:host,p_event:evId,p_chip:cid}));}
  catch(e){error=e;}
  finally{_clk=false;}
  if(error){toast('网络不太稳，请再点一次');return;}
  const r=String(data||'');
  if(r==='ok'){await loadMine();render();toast('接到了 —— 等主办方确认指派');return;}
  if(r==='mine'){await loadMine();render();toast('你已经接下这一项了');return;}
  if(r==='taken'){TAKEN[evId+'|'+cid]=1;render();toast('该任务已经被领取');return;}
  if(r==='rank'){toast('这一项的难度高于你的星级 —— 先做几件低难度的，主办方会给你升星');return;}
  if(r==='back'){await loadMine();render();toast('主办方退回过这一项 —— 先看 TA 的说明再重新接');return;}
  if(r==='full'){toast('你手上还有没确认的任务，先做完再接新的');return;}
  if(r==='slow'){toast('点得太快了，过一会儿再试');return;}
  toast('现在接不了这一项 —— 刷新页面再试一次');   // 'invalid' / 'no-session': never says why
}
async function dropClaim(id,seen){
  const {error}=await sb.from('ym_submit').delete().eq('id',id);
  if(error){toast('操作失败：'+error.message);return;}
  await loadMine();render();
  toast(seen?'知道了 —— 这一项你可以重新接':'已放弃 —— 别人可以接了');
}
function submitFrom(host,evId,cid){
  const g=i=>{const el=$('f_'+cid+i);return el?el.value.trim():'';};
  sendSubmit(host,evId,cid,g('h'),g('c'),g('n'));
}
async function sendSubmit(host,evId,cid,hours,cost,note){
  const prev=MINE.find(r=>r.chip_id===cid&&r.event_id===evId
    &&(r.kind==='submit'||r.kind==='done'));
  if(prev&&prev.status==='accepted'){toast('主办方已确认');return;}
  if(prev){const d=await sb.from('ym_submit').delete().eq('id',prev.id);
    if(d.error){toast('提交失败：'+d.error.message);return;}}
  const h=parseFloat(hours),c=parseInt(String(cost||'').replace(/[^\d]/g,''),10);
  const {error}=await sb.from('ym_submit').upsert(
    {host,member:SESSION.user.id,event_id:evId,chip_id:cid,kind:'submit',slot:'',
     note:String(note||'').slice(0,2000),
     hours:isNaN(h)?null:Math.min(999,h),cost:isNaN(c)?null:Math.min(10000000,c)},
    {onConflict:'host,member,event_id,chip_id,kind,slot',ignoreDuplicates:true});
  if(error){toast(/row-level|policy/i.test(error.message)
    ? '主办方还没发布这一项，请稍后再试' : '提交失败：'+error.message);return;}
  await loadMine();render();toast('已交任务 —— 等主办方确认');
}
function fold(k){OPEN[k]=!OPEN[k];render();}

/* ---------- auth ---------- */
// Login is EMAIL + password only (PLAN-Y7 §A3). The 用户编码 is a display identity and touches no
// auth path, so there is no 编码→email resolver and therefore no email-harvesting oracle.
function signIn(){
  if(_busy||!sb)return;
  const email=($('em').value||'').trim().toLowerCase(),pw=$('pw').value||'';
  if(!email||!pw){toast('请输入邮箱和密码');return;}
  _busy=true;
  sb.auth.signInWithPassword({email,password:pw}).then(({error})=>{_busy=false;
    if(error)toast('登录失败：邮箱或密码不对');});
}
// user_metadata is user-writable — a UX flag, never a boundary; the boundary is RLS.
async function post(path,b){
  const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify(b)});
  let j={};try{j=await r.json();}catch(e){}
  return {status:r.status,j};
}
async function install(sess){
  if(!sess||!sess.access_token){toast('成功了 —— 请用编号和密码登录一次');return;}
  const {error}=await sb.auth.setSession({access_token:sess.access_token,
    refresh_token:sess.refresh_token});                     // onAuthStateChange calls load()
  if(error)toast('登录失败：'+error.message);
}
async function doRegister(){
  if(_busy)return;
  const code=normInvite($('rc').value),email=($('re').value||'').trim().toLowerCase(),pw=$('rp').value||'';
  if(code.length!==16){toast('邀请码是 16 位');return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('邮箱格式不对');return;}
  if(pw.length<8){toast('密码至少 8 位');return;}
  _busy=true;render();
  try{
    const {status,j}=await post('/api/ym_reg',{code,email,password:pw});
    _busy=false;
    if(status===200&&j.ok){toast('注册成功 —— 你的编号是 '+j.code);return install(j.session);}
    // ONE message for every failure. The endpoint deliberately does not say which one it was,
    // because "this email already exists" is an email-existence oracle.
    _bad=status===429?'试得太频繁了，请过一会儿再来。'
      :'注册没成功。请确认邀请码没输错、没过期（一周）、也没被用过。\n'
      +'如果你在本站已经有账号，请先用邮箱和密码「登录」，进去后再绑定这个邀请码。';
    render();
  }catch(e){_busy=false;_bad='网络不太稳，请重试。';render();}
}
async function doLogin(){
  if(_busy)return;
  const id=($('lid').value||'').trim().toLowerCase(),pw=$('lpw').value||'';
  if(!id||!pw){toast('请输入邮箱和密码');return;}
  _busy=true;render();
  // Login is EMAIL + password only (PLAN-Y7 §A3). Nothing resolves a 用户编码 to an address, so
  // there is no oracle to protect and GoTrue's own limiter covers the attempts.
  const {error}=await sb.auth.signInWithPassword({email:id,password:pw});
  _busy=false;
  if(error){toast(/rate|too many/i.test(error.message||'')
    ? '尝试太多次了，请稍后再试' : '登录失败：邮箱或密码不对');render();}
}
async function doBind(){
  const code=normInvite($('bc').value);
  if(code.length!==16){toast('邀请码是 16 位');return;}
  const {data,error}=await sb.rpc('ym_bind_code',{p_invite:code});
  if(error||!data||data.r!=='ok'){
    toast(data&&data.r==='slow'?'试得太频繁了，请过一会儿再来'
        :data&&data.r==='already'?'这个账号已经绑定过了':'绑定失败：码不对或已失效');return;}
  toast('已绑定 —— 你的编号是 '+data.code);load();
}
/* 可报名 —— 主办已公开、但 TA 还没参加的活动。这是 ym_share_can_join() 唯一认的锚点：
   嘉宾自己的 jobs[] 是循环的（里面只有已经参加的），而 ym_post 的公开策略是 to anon，
   登录后的嘉宾在那里读到 0 行。 */
/* 志愿者贡献 (PLAN-Y7 §B4) — 完成件数 · 累计工时 · 累计自费 · 主办的感谢 · 服务经历。
   工时不重复计算：志愿者自报的（已确认的 ym_submit）进累计；复盘里主办填的 volLog.hours
   单独显示为「主办登记」，因为那是另一个人对同一件事的记录，加起来会翻倍。 */
function contribHtml(row){
  const d=row.payload||{};
  if(d.kind!=='vol')return '';
  const ok=MINE.filter(r=>(r.kind==='submit'||r.kind==='done')&&r.status==='accepted');
  const hrs=ok.reduce((s,r)=>s+(parseFloat(r.hours)||0),0);
  const cost=ok.reduce((s,r)=>s+(parseInt(r.cost,10)||0),0);
  const thanks=(d.jobs||[]).filter(j=>j.review).map(j=>({ev:j.event,t:j.review}));
  const logged=(d.jobs||[]).reduce((s,j)=>s+(parseFloat(j.hours)||0),0);
  const key='__contrib';
  const open=OPEN[key];
  if(!ok.length&&!thanks.length&&!logged)return '';
  const name=cid=>{
    for(const j of (d.jobs||[])) for(const x of (j.duties||[])) if(x.chipId===cid)return x.name||x.where||'';
    return '一项任务';};
  return `<div class="card" style="margin-top:18px">
    <div class="lbl" style="margin-bottom:8px">我的贡献</div>
    <div class="cstat">
      <div><b class="num">${ok.length}</b><span>已确认</span></div>
      <div><b class="num">${hrs%1?hrs.toFixed(1):hrs}</b><span>小时</span></div>
      ${cost?`<div><b class="num">¥${cost.toLocaleString()}</b><span>自费</span></div>`:''}
    </div>
    ${logged?`<div class="dm" style="margin-top:6px">主办另有登记 ${logged}h（复盘记录，不计入上面）</div>`:''}
    ${thanks.length?`<div class="rv">${thanks.map(x=>
      `<div>${esc(x.ev)}：${esc(x.t)}</div>`).join('')}</div>`:''}
    ${ok.length?`<div class="fold" onclick="fold('${key}')">${open?'▾':'▸'} 服务经历（${ok.length} 件）</div>
      ${open?ok.map(r=>`<div class="rd"><span class="sg">${esc(name(r.chip_id))}${
        r.hours?`<span class="ds">工时 ${esc(r.hours)}h${r.cost?' · 自费 ¥'+esc(r.cost):''}</span>`:''}</span></div>`).join(''):''}`:''}
  </div>`;
}
function joinList(row){
  const d=row.payload||{},op=d.open||[];
  if(!op.length)return '';
  // 被邀请的排在前面，并且明说「主办方邀请你」—— 但报名仍然要 TA 自己按
  // （owner 2026-07-27:「在被邀请用户同意以后」才算进报名）。邀请 ≠ 报名。
  const sorted=op.slice().sort((a,b)=>(b.invited?1:0)-(a.invited?1:0));
  return `<div class="lbl" style="margin:18px 0 2px">可以报名的活动</div>`+sorted.map(o=>{
    const evId=String(o.eventId||'');
    const asked=MINE.some(r=>r.kind==='join'&&r.event_id===evId);
    return `<div class="card${o.invited?' invited':''}">
      ${o.invited?`<div class="invtag">${ico('mega')}主办方邀请你参加</div>`:''}
      <div class="ev">${esc(o.event||'')}</div>
      <div class="meta">${fmtDate(o.date)}${o.start?' '+esc(o.start):''}${o.venue?' · '+esc(o.venue):''}</div>
      ${o.theme?`<div class="meta">${esc(o.theme)}</div>`:''}
      ${asked?`<div class="acts"><span class="said">● 已报名 · 等主办方确认</span></div>`
             :joinBtn(row.host,evId)}</div>`;}).join('');
}
function joinBtn(host,evId){
  const mine=MINE.find(r=>r.event_id===evId&&r.kind==='join');
  if(mine&&mine.status==='accepted')return `<div class="rv">✓ 主办方已确认你参加</div>`;
  if(mine)return `<div class="rv">● 已报名 · 等主办方确认
    <span class="mine"><span class="x" onclick="withdraw('${esc(mine.id)}')">撤回</span></span></div>`;
  return `<div class="acts"><button class="btn sm" onclick="joinEvent('${esc(host)}','${esc(evId)}')">我想参加</button></div>`;
}
async function joinEvent(host,evId){
  const {error}=await sb.from('ym_submit').upsert(
    {host,member:SESSION.user.id,event_id:evId,chip_id:'',kind:'join',slot:'',note:''},
    {onConflict:'host,member,event_id,chip_id,kind,slot',ignoreDuplicates:true});
  if(error){toast(/row-level|policy/i.test(error.message)
    ? '这场活动还不能报名' : '报名失败：'+error.message);return;}
  await loadMine();render();toast('已报名 —— 等主办方确认，号牌出现就是通过了');
}

async function doForgot(){
  if(_busy||!sb)return;
  const em=($('fem').value||'').trim().toLowerCase();
  if(!em){toast('请输入邮箱');return;}
  _busy=true;render();
  // redirectTo 必须在 Supabase 的 Redirect URLs 白名单里，否则 GoTrue 会静默换成 Site URL
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  // 传输层失败要说（限流 / SMTP / redirect_to 不在白名单）—— 跟「有没有这个账号」无关
  if(error){console.warn('[ym] resetPasswordForEmail failed:',error);
    _busy=false;render();toast('发不出去：'+(error.message||'服务端错误')
      +' —— 这跟邮箱有没有账号无关，请截图给主办方');return;}
  _busy=false;
  // 不区分「这个邮箱存不存在」—— 否则这个表单就成了账号存在性探测器
  TAB='login';render();
  toast('如果这个邮箱有账号，信已经发出了 —— 请查收（也看一下垃圾邮件）');
}
async function doNewPw(){
  if(_busy||!sb)return;
  const a=$('np1').value||'',b=$('np2').value||'';
  if(a.length<8){toast('密码至少 8 位');return;}
  if(a!==b){toast('两次输入不一样');return;}
  _busy=true;render();
  const {error}=await sb.auth.updateUser({password:a});
  _busy=false;
  if(error){toast('改不了：'+error.message);render();return;}
  RECOVERY=false;TAB='';
  toast('密码已更新');
  if(MYCODES===null)load();else render();
}
function signOut(){sb.auth.signOut().then(()=>{MYCODES=null;SHARES=null;MINE=[];TAB='login';render();});}


/* ---------- data ---------- */
async function load(){
  MYCODES=null;SHARES=null;TAKEN={};render();
  // 0015: binding happens at REGISTRATION (ym_redeem_code) — there is no separate claim step that
  // can silently bind nothing, which is what used to produce 「我拿到码了但什么都没有」.
  const me=await sb.from('ym_code').select('code,role,paid,rank,revoked,host');
  if(me.error){toast('读取身份失败：'+me.error.message);MYCODES=[];render();return;}
  MYCODES=me.data||[];
  if(!MYCODES.length){render();return;}
  const {data,error}=await sb.from('ym_share').select('host,payload,updated_at');
  if(error){toast('读取失败：'+error.message);SHARES=[];render();return;}
  SHARES=data||[];
  await loadMine();
  render();
}
async function loadMine(){
  const {data,error}=await sb.from('ym_submit')
    .select('id,host,event_id,chip_id,kind,status,note,host_note,hours,cost,amount,diff,file_name,created_at');
  MINE=error?[]:(data||[]);
}
function upFile(host,evId,cid,input){
  const f=input.files&&input.files[0];input.value='';if(!f)return;
  const send=(b64,name,mime)=>{
    if(b64.length>600000){toast('这张太大了（约 400KB 以内），请重拍或裁一下');return;}
    sb.from('ym_submit').insert({host,member:SESSION.user.id,event_id:evId,chip_id:cid,
      kind:'file',slot:uid(),file_name:String(name).slice(0,200),file_mime:mime,file_data:b64})
      .then(({error})=>{
        if(error){toast(/row-level|policy/i.test(error.message)
          ? '主办方还没发布这一项，请稍后再试' : '上传失败：'+error.message);return;}
        loadMine().then(()=>{render();toast('票据已传给主办方');});});
  };
  if(f.type==='application/pdf'){
    if(f.size>400000){toast('这个文件太大了（约 400KB 以内）');return;}
    const rd=new FileReader();
    rd.onload=()=>send(String(rd.result).split(',')[1]||'',f.name||'票据.pdf','application/pdf');
    rd.readAsDataURL(f);
  }else{
    toast('处理中…');
    shrink(f,b64=>send(b64,f.name||'票据.jpg','image/jpeg'));
  }
}
/* 捐赠票据 (owner 2026-07-27 ①d)。捐赠者在这套系统里从来没有过写入面 —— 0015 §8 的
   ym_share_guest_guard 就是为了让 D/O 没有任何东西可以提交而存在的。这是唯一一扇门：
   一张票据 + 一个可留空的金额，锚在「这场公开活动」上，chip_id 永远是 ''。
   没有任务、没有工时、没有自费，也永远看不到任何别人。金额只是申报 —— 以主办方核对后的为准。 */
function giveBox(host,evId){
  const mine=MINE.filter(r=>r.kind==='give'&&r.host===host&&r.event_id===evId);
  const G='g_'+evId;
  return `<div class="give">
    <div class="lbl" style="margin-bottom:6px">捐赠票据</div>
    ${mine.map(r=>`<div class="mine">${ico('clip')}${esc(r.file_name||'票据')}${
      r.amount?' · ¥'+Number(r.amount).toLocaleString():''}
      ${r.status==='accepted'?'<span class="said">✓ 主办方已收讫入账</span>'
       :r.status==='rejected'?`<span class="back">主办方：${esc(r.host_note||'请重新提交')}</span>
          <span class="x" onclick="withdraw('${escq(r.id)}')">清除</span>`
       :`<span class="x" onclick="withdraw('${escq(r.id)}')">撤回</span>`}</div>`).join('')}
    <div class="subm">
      <input id="${esc(G)}a" inputmode="numeric" placeholder="金额（円 · 可留空）">
      <input id="${esc(G)}n" placeholder="留言 / 用途（可留空）">
      <div class="acts"><label class="fileup">${ico('clip')}上传票据
        <input type="file" accept="image/*,application/pdf" style="display:none"
          onchange="upGive('${escq(host)}','${escq(evId)}',this)"></label></div></div>
    <p class="note" style="margin-top:4px">交给主办方核对入账，以主办方核对后的金额为准。</p></div>`;
}
function upGive(host,evId,input){
  const f=input.files&&input.files[0];input.value='';if(!f)return;
  const g=i=>{const el=$('g_'+evId+i);return el?el.value.trim():'';};
  const a=parseInt(String(g('a')).replace(/[^\d]/g,''),10);
  const note=String(g('n')||'').slice(0,2000);
  const send=(b64,name,mime)=>{
    if(b64.length>600000){toast('这张太大了（约 400KB 以内），请重拍或裁一下');return;}
    sb.from('ym_submit').insert({host,member:SESSION.user.id,event_id:evId,chip_id:'',
        kind:'give',slot:uid(),note,file_name:String(name).slice(0,200),
        file_mime:mime,file_data:b64,
        amount:isNaN(a)?null:Math.min(10000000,Math.max(0,a))})
      .then(({error})=>{
        if(error){toast(/row-level|policy/i.test(error.message)
          ? '这场活动现在不能提交捐赠票据' : '上传失败：'+error.message);return;}
        loadMine().then(()=>{render();toast('票据已交给主办方 —— 等确认入账');});});
  };
  if(f.type==='application/pdf'){
    if(f.size>400000){toast('这个文件太大了（约 400KB 以内）');return;}
    const rd=new FileReader();
    rd.onload=()=>send(String(rd.result).split(',')[1]||'',f.name||'票据.pdf','application/pdf');
    rd.readAsDataURL(f);
  }else{toast('处理中…');shrink(f,b64=>send(b64,f.name||'票据.jpg','image/jpeg'));}
}
async function withdraw(id){
  const {error}=await sb.from('ym_submit').delete().eq('id',id);
  if(error){toast('撤回失败：'+error.message);return;}
  await loadMine();render();toast('已撤回');
}

if(sb){
  if(RECOVERY_ERR)setTimeout(()=>toast('这个重设链接不能用了（'+decodeURIComponent(RECOVERY_ERR).replace(/\+/g,' ')+'）—— 请重新点一次「忘记密码了」'),300);
  sb.auth.getSession().then(({data})=>{SESSION=data.session;
    if(RECOVERY_URL&&SESSION){RECOVERY=true;render();return;}   // 事件没赶上也照样进设密码
    if(SESSION)load();else render();});
  sb.auth.onAuthStateChange((ev2,s2)=>{
    const was=SESSION&&SESSION.user.id,now=s2&&s2.user.id;
    SESSION=s2;_bad='';
    // 点重设邮件的链接回来时 supabase-js 会先建立一个 recovery 会话再发这个事件。
    // 必须挡在 load() 前面，否则页面会直接进内容页，用户永远看不到设密码这一步。
    if(ev2==='PASSWORD_RECOVERY'){RECOVERY=true;render();return;}
    if(was!==now){if(s2)load();else{SHARES=null;MINE=[];RECOVERY=false;TAB='login';render();}}});
}else{$('app').innerHTML='<div class="empty">加载失败，请刷新</div>';}
render();
</script>
