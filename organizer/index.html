<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>主办台 · ym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../sanitize.js"></script>
<style>
  /* ym identity — the reception table (see ym/design/ym-event-day.jsx) */
  :root{
    --felt:#16241E;--felt-up:#1E3129;--stock:#E8E0CD;--stock-dim:#8E9A90;
    --brass:#C9A356;--brass-dim:#6E5F36;--ink:#0E1512;--muted:#7C8F85;
    --line:#2C4238;--alarm:#D2604A;--ok:#7FA98A;
    --w:1060px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:#0E1713;color:var(--stock);
    font:14px/1.6 "Noto Sans JP",-apple-system,"PingFang SC","Hiragino Sans",sans-serif}
  .num{font-family:Oswald,sans-serif;font-variant-numeric:tabular-nums}
  .app{max-width:var(--w);margin:0 auto;min-height:100vh;background:var(--felt);position:relative}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  input,select,textarea{font:inherit;color:var(--stock);background:var(--felt-up);
    border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
  input::placeholder,textarea::placeholder{color:var(--brass-dim)}
  input:focus,select:focus{outline:1px solid var(--brass);border-color:var(--brass)}
  .muted{color:var(--muted)}
  .lbl{font-size:10px;letter-spacing:.2em;color:var(--muted)}
  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;height:50px;display:flex;align-items:center;gap:12px;
    padding:0 14px;background:var(--felt);border-bottom:1px solid var(--line)}
  .topbar .logo{font-family:Oswald,sans-serif;font-size:17px;color:var(--brass);letter-spacing:.06em}
  .topbar .ttl{font-size:12px;color:var(--muted);letter-spacing:.18em}
  .topbar .sp{flex:1}
  .navlinks{display:flex;gap:2px}
  .navlinks button{color:var(--muted);font-size:12.5px;letter-spacing:.08em;padding:7px 9px;border-radius:4px;
    white-space:nowrap}
  /* 5 个 tab 在 375px 上按原尺寸会每个折成两行。收紧字距和内边距，让它们各占一行 —— 换行的
     导航比小一号的字难读得多。 */
  @media(max-width:430px){
    .navlinks{gap:0}
    .navlinks button{font-size:11.5px;letter-spacing:0;padding:7px 5px}
  }
  .navlinks button.on{color:var(--brass);border-bottom:2px solid var(--brass);border-radius:0}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--brass);color:var(--ink);
    font-weight:700;display:grid;place-items:center;font-size:12px;flex:none}
  /* layout: library panel + sheet */
  .wrap{display:flex;align-items:flex-start}
  .main{flex:1;min-width:0;padding:14px 14px 90px}
  .panel{width:252px;flex:none;position:sticky;top:50px;max-height:calc(100vh - 50px);
    overflow:auto;padding:14px 12px 30px;border-right:1px solid var(--line);display:none}
  @media(min-width:900px){.panel{display:block}.fab{display:none}}
  /* phone drawer */
  .drawerbg{position:fixed;inset:0;background:rgba(8,12,10,.6);z-index:40}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(78vw,300px);z-index:41;background:var(--felt);
    border-right:1px solid var(--line);overflow:auto;padding:14px 12px 30px;
    animation:slidein .18s ease}
  @keyframes slidein{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
  /* light, not heavy: quiet icon affordances rather than solid buttons (owner) */
  .fab{position:fixed;bottom:20px;left:16px;z-index:30;background:rgba(201,163,86,.10);color:var(--brass);
    border:1px solid var(--brass-dim);border-radius:6px;padding:8px 13px;font-size:12.5px;
    font-weight:600;letter-spacing:.06em;box-shadow:none;opacity:.85}
  .fab:hover{opacity:1;background:rgba(201,163,86,.18)}
  /* round corner fabs (camera / mic) — line icons; position:fixed directly (iOS absolute-in-fixed bug) */
  .rfab{position:fixed;z-index:38;width:42px;height:42px;border-radius:50%;
    right:max(16px,calc(50vw - var(--w)/2 + 16px));
    background:transparent;border:1px solid var(--line);color:var(--brass);
    display:grid;place-items:center;font-size:18px;cursor:pointer;opacity:.7;
    box-shadow:none;transition:transform .12s,opacity .12s,background .12s;
    -webkit-user-select:none;user-select:none}
  .rfab:hover{opacity:1;background:rgba(201,163,86,.08);border-color:var(--brass-dim)}
  .rfab:active{transform:scale(.92)}
  .rfab.rec{background:var(--alarm);border-color:var(--alarm);color:#fff;animation:rfabpulse 1.1s infinite}
  @keyframes rfabpulse{0%,100%{box-shadow:0 0 0 0 rgba(210,96,74,.5),0 4px 14px rgba(0,0,0,.45)}
    50%{box-shadow:0 0 0 10px rgba(210,96,74,0),0 4px 14px rgba(0,0,0,.45)}}
  .modal-g{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:50;
    width:min(94vw,520px);max-height:80vh;overflow:auto}
  /* ===== 发布 (Y6) ===== */
  .petool{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 7px}
  .petool button{border:1px solid var(--line);border-radius:3px;padding:6px 9px;font-size:12px;color:var(--stock-dim)}
  .petool button:hover{border-color:var(--brass);color:var(--brass)}
  .pe{background:var(--felt-up);border:1px solid var(--line);border-radius:4px;min-height:260px;
    padding:13px 15px;font-size:14px;line-height:1.9;overflow-wrap:break-word;overflow:auto;max-height:52vh}
  .pe:focus{outline:1px solid var(--brass);border-color:var(--brass)}
  .pe h2{font-size:16.5px;margin:14px 0 6px}.pe h3{font-size:14.5px;margin:12px 0 5px}
  .pe p{margin:8px 0}.pe ul,.pe ol{margin:8px 0;padding-left:22px}
  .pe img{max-width:100%;height:auto;border-radius:3px;display:block;margin:8px 0}
  .pe a{color:var(--brass);text-decoration:underline}
  .pe blockquote{border-left:2px solid var(--brass-dim);margin:8px 0;padding-left:11px;color:var(--stock-dim)}
  .pe table{border-collapse:collapse;width:100%;margin:8px 0}
  .pe td,.pe th{border:1px solid var(--line);padding:5px 8px;font-size:13px;text-align:left}
  .pe:empty:before{content:attr(data-ph);color:var(--brass-dim)}
  .postrow{display:flex;gap:10px;align-items:baseline;background:var(--felt-up);border:1px solid var(--line);
    border-radius:5px;padding:11px 13px;margin-bottom:7px;width:100%;text-align:left}
  .postrow .k{font-size:10px;letter-spacing:.14em;color:var(--muted);flex:none;width:34px}
  .postrow .tt{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .postrow .st{font-size:10.5px;flex:none;letter-spacing:.1em}
  .postrow .st.on{color:var(--brass)}.postrow .st.off{color:var(--muted)}
  .postrow.ev{border-style:dashed}
  /* library */
  .libtabs{display:flex;gap:3px;margin-bottom:12px}
  .libtabs button{flex:1;font-size:11px;letter-spacing:.04em;padding:7px 0;color:var(--muted);
    border:1px solid var(--line);border-radius:4px;white-space:nowrap}
  .libtabs button.on{color:var(--ink);background:var(--stock);border-color:var(--stock);font-weight:700}
  .libitem{display:block;width:100%;text-align:left;background:var(--felt-up);border:1px solid var(--line);
    border-radius:4px;padding:9px 11px;margin-bottom:7px;transition:transform .12s ease}
  .libitem:hover{border-color:var(--brass)}
  .libitem:active{transform:translateY(-2px)}
  .libitem .t{font-size:13px}
  .libitem .m{font-size:10.5px;color:var(--muted);margin-top:2px}
  /* light icons on a 名册 card — never heavy buttons (owner's creed) */
  .libitem .ic{color:var(--brass-dim);cursor:pointer;font-size:13px;line-height:1;padding:2px 5px;
    margin-left:2px;border-radius:3px;opacity:.8}
  .libitem .ic:hover{opacity:1;color:var(--brass);background:rgba(201,163,86,.10)}
  .libitem .ic.on{opacity:1}   /* granted: the card already says ☁ <email> — the icon just brightens */
  .libitem .ic.del:hover{color:var(--alarm);background:rgba(210,96,74,.10)}
  .libhint{font-size:10.5px;color:var(--muted);line-height:1.7;margin:10px 2px}
  /* sheet */
  .evhead{background:var(--felt-up);border:1px solid var(--line);border-radius:6px;padding:13px 14px;margin-bottom:12px}
  .evhead.sel{border-color:var(--brass)}
  .evhead .name{font-size:16px;font-weight:700}
  .evhead .meta{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.06em}
  .rowcard{display:flex;gap:10px;background:var(--felt-up);border:1px solid var(--line);
    border-radius:6px;padding:10px 12px;margin-bottom:8px;position:relative}
  .rowcard.sel{border-color:var(--brass)}
  .rowcard .tm{width:64px;flex:none}
  .rowcard .tm input{padding:6px 4px;text-align:center;font-family:Oswald,sans-serif;font-size:14px}
  /* 时长 + 排出来的结束时刻 (owner 2026-07-27) */
  .rowcard .tm .durin{font-size:11.5px;padding:3px 4px;margin-top:3px;color:var(--brass)}
  .rowcard .tm .tmend{display:block;text-align:center;font-family:Oswald,sans-serif;
    font-size:10.5px;color:var(--muted);margin-top:2px}
  .rowcard.dragging{opacity:.75;border-color:var(--brass);box-shadow:0 8px 20px -6px rgba(0,0,0,.6)}
  .rowops .draghandle{color:var(--brass-dim);font-size:14px;line-height:1;padding:3px 5px;cursor:grab;
    text-align:center;touch-action:none;user-select:none}
  .rowops .draghandle:active{cursor:grabbing;color:var(--brass)}
  /* 口述话筒 —— 每个输入框旁边一个 (owner 2026-07-27) */
  .micbtn{flex:none;width:30px;height:30px;border:1px solid var(--brass-dim);border-radius:6px;
    color:var(--brass);display:inline-flex;align-items:center;justify-content:center;background:none}
  .micbtn:hover{background:rgba(201,163,86,.12)}
  .micbtn.rec{background:var(--alarm);color:var(--stock);border-color:var(--alarm);
    animation:micpulse 1.1s ease-in-out infinite}
  .micbtn.busy{opacity:.5}
  .micbtn .ico{width:15px;height:15px}
  @keyframes micpulse{0%,100%{opacity:1}50%{opacity:.55}}
  .fldmic{display:flex;gap:6px;align-items:center}
  .fldmic input,.fldmic textarea{flex:1;min-width:0}
  .schedbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
    font-size:11.5px;color:var(--muted);margin:12px 2px 6px}
  .schedbar .num{font-family:Oswald,sans-serif;font-size:13px;color:var(--brass)}
  .rowcard .bd{flex:1;min-width:0}
  .rowcard .bd input{padding:6px 8px}
  .rowcard .seg2{display:flex;gap:6px}
  .rowcard .seg2 .segi{flex:2}.rowcard .seg2 .owni{flex:1}
  .rowops{display:flex;flex-direction:column;gap:2px;flex:none;justify-content:center}
  .rowops button{color:var(--brass-dim);font-size:12px;padding:2px 5px;border-radius:3px}
  .rowops button:hover{color:var(--brass)}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  /* fold-to-major: in fold mode show only 环节 + a summary; the SELECTED row (or 全部展开) expands its chips */
  .descwrap{display:flex;gap:6px;align-items:center;margin-top:6px}
  .descsi{flex:1;min-width:0;background:var(--felt);border:1px solid var(--line);border-radius:5px;
    color:var(--stock);font-size:12px;padding:6px 9px}
  /* ✨ AI 补写 */
  .aibtn{flex:none;font-size:13px;line-height:1;background:rgba(201,163,86,.1);border:1px solid var(--brass-dim);
    border-radius:6px;color:var(--brass);cursor:pointer;padding:6px 9px}
  .aibtn:hover{background:rgba(201,163,86,.2)}
  .aibtn:disabled{opacity:.5;cursor:default}
  .jobdlg .descwrap{margin-top:0}
  /* 牵手成功 — the event's headline result */
  .matchsec{border-color:var(--brass-dim)}
  .matchrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .matchin{width:112px;font-family:Oswald,sans-serif;font-size:40px;line-height:1;color:var(--brass);
    background:transparent;border:none;border-bottom:2px solid var(--brass-dim);padding:0 4px;text-align:center}
  .matchin:focus{outline:none;border-bottom-color:var(--brass)}
  .matchrow .mu{font-size:15px;color:var(--brass);font-weight:700}
  .matchrow .mrate{font-size:11.5px;color:var(--muted);margin-left:auto}
  .rvsum{width:100%;background:var(--felt);border:1px solid var(--line);border-radius:6px;
    color:var(--stock);font-size:13px;padding:9px 11px;line-height:1.7;resize:vertical;font-family:inherit}
  .rvsum:focus{border-color:var(--brass-dim);outline:none}
  .rowfiles{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
  .filechip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--stock-dim);
    background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:3px 9px;cursor:pointer}
  .filechip .x{color:var(--brass-dim)}
  .fileadd{font-size:10.5px;color:var(--brass);border:1px dashed var(--brass-dim);border-radius:12px;padding:3px 9px;cursor:pointer}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:3px;
    background:var(--felt);border:1px solid var(--line);color:var(--stock-dim);cursor:pointer;user-select:none}
  .chip .x{color:var(--brass-dim);padding:0 1px}
  .chip .x:hover{color:var(--alarm)}
  .chip.s0{border-style:dashed}
  .chip.s1{border-color:var(--brass-dim);color:var(--stock)}
  .chip.s2{border-color:var(--brass);color:var(--brass)}
  .chip.s3{background:var(--stock);border-color:var(--stock);color:var(--ink);font-weight:700;
    box-shadow:0 3px 8px -2px rgba(0,0,0,.5)}
  .chip.money{border-radius:12px}
  .chip.money.in{color:var(--ok)}
  .chip.money.out{color:var(--stock-dim)}
  .chip.money .amt{font-family:Oswald,sans-serif;font-size:11.5px}
  /* jobs (要做的事) on a 环节 — a to-do, colored by 待办/进行中/完成 */
  .chip.job{border-radius:12px;border-style:solid}
  .chip.job.b0{border-color:var(--alarm);color:var(--alarm)}
  .chip.job.b1{border-color:var(--brass-dim);color:var(--brass)}
  .chip.job.b2{background:var(--ok);border-color:var(--ok);color:var(--ink);font-weight:700}
  .chip.job.ig{opacity:.55;border-style:dashed;color:var(--muted)}
  .chip.job .lbl{font-size:9.5px}
  .chipadd{font-size:10.5px;color:var(--brass);background:none;border:1px dashed var(--brass-dim);
    border-radius:12px;padding:3px 9px;cursor:pointer;letter-spacing:.02em}
  .chipadd:hover{border-color:var(--brass);background:rgba(201,163,86,.08)}
  /* reuse prompt — 场地履历 etc. (the assets remember themselves) */
  .reusehint{margin-top:8px;font-size:11px;color:var(--brass);background:rgba(201,163,86,.07);
    border:1px solid var(--brass-dim);border-radius:6px;padding:6px 10px;cursor:pointer;display:inline-block}
  .reusehint:hover{background:rgba(201,163,86,.13)}
  .addrow{width:100%;border:1px dashed var(--line);border-radius:6px;padding:11px;color:var(--muted);
    font-size:12.5px;letter-spacing:.1em;margin:2px 0 16px}
  .addrow:hover{border-color:var(--brass);color:var(--brass)}
  /* strips */
  .strips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .strip{flex:1;min-width:230px;background:var(--felt-up);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
  .strip .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .strip .hd .lbl{font-size:10px}
  .stcounts{display:flex;gap:10px}
  .stcounts .c{text-align:center}
  .stcounts .c .n{font-family:Oswald,sans-serif;font-size:19px;line-height:1.1}
  .stcounts .c .l{font-size:9.5px;color:var(--muted);letter-spacing:.06em}
  .stcounts .c.warn .n{color:var(--alarm)}
  .stcounts .c.ok .n{color:var(--brass)}
  .mline{display:flex;justify-content:space-between;font-size:12px;margin:3px 0}
  .mline .num{font-size:13px}
  .mline.total{border-top:1px solid var(--line);padding-top:5px;margin-top:5px;font-weight:700}
  .mline .neg{color:var(--alarm)}.mline .pos{color:var(--ok)}
  /* event switcher */
  .evsw{display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .evsw select{flex:1;min-width:150px}
  .btn{background:var(--brass);color:var(--ink);border-radius:4px;padding:9px 14px;font-size:12.5px;
    font-weight:700;letter-spacing:.06em;flex:none}
  .btn.ghost{background:none;color:var(--brass);border:1px solid var(--brass-dim)}
  .btn.sm{padding:6px 10px;font-size:11.5px}
  .btn.danger{background:none;color:var(--alarm);border:1px solid var(--alarm);opacity:.85}
  /* today */
  .todaycard{background:var(--felt-up);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
  .todaycard .d{font-size:11px;color:var(--muted);letter-spacing:.14em}
  .todaycard .t{font-size:15px;font-weight:700;margin-top:2px}
  .todaycard .fu{font-size:12px;color:var(--stock-dim);margin-top:6px;line-height:1.8}
  .todaycard .fu b{color:var(--alarm);font-weight:700}
  .sec{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:18px 2px 9px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
  .cal .dow{text-align:center;font-size:10px;color:var(--muted);padding:2px 0}
  .cal .day{border:1px solid var(--line);border-radius:4px;min-height:44px;padding:3px 4px;font-size:10.5px;color:var(--muted)}
  .cal .day.out{opacity:.3}
  .cal .day.today{border-color:var(--brass)}
  .cal .day .dot{margin-top:3px;font-size:9px;color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:12.5px;line-height:2}
  /* library manage view */
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  /* 分组：物资按大类、灵感按四类 (owner 2026-07-27) */
  .libgroup{margin-bottom:14px}
  .libgroup .gh{font-size:10px;letter-spacing:.16em;color:var(--muted);margin:0 2px 6px;
    display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .libgroup .gh .n{font-family:Oswald,sans-serif;color:var(--brass);letter-spacing:0}
  .libgroup .gh .gn{font-size:10px;letter-spacing:.02em;opacity:.7}
  .addform{background:var(--felt-up);border:1px dashed var(--line);border-radius:6px;padding:11px;margin-top:10px}
  .addform .frow{display:flex;gap:6px;margin-bottom:6px}
  /* ===== day mode 当天 (design: ym/design/ym-event-day.jsx) ===== */
  .dayhead{display:flex;align-items:flex-end;justify-content:space-between;padding:2px 2px 12px;
    border-bottom:1px solid var(--line);margin-bottom:14px}
  .dayhead .d{font-size:10px;color:var(--muted);letter-spacing:.18em}
  .dayhead .d .bk{color:var(--brass);cursor:pointer}
  .dayhead .t{font-size:15px;font-weight:500;margin-top:4px}
  .ratio{text-align:right}
  .ratio .n{font-family:Oswald,sans-serif;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
  .ratio .l{font-size:9px;letter-spacing:.12em;color:var(--muted);margin-top:3px}
  .ratio.bad .n,.ratio.bad .l{color:var(--alarm)}
  .cols{display:flex;gap:12px}
  .col{flex:1;min-width:0}
  .colsep{width:1px;background:var(--line);flex:none}
  .colhd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;padding:0 2px}
  .colhd .g{font-size:11px;letter-spacing:.18em;color:var(--muted)}
  .colhd .c{font-family:Oswald,sans-serif;font-size:13px;color:var(--stock-dim)}
  .colhd .c.full{color:var(--brass)}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .badge{position:relative;aspect-ratio:1/1.15;display:flex;flex-direction:column;align-items:center;

  .badge.on{background:var(--stock);border:1px solid var(--stock);color:var(--ink);

  .badge.on .bl{opacity:.75}

  .ticketbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--felt-up);
    border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:16px 0 8px;font-size:12px}
  .boardops{display:flex;gap:8px;margin-top:10px}
  .note9{font-size:10px;color:var(--muted);margin-top:16px;line-height:1.8}
  .daytabs{position:fixed;bottom:0;left:0;right:0;background:var(--felt);border-top:1px solid var(--line);

  .daytabs button{flex:1;padding:15px 0 calc(15px + env(safe-area-inset-bottom));font-size:12px;
    letter-spacing:.2em;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
  .daytabs button.on{color:var(--brass);border-top-color:var(--brass)}
  .runrow{display:flex;gap:10px;align-items:center;padding:12px 10px;border:1px solid var(--line);

  .runrow .rt{font-family:Oswald,sans-serif;font-size:15px;width:52px;flex:none;color:var(--stock-dim)}
  .runrow .rs{flex:1;min-width:0;font-size:13.5px}
  .runrow .rs .ow{font-size:10.5px;color:var(--muted)}
  /* 当天改时长 —— 不给宽度的话全局 input{width:100%} 会把环节名挤成一竖行 */
  .runrow .durin{width:44px;flex:none;padding:4px 3px;text-align:center;
    font-family:Oswald,sans-serif;font-size:12px;color:var(--brass)}
  .runrow .ra{font-family:Oswald,sans-serif;font-size:12px;color:var(--brass);flex:none}
  .runrow .tag9{font-size:9px;letter-spacing:.18em;color:var(--brass);flex:none}
  .runrow.done{opacity:.45}
  .runrow.now{border-color:var(--brass);background:var(--felt-up)}
  .runrow.next{border-style:dashed;border-color:var(--brass-dim)}
  .whochips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .whochip{border-radius:3px;padding:7px 11px;border:1px solid var(--line);color:var(--stock-dim);
    font-family:Oswald,sans-serif;font-size:13px;font-variant-numeric:tabular-nums}
  .whochip.on{background:var(--stock);border-color:var(--stock);color:var(--ink)}
  .recbtn{width:100%;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:3px;transition:border-color .16s ease}
  .recbtn.rec{background:var(--felt-up);border-color:var(--brass)}

  .recbtn.rec .recline{opacity:1}
  .reclbl{font-size:11px;color:var(--muted);margin-top:14px;letter-spacing:.12em}
  .recbtn.rec .reclbl{color:var(--brass)}
  .stockcard{background:var(--stock);color:var(--ink);border-radius:3px;padding:16px;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.7);margin-top:14px}
  .stockcard .schd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .stockcard .schd .who{font-family:Oswald,sans-serif;font-size:20px}
  .stockcard .schd .sub{font-size:11px;opacity:.5}
  .sfield{margin-bottom:11px}
  .sfield .fl{font-size:9px;opacity:.5;letter-spacing:.18em;margin-bottom:3px}
  .sfield input,.sfield textarea{background:none;border:0;border-bottom:1.5px solid rgba(14,21,18,.25);
    border-radius:0;color:var(--ink);padding:4px 2px;font-size:13px;width:100%}
  .sfield input:focus,.sfield textarea:focus{outline:none;border-bottom-color:var(--brass-dim)}
  .sfield.blank input{border-bottom:1.5px dotted rgba(14,21,18,.5)}
  .sfield .hint9{font-size:10px;color:var(--alarm);opacity:.85}
  .sgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .scbtns{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(14,21,18,.15)}
  .scbtns .ok{flex:1;background:var(--ink);color:var(--stock);border-radius:3px;padding:11px;
    font-size:12px;letter-spacing:.08em}
  .scbtns .alt{border:1px solid rgba(14,21,18,.25);border-radius:3px;padding:11px 16px;font-size:12px}
  .transcript9{font-size:10px;margin-top:10px;line-height:1.7;color:rgba(14,21,18,.55)}
  .draftline{font-size:13.5px;line-height:1.8}
  /* ===== Y8 票据 → 台账 ===== */
  .stockcard .rcwarn{background:rgba(190,90,60,.14);color:var(--alarm);border-radius:4px;
    padding:7px 9px;font-size:11.5px;line-height:1.6;margin:0 0 9px}
  .stockcard .rcwho{margin:10px 0;padding:8px 10px;border:1px dashed var(--brass-dim);border-radius:5px}
  .stockcard .rcwho .fl{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
  .stockcard .rcfold{font-size:11.5px;color:var(--brass);cursor:pointer;margin:11px 0 4px}
  .stockcard select{width:100%;padding:8px 10px;font:inherit}
  .chip.money .rcn{font-size:10px;color:var(--brass);margin-left:5px;opacity:.85}
  .rclines{font-size:11.5px;color:var(--muted);line-height:1.9;margin-top:8px}
  .rclines>div{cursor:pointer}
  .rclines .void{opacity:.45;text-decoration:line-through}
  /* 一行两半（附件名 + 入账）—— .pendbox .pf 本身是 inline-block，flex:1 在里面不起作用 */
  .pendbox .pf.two{display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box}
  /* the ledger list — a CSS grid that COLLAPSES on a phone, never an 820px sideways table */
  .ledrow{display:grid;grid-template-columns:78px 1fr 96px 46px;gap:8px;align-items:baseline;
    padding:9px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
  .ledrow.hd{font-size:9.5px;letter-spacing:.16em;color:var(--muted);border-bottom:1px solid var(--brass-dim)}
  .ledrow.void{opacity:.45;text-decoration:line-through}
  .ledrow .v{font-family:Oswald,sans-serif;font-size:10.5px;color:var(--muted)}
  .ledrow .a{font-family:Oswald,sans-serif;font-size:14px;text-align:right;white-space:nowrap}
  .ledrow .m{font-size:10.5px;color:var(--muted);display:block;line-height:1.7}
  .ledrow .rz{font-size:10.5px;color:var(--brass);cursor:pointer;text-align:right}
  @media(max-width:430px){.ledrow{grid-template-columns:1fr 92px;grid-auto-rows:min-content}
    .ledrow .v{grid-column:1/3}.ledrow .rz{grid-column:2;text-align:right}
    /* 4 个表头挤进 2 列会折成看不懂的三行 —— 手机上每一行本来就自带标签，表头直接收起来 */
    .ledrow.hd{display:none}}
  .ledtag{font-size:9.5px;border:1px solid var(--brass-dim);border-radius:3px;padding:0 4px;margin-left:5px}
  .ledbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .ledf{font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;
    color:var(--muted);cursor:pointer}
  .ledf.on{color:var(--brass);border-color:var(--brass-dim)}
  /* ===== 复盘 review + 保存回资产库 ===== */
  .rvsec{background:var(--felt-up);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
  .rvsec .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .rvrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rvrow:last-child{border-bottom:0}
  .rvrow .c1{font-family:Oswald,sans-serif;width:50px;flex:none;color:var(--stock-dim)}
  .rvrow .c2{flex:1;min-width:0}
  .rvrow .c3{font-family:Oswald,sans-serif;color:var(--brass)}
  .rvrow .gap{font-size:11px;flex:none}
  .rvrow .gap.late{color:var(--alarm)}
  .rvrow .gap.early,.rvrow .gap.ontime{color:var(--ok)}
  .rvrow .gap.miss{color:var(--muted)}
  .exports{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .sbitem{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:9px 11px;
    border:1px dashed var(--line);border-radius:4px;margin-bottom:6px;color:var(--stock-dim);font-size:12.5px}
  .sbitem.on{border:1px solid var(--brass);color:var(--stock)}
  .sbitem .tick{width:16px;flex:none;color:var(--brass);font-size:13px}
  .sbitem .what{flex:1;min-width:0}
  .sbitem .delta{font-family:Oswald,sans-serif;font-size:12px;color:var(--brass)}
  .sbsec{font-size:10px;letter-spacing:.2em;color:var(--muted);margin:14px 2px 8px}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:60;background:var(--stock);
    color:var(--ink);font-size:12.5px;padding:9px 16px;border-radius:4px;box-shadow:0 8px 20px -4px rgba(0,0,0,.6)}
  .hintbar{font-size:11px;color:var(--muted);line-height:1.7;margin:0 2px 12px}
  .hintbar b{color:var(--brass);font-weight:500}
  /* read-only回看: disable editing on the sheet without disabling scroll */
  .main.ro input,.main.ro select,.main.ro textarea,.main.ro .chip{pointer-events:none;opacity:.9;background:var(--felt)}
  .main.ro .chip .x,.main.ro .rowops,.main.ro .addrow,.main.ro .libitem,.main.ro .strip .btn,
  .main.ro .evsw .btn.danger,.main.ro .rowcard .tm,.main.ro label.btn{pointer-events:none;opacity:.5}
  /* ===== 工作台 desk ===== */
  .deskcard{position:relative;display:block;width:100%;text-align:left;background:var(--felt-up);border:1px solid var(--line);
    border-radius:6px;padding:11px 13px;margin-bottom:7px}
  .deskcard:hover{border-color:var(--brass)}
  /* 当前 (live) event sits darker so it reads apart from 筹备中 */
  .deskcard.cur{background:var(--ink);border-color:var(--brass-dim);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
  .deskcard .dc-t{font-size:14.5px;font-weight:700}
  .deskcard .dc-m{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
  .deskcard .dc-m b{color:var(--alarm)}
  .deskcard .dc-brief{display:none;font-size:11px;color:var(--stock-dim);margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
  @media(hover:hover){.deskcard:hover .dc-brief{display:block}}
  .deskcard .dc-brief .t{color:var(--brass);cursor:pointer;font-weight:700}
  .deskcard .dc-del{position:absolute;top:6px;right:10px;color:var(--brass-dim);cursor:pointer;font-size:14px;line-height:1;padding:2px 5px}
  /* 计划 / 当天 / 复盘 —— 一场活动的三个阶段，跟着活动卡走 (owner 2026-07-27) */
  /* 报名 15/30 —— 一眼就看到，所以钉在卡片右侧 (owner 2026-07-27) */
  .deskcard .dc-cap{position:absolute;top:11px;right:12px;font-family:Oswald,sans-serif;font-size:13px;
    color:var(--brass);letter-spacing:.02em;display:flex;align-items:center;gap:3px}
  .deskcard .dc-cap.full{color:var(--ok)}
  .deskcard.plan .dc-cap{right:34px}
  .deskcard .dc-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .deskcard .dc-go{font-size:11.5px;color:var(--brass);border:1px solid var(--brass-dim);
    border-radius:20px;padding:4px 11px;cursor:pointer;white-space:nowrap}
  .deskcard .dc-go:hover{background:rgba(201,163,86,.12)}
  .deskcard .dc-del:hover{color:var(--alarm)}
  /* kickoff bar (planning UI) + gate */
  .kickoff{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:11px 14px;border-radius:10px}
  .kickoff.plan{background:linear-gradient(90deg,rgba(201,163,86,.16),rgba(201,163,86,.03));border:1px solid var(--brass-dim)}
  .kickoff.run{background:var(--felt-up);border:1px solid var(--line)}
  .kickoff .st{font-size:12.5px;font-weight:700;color:var(--ok);letter-spacing:.04em}
  .kickoff .rem{font-size:11px;color:var(--muted)}
  .btn.big{font-size:14px;padding:11px 20px;font-weight:700}
  .gaterow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .gaterow .gn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gaterow .gseg{display:flex;gap:5px;flex:none}
  .gatetog{font-size:10.5px;font-weight:700;padding:4px 11px;border-radius:16px;cursor:pointer;border:1px solid var(--line);color:var(--stock-dim);white-space:nowrap}
  .gatetog.todo.on{background:rgba(210,96,74,.14);color:var(--alarm);border-color:var(--alarm)}
  .gatetog.skip.on{background:var(--felt);color:var(--brass);border-color:var(--brass-dim)}
  /* ===== 执行 tree (owner 2026-07-21, redesigned) ===== */
  .extree{max-width:600px;margin:0 auto;padding-bottom:96px}
  .exback{font-size:11px;color:var(--muted);letter-spacing:.14em;padding:2px 2px 8px}
  .exback .bk{color:var(--brass);cursor:pointer}
  /* countdown hub */
  .exhub{text-align:center;padding:4px 0 2px}
  .exhub .evn{font-size:13px;color:var(--stock);font-weight:600;margin-bottom:10px}
  .exring{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:128px;height:128px;border-radius:50%;border:2px solid var(--brass-dim);
    background:radial-gradient(circle at 50% 34%,var(--felt-up),var(--felt) 76%);
    box-shadow:inset 0 0 0 6px rgba(0,0,0,.16),0 4px 18px rgba(0,0,0,.28)}
  .exring .cd{font-family:Oswald,sans-serif;font-size:46px;line-height:.92;color:var(--brass);font-variant-numeric:tabular-nums}
  .exring .cd.over{color:var(--alarm)}
  .exring.small{border-color:var(--line)} .exring.small .cd{font-size:19px;color:var(--stock-dim);letter-spacing:.04em}
  .exring .lab{font-size:10px;letter-spacing:.14em;color:var(--muted);margin-top:4px}
  /* progress ribbon */
  .exsum{max-width:300px;margin:14px auto 2px}
  .exbar{height:6px;border-radius:3px;background:var(--felt);border:1px solid var(--line);overflow:hidden}
  .exbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass));transition:width .35s ease}
  .exsum .lg{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--muted);margin-top:7px}
  .exsum .lg b{font-weight:700}
  .exsum .lg .a b{color:var(--alarm)} .exsum .lg .g b{color:var(--ok)}
  .extrunk{width:1px;height:16px;background:var(--line);margin:8px auto 4px}
  /* bands */
  .exband{margin-bottom:16px}
  .exband .bt{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}
  .exband .bt .lbl{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.16em;font-weight:600}
  .exband .bt .lbl .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .exband .bt .lbl .n{opacity:.6;font-weight:400}
  .exband.todo  .bt .lbl{color:var(--alarm)}     .exband.todo  .dot{background:var(--alarm)}
  .exband.doing .bt .lbl{color:var(--brass)}      .exband.doing .dot{background:var(--brass)}
  .exband.done  .bt .lbl{color:var(--stock-dim)}  .exband.done  .dot{background:var(--ok)}
  .excols{display:flex;flex-direction:column;gap:0}
  @media(min-width:560px){.excols{flex-direction:row;gap:16px}.excols .exband{flex:1;min-width:0}}
  /* task row (compact, colored spine) */
  .extask{position:relative;display:flex;gap:9px;align-items:center;background:var(--felt-up);border:1px solid var(--line);
    border-left:3px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px;width:100%;text-align:left;cursor:pointer}
  .exband.todo  .extask{border-left-color:var(--alarm)}
  .exband.doing .extask{border-left-color:var(--brass)}
  .exband.done  .extask{border-left-color:var(--ok);opacity:.72}
  .extask .nm{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--stock);display:flex;align-items:baseline;gap:5px}
  /* phone: names wrap to 2 lines (a long name grows the card TALLER, never wider → no bleed across the trunk) */
  .extask .nm .nmt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;min-width:0;line-height:1.35;white-space:normal}
  .extask .due{font-size:9.5px;color:var(--brass);font-weight:600;white-space:nowrap;flex:none}
  .extask .due.over{color:var(--alarm)}
  /* hover(desktop) / tap(mobile) brief — 环节·负责，keep the card itself just name+status */
  .extask{flex-wrap:wrap}
  .extask .brief{display:none;position:static;flex:0 0 100%;width:100%;left:auto;right:auto;top:auto;z-index:14;
    margin-top:6px;background:var(--felt);border:1px solid var(--brass-dim);border-radius:8px;padding:7px 10px;
    font-size:10.5px;color:var(--stock-dim);box-shadow:none;pointer-events:none;line-height:1.55;white-space:normal}
  @media(min-width:760px){
    .extask{flex-wrap:nowrap}
    .extask .nm .nmt{display:block;-webkit-line-clamp:none;white-space:nowrap;text-overflow:ellipsis;line-height:normal}
    .extask .brief{position:absolute;flex:none;top:calc(100% - 2px);margin-top:0;
      width:min(280px,60vw);box-shadow:0 8px 26px rgba(0,0,0,.5)}
    .tlcell.l .extask .brief{right:0;left:auto}
    .tlcell.r .extask .brief{left:0;right:auto}
    .tlcanopy .extask .brief{left:8px;right:8px;width:auto}
  }
  @media(hover:hover){.extask:hover .brief{display:block}}
  /* armed = mobile tap: the brief catches taps (bubbles to the card → 2nd tap opens) so they never fall through to the covered card */
  .extask.armed .brief{display:block;pointer-events:auto}
  .extask.armed{border-color:var(--brass-dim);box-shadow:0 0 0 1px var(--brass-dim)}
  .exchip{font-size:10px;font-weight:700;padding:5px 11px;border-radius:20px;flex:none;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
  .exchip.b0{background:rgba(210,96,74,.14);color:var(--alarm);border:1px solid var(--alarm)}
  .exchip.b1{background:rgba(201,163,86,.13);color:var(--brass);border:1px solid var(--brass-dim)}
  .exchip.b2{background:var(--ok);color:var(--ink);border:1px solid var(--ok)}
  .exempty{font-size:11px;color:var(--stock-dim);padding:6px 2px 2px;opacity:.75}
  .exadd{width:100%;border:1px dashed var(--line);border-radius:8px;padding:9px;color:var(--muted);
    font-size:12px;letter-spacing:.04em;margin-top:2px}
  .exadd:hover{border-color:var(--brass);color:var(--brass)}
  .exfold{font-size:11px;color:var(--brass);cursor:pointer;font-weight:600}
  .exmoney{background:var(--felt-up);border:1px dashed var(--brass-dim);border-radius:8px;padding:9px 12px;
    font-size:12px;color:var(--stock-dim);margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .exignore{background:none;border:1px dashed var(--line);border-radius:8px;padding:9px 11px;margin-top:2px}
  .exignore .lbl{font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:5px}
  .exignore .it{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);padding:3px 0}
  .exignore .it .rz{color:var(--brass);cursor:pointer;font-size:11px;white-space:nowrap;margin-left:8px}
  .exend{display:flex;gap:8px;margin-top:18px}
  /* task detail — floating, anchored near the tapped node (JS positions it); stays oriented (no dimming) */
  .exdlgcatch{position:fixed;inset:0;z-index:49}
  /* ask() mounts on <body>, so pin it to the viewport rather than an ancestor */
  .askdlg{position:fixed;width:min(400px,calc(100vw - 24px))}
  /* 志愿者报上来的 — dashed so it reads as INCOMING, not as state the host already owns */

async function savePubName(n,force){
  const {data,error}=await sb.rpc('ym_set_public_name',{p_name:n,p_force:!!force});
  if(error){toast('保存失败：'+error.message
    +(/function|schema cache|ambiguous/i.test(error.message||'')?'（0021 迁移还没应用）':''));return;}
  if(data==='dup'){
    // ⚠ ask() 的 note 是当纯文本 esc() 出去的 —— 这里别写 markdown 星号，会原样显示
    ask({title:'已经有另一个主办在用这个名字',
      note:'两个主办同名的时候，自助申请「两边都收不到」—— 申请人手打的是名字，'
        +'他手上没有编号可以打，所以系统宁可不送，也不会送错人（你定的规矩）。'
        +'另一位并不知道你要用这个名字。要用的话，建议加上地区或全称。',
      fields:[],ok:'我知道，仍然用这个名字',fn:()=>savePubName(n,true)});
    return;}
  if(data!=='ok'&&data!=='ok-dup'){
    toast(data==='invalid'?'这个名字不能用（太长，或者去掉空白后是空的）'
      :'没有保存 —— 服务器没接受这次修改');return;}
  PROFILE=Object.assign({},PROFILE,{public_name:n});
  await loadJoin();                       // 顺手把「撞名了没有」重新读一遍
  render();
  toast(!n?'已清空公开名称 —— 现在没人能申请到你名下'
    :data==='ok-dup'?'已设为「'+n+'」—— 撞名期间两边都收不到自助申请'
    :'公开名称已设为「'+n+'」');
}

async function joinApprove(id){
  const r=(JOINREQ||[]).find(x=>x.id===id);if(!r)return;
  const cat=r.want_role==='P'?'guest':'volunteer';
  ask({title:'批准 '+esc(r.name||r.email),
    note:'会在你的名册里建一条'+(cat==='guest'?'嘉宾':'志愿者')+'记录，并生成一个邀请码。'
      +'邀请码由你发给 TA（我们不发信）—— TA 拿码在成员页注册，身份和归属都由这串码决定。'
      +(cat==='volunteer'?'自助注册的志愿者星级默认 C，之后你可以调。':''),
    fields:[{label:'名册上写什么名字',val:r.name||'',ph:'TA 报的名字'}],ok:'批准并生成邀请码',
    fn:async(v)=>{
      const nm=(v[0]||'').trim()||r.name||String(r.email||'').split('@')[0];
      // 名册记录先落地，它的 id 就是码的 ref_id —— 两边靠这个 id 认人（0015 ym_code.ref_id）
      const rec={id:uid(),name:nm,cat,type:'人',contact:r.email,
                 origin:'join',originAt:r.created_at};
      STORE.library.resources.push(rec);save();
      const {data,error}=await sb.rpc('ym_join_approve',{p_id:id,p_ref:rec.id});
      /* ⚠ 「服务端拒绝了」和「服务端做了但我没收到」不是一件事。
         supabase-js 在断网 / 502 / 切网时回 {data:null,error}，而那个事务**可能已经提交**
         （码已经铸出来、申请已经置 approved）。以前这里无条件把名册记录撤回 ——
         而 CODES 是按 ref_id 建索引的，记录一没，codeOf() 就查不到，
         「重发邀请码」那个唯一的入口也就进不去了：一串只显示一次的明文码，
         从此没有任何界面能到达它。 */
      const said=data&&data.r;                    // 服务端明确答复过
      if(said&&said!=='ok'){
        STORE.library.resources=STORE.library.resources.filter(x=>x.id!==rec.id);save();
        toast(said==='already'?'这条申请已经处理过了'
             :said==='full'?'名额已满（500）'
             :said==='exists'?'这个人已经有编号了'
             :'批准失败，请重试');
        loadJoin();return;}
      if(!said){
        // 传输层失败：**留着**名册记录，去问一次真相，让主办看得到实际状态
        await loadCodes();await loadJoin();
        if(codeOf(rec)){
          toast('网络断了一下，但编号已经生成 —— 用「重发邀请码」拿一串新的给 TA');
          _grant={pid:rec.id,role:r.want_role,invite:'',busy:false,err:''};render();grantPaint();return;}
        STORE.library.resources=STORE.library.resources.filter(x=>x.id!==rec.id);save();
        toast('没收到服务器回应，这次批准没有生效 —— 请重试');render();return;}
      /* 次序要和 codeIssue() 一致：**先** loadCodes()（把新码读进 CODES），**再**推。
         pushShares() 是按 CODES[p.id] 组装的，反过来的话新人整个被跳过，ym_share 一行都不写 ——
         对方注册成功后看到的是「主办方还没有发布内容给你，或者已经收回了这个页面的权限」。 */
      await loadCodes();
      await cloudPushAll();                       // 名册上云 + pushShares（现在是真的可等）
      await loadJoin();
      // 直接把码摊开在发码窗口里 —— 这串码只显示这一次
      _grant={pid:rec.id,role:r.want_role,invite:data.invite,busy:false,err:''};
      render();grantPaint();
      toast('已批准 —— 把邀请码发给 TA');}});
}

/* ---------- 用户编码 + 邀请码 (0015) ----------
   The 16-char 邀请码 lives ONLY in _grant, for the one paint that shows it. It is NEVER written to
   a 名册 record: cloudPushAll() uploads STORE.library verbatim into ym_doc.payload, so a stored
   credential would sit in the database in plaintext forever, readable on every device this host

function issuableRoles(cat){
  return cat==='guest'?[['P','嘉宾']]
       : cat==='donor'?[['D','捐赠者']]
       : [['V','志愿者'],['VN','有偿服务者'],['O','记者 / 旁观']];
}
function roleKey(a){return a.role==='V'&&a.paid?'VN':a.role;}
function loadCodes(){
  if(!canCloud())return Promise.resolve();
  return sb.rpc('ym_code_list').then(({data,error})=>{if(error)return;
    CODES={};(data||[]).forEach(r=>{if(r.ref_id)CODES[r.ref_id]=r;});render();});
}
function codeOf(p){return (p&&CODES[p.id])||null;}
function codeState(p){
  const a=codeOf(p);
  if(!a)return {k:'none',t:'',code:''};
  if(a.revoked)return {k:'off',t:'已停用',code:a.code};
  if(a.bound)  return {k:'live',t:'使用中',code:a.code};
  const exp=a.invite_exp?Date.parse(a.invite_exp):0;
  if(!exp)     return {k:'wait',t:'待发码',code:a.code};
  if(exp<Date.now())return {k:'exp',t:'邀请码已过期',code:a.code};
  return {k:'sent',t:'待注册 · 剩 '+Math.max(1,Math.ceil((exp-Date.now())/86400000))+' 天',code:a.code};

async function codeIssue(){
  const g=_grant;if(!g||g.busy)return;
  const p=STORE.library.resources.find(x=>x.id===g.pid);if(!p)return;
  g.busy=true;g.err='';grantPaint();
  // the ROLE is a request, not a decision: ym_mint_code re-derives it, refuses 'H' for every
  // caller, and allocates the number atomically in the database (PLAN-Y7 §E9)
  const {data,error}=await sb.rpc('ym_mint_code',
    {p_role:g.role==='VN'?'V':g.role,p_paid:g.role==='VN',p_ref:p.id});
  g.busy=false;
  if(error||!data||data.r!=='ok'){
    g.err=data&&data.r==='full'?'名额已满':data&&data.r==='exists'?'这个人已经有编号了':'生成失败，请重试';
    if(data&&data.r==='exists')await loadCodes();
    grantPaint();return;}
  // server-owned, and NOT in LIB_FIELDS. row.invite is deliberately NOT among them.
  p.code=data.code;p.roleCode=g.role;p.codeTail=String(data.invite).slice(-4);
  p.codeExp=data.exp;save();
  g.invite=data.invite;
  await loadCodes();await pushShares();grantPaint();
}
async function codeReissue(){
  const g=_grant;if(!g||g.busy)return;
  const p=STORE.library.resources.find(x=>x.id===g.pid),a=p&&codeOf(p);if(!a)return;
  g.busy=true;g.err='';grantPaint();
  const {data,error}=await sb.rpc('ym_reissue_code',{p_code:a.code});
  g.busy=false;
  if(error||!data||data.r!=='ok'){
    g.err=data&&data.r==='bound'?'TA 已经注册过了 —— 已注册的编号不能重发邀请码':'重发失败，请重试';
    grantPaint();return;}
  p.codeTail=String(data.invite).slice(-4);p.codeExp=data.exp;save();
  g.role=roleKey(a);g.invite=data.invite;
  await loadCodes();grantPaint();
}
function grantSend(){

    '打开 https://ym.jjconnect.tokyo/member/ → 选「注册」',
    '邀请码：'+g.invite,
    '你的编号（以后用它或邮箱登录）：'+st.code,
    '注册时邮箱和密码由你自己填。邀请码一周内有效，只能用一次，请勿转发。'].join('\n'));
}
function grantRevoke(){

   主办码：管理员在 管理 页生成，形如 YM-XXXX-XXXX-XXXX，存 ym_invite，兑换 = 成为主办方。
   成员码：主办方在 用户 页生成，**16 位**（0015 的 ym_norm_invite 字母表：去掉 I/O 的
           32 个字符），存 ym_code_secret，兑换 = 成为那个主办名下的 志愿者/嘉宾/捐赠者/记者。
   两者形状不重叠（主办码归一后只有 14 位），所以在前端就能分流 —— 而分错的代价是
   一个志愿者被当成主办方申请排队，所以宁可保守：像成员码就当成员码处理，绝不改道。 */
const MEMBER_INV_RE=/^[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{16}$/;
function memberInvite(s){
  const x=String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  return MEMBER_INV_RE.test(x)?x:'';

        'down'  = 一时连不上，别下结论。

     于是「已经正经排队申请当主办的人，在等待屏那个码框里粘了别人发的成员码」也会被删掉
     **那份真的主办申请** —— 而且她再也建不回来（重载时上面那道门看到她名下有 live 码就
     直接 return，ym_redeem_invite 没有 ym_member 行会回 'no-profile'，那个码框也再看不到）。

function mergeLibrary(cloud,local){
  if(!cloud)return local;
  if(!local)return cloud;
  const out=JSON.parse(JSON.stringify(cloud));
  ['templates','ideas','resources','money'].forEach(k=>{
    out[k]=out[k]||[];
    const seen={};out[k].forEach(x=>{if(x&&x.id)seen[x.id]=1;});
    const key=x=>String((x&&(x.name||x.seg))||'').trim()+'|'+String((x&&x.kind)||'');
    const named={};out[k].forEach(x=>{if(x)named[key(x)]=1;});
    (local[k]||[]).forEach(x=>{
      if(!x||!x.id||seen[x.id])return;
      if(x.demo&&named[key(x)])return;          // 同名的种子，云端已经有了
      out[k].push(x);named[key(x)]=1;});
  });
  return out;
}
/* An admin's approval writes to the DB and produces NO auth event, so an open pending
   session would sit on ⏳ forever. Poll while pending; stop the moment we're in. */
let _pollT=null;
/* ⚠ 以前这里每 15 秒跑一次完整 cloudLoad()，而 cloudLoad 结尾是 render() —— 整个 #app 重建，
   主办正在输入的**邀请码连同光标一起被冲掉**（owner 2026-07-27：「没能输入完就被刷新掉了」）。
   等待批准的那一屏恰恰就是要粘邀请码的那一屏，所以这是必然会撞上的。
   现在只查状态，**有变化才** cloudLoad —— 没有消息就不该重绘。 */
function startPoll(){
  if(_pollT||!SESSION)return;
  _pollT=setInterval(()=>{
    if(!SESSION||canCloud()){stopPoll();return;}
    if(!sb)return;
    sb.from('ym_member').select('status').eq('user_id',SESSION.user.id).maybeSingle()
      .then(({data})=>{
        const st=data?data.status:null;
        if(st&&(!PROFILE||st!==PROFILE.status))cloudLoad();   // 真的被批准了，这时才重绘
      });
  },15000);
}
function stopPoll(){if(_pollT){clearInterval(_pollT);_pollT=null;}}
const INV_KEY='jjym_invite';
function readPendingCode(){
  try{
    const raw=localStorage.getItem(INV_KEY);if(!raw)return null;
    const o=JSON.parse(raw);
    if(!o||!o.code||!o.exp||Date.now()>o.exp){localStorage.removeItem(INV_KEY);return null;}
    return o;
  }catch(e){try{localStorage.removeItem(INV_KEY);}catch(e2){}return null;}
}
function clearPendingCode(){try{localStorage.removeItem(INV_KEY);}catch(e){}}
async function redeemInvite(code,quiet){
  if(!sb||!SESSION)return 'no-session';
  /* 先按形状分流。这一条也是**已经被错登记成 pending 主办**的人自救的唯一出路：
     他们手里的 16 位成员码打 ym_redeem_invite 永远回 invalid，屏幕上只有一句
     「邀请码无效或已用完」—— 码明明是好的，人却怎么试都进不去。 */
  const minv=memberInvite(code);
  if(minv){
    const {data:b,error:be}=await sb.rpc('ym_bind_code',{p_invite:minv});
    const r=b&&b.r;
    if(r==='ok'||r==='already'){
      clearPendingCode();
      if(!quiet)toast('这是成员邀请码 —— 已经把你绑到发码的主办方名下了');
      /* ⚠ 这里**不撤回** ym_member 那一行。从这条路进来的人可能是一个正经排队的主办申请人，
         只是顺手粘了别人给的成员码 —— 替他删掉那份真申请，他再也建不回来。
         只有 cloudLoad 那个自动入口能确定「那一行必是点错门留下的」。 */
      memberOnly('bound',false);return 'member';
    }
    if(be||r==='slow'){
      if(!quiet)toast(be?'暂时连不上，请稍后再试（这跟你的码没关系）':'试得太频繁了，请过一会儿再来');
      return 'member-down';                    // 码留着，别让人以为它坏了
    }
    if(!quiet)toast('这串是成员邀请码（志愿者 / 嘉宾 / 捐赠者），但它已经用过或过期了 —— 请找主办方重发一个');
    return 'member-bad';
  }
  const {data,error}=await sb.rpc('ym_redeem_invite',{p_code:code});
  if(error){if(!quiet)toast('邀请码校验失败：'+error.message);return 'error';}
  if(data==='ok'||data==='already'||data==='invalid')clearPendingCode();  // never auto-retry
  if(!quiet){
    if(data==='ok')toast('邀请码有效 — 已开通');
    else if(data==='already')toast('这个账号已经开通了');
    else if(data==='invalid')toast('邀请码无效或已用完');
    else if(data==='no-profile')toast('请先刷新页面（本机还没登记 ym 账号），再试一次');
  }
  return data;
}
function authInit(){
  if(!sb)return;
  // 链接本身就带着失败原因（过期 / 用过了）—— 不说的话主办只看到一个普通的登录页
  if(RECOVERY_ERR)setTimeout(()=>toast('这个重设链接不能用了（'+decodeURIComponent(RECOVERY_ERR).replace(/\+/g,' ')+'）—— 请重新点一次「忘记密码了」'),300);
  sb.auth.getSession().then(({data})=>{
    SESSION=data.session;_authKey=SESSION?SESSION.user.id:null;
    // URL 说这是重设密码回来的 → 不管 PASSWORD_RECOVERY 事件有没有赶上，都直接开那一屏
    if(RECOVERY_URL&&SESSION){S.authRecovery=true;S.auth=true;render();return;}
    if(SESSION)cloudLoad();
  });
  sb.auth.onAuthStateChange((ev2,s2)=>{
    const key=s2?s2.user.id:null;
    SESSION=s2;
    // 点重设邮件的链接回来：supabase-js 先建立一个 recovery 会话，再发这个事件。必须在
    // cloudLoad 之前接住并把登录抽屉打开到「设新密码」，否则主办直接落进工作台，
    // 那封信就白发了 —— 成员页早就是这么做的 (member L~709)。
    if(ev2==='PASSWORD_RECOVERY'){_authKey=key;S.authRecovery=true;S.auth=true;render();return;}
    if(key===_authKey)return;   // token refresh etc — never re-render over user input
    _authKey=key;cloudLoad();
  });
}

function instantiate(tpl,lib){

      resources:r.resources.map(cp),money:r.money.map(cp)}))};
}

function toggleUsed(id){const r=STORE.library.resources.find(x=>x.id===id);if(!r)return;
  r.used=!r.used;if(!r.used)delete r.archived;save();render();}
function toggleArchived(id){const r=STORE.library.resources.find(x=>x.id===id);if(!r)return;
  if(!r.archived&&gclassOf(r)==='consume'&&!r.used){toast('消耗品要先标「已使用」才能归档');return;}
  r.archived=!r.archived||undefined;save();render();
  toast(r.archived?'已归档 —— 不再出现在挂资源的列表里':'已取回');}
/* ---- 灵感 = 四类 (owner 2026-07-27)。互动游戏不属于任何一个阶段，三段计划里都能用。 ---- */
const IDEA_KIND=[['before','事前准备'],['day','当天活动'],['after','事后复盘'],['game','互动游戏']];
function ideaKind(i){const k=i&&i.kind;return IDEA_KIND.some(x=>x[0]===k)?k:'day';}
function ideaKindLabel(k){const f=IDEA_KIND.find(x=>x[0]===k);return f?f[1]:'当天活动';}
// a chip's 4-state status → task bucket: 未联系=待办 · 已联系/已确认=进行中 · 到位=完成
function taskBucket(c){const s=c.status||0;return s>=3?2:(s>=1?1:0);}
function taskLabel(c){return TASK_ST[taskBucket(c)];}
// active (non-ignored) resource/任务 chips as tasks; money is handled separately (待记账)
function tasks(e){return allResChips(e).filter(x=>!x.c.ignored)
  .map(x=>({c:x.c,where:x.where,bucket:taskBucket(x.c)}));}
function ignoredTasks(e){return allResChips(e).filter(x=>x.c.ignored).map(x=>({c:x.c,where:x.where}));}
function moneyTodo(e){return allMoneyChips(e).filter(x=>!x.c.ignored&&x.c.actual==null).map(x=>({c:x.c,where:x.where}));}
// event lifecycle phase (owner: two buttons + 14-day cool-down)
const HOT_DAYS=14;
function evPhase(e){
  if(e.archived)return 'archived';
  const st=e.status||'plan';
  if(st==='run')return 'current';
  if(st==='done'||st==='cancelled'){
    if(e.endedAt){const d=(nowMs()-Date.parse(e.endedAt))/86400000; if(d>HOT_DAYS)return 'archived';}
    return 'hot';
  }
  return 'plan';   // 筹备中
}
function nowMs(){return new Date().getTime();}
const PHASE_LABEL={current:'当前',plan:'筹备中',hot:'已结束·仍热',archived:'已归档'};
/* ===== 台本的时刻表 (owner 2026-07-27) =====
   每个环节有 时长；开始时刻从 活动开始时间 一路累加下来，所以调换次序、改一个时长，
   后面全部自己跟着动，末尾就是**预计结束时间**。
   ⚠ r.time（手填的时刻）没有被夺走含义：填了就是**锚点** —— 从那一行起重新往下排。
   主办已经填在台本上的时间因此一个都不会被改掉。 */
function evSchedule(e){
  const out=[];let cur=parseHM(e&&e.start);
  ((e&&e.rows)||[]).forEach(r=>{
    const t=parseHM(r.time);
    if(t!=null)cur=t;                       // 手填 = 锚点
    const d=Math.max(0,parseInt(r.dur,10)||0);
    out.push({start:cur,end:cur==null?null:cur+d,dur:d,anchored:t!=null});
    if(cur!=null)cur+=d;
  });
  return out;
}
function evEndMin(e){const s=evSchedule(e);for(let i=s.length-1;i>=0;i--)if(s[i].end!=null)return s[i].end;return null;}
function evTotalMin(e){return ((e&&e.rows)||[]).reduce((n,r)=>n+Math.max(0,parseInt(r.dur,10)||0),0);}
function moneyTotals(e){
  const t={inPlan:0,inActual:0,outPlan:0,outActual:0};
  allMoneyChips(e).forEach(x=>{const c=x.c;
    if(c.kind==='in'){t.inPlan+=c.plan||0;t.inActual+=c.actual||0;}
    else{t.outPlan+=c.plan||0;t.outActual+=c.actual||0;}});
  t.planNet=t.inPlan-t.outPlan;t.actualNet=t.inActual-t.outActual;return t;}
function followUps(e){const f=[];   // unmet, non-ignored — drives 催 + desk counts
  allResChips(e).forEach(x=>{if(!x.c.ignored&&(x.c.status||0)<2)f.push({type:'res',c:x.c,where:x.where,ev:e});});
  allMoneyChips(e).forEach(x=>{if(!x.c.ignored&&x.c.actual==null)f.push({type:'money',c:x.c,where:x.where,ev:e});});
  return f;}

/* 忘记密码 —— 主办自己走，不经过管理员。Supabase 发一封带链接的信，点开落回本页并进入
   PASSWORD_RECOVERY。⚠ redirectTo 必须在 Supabase 的 Redirect URLs 白名单里，
   否则 GoTrue 会静默换成 Site URL，链接就把人送去别的页面。 */
async function doForgot(){
  if(_authBusy||!sb)return;
  const em=(($('au_fem')||{}).value||'').trim().toLowerCase();
  if(!em){toast('请输入邮箱');return;}
  _authBusy=true;render();
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:RESET_REDIRECT});
  _authBusy=false;S.authEmail=em;S.authTab='';render();
  /* 传输层的失败（限流 / SMTP 挂了 / redirect_to 不在白名单）**要说**：它跟「这个邮箱
     有没有账号」无关，所以说了也不泄露什么；而不说的话，一封永远收不到的信和一个
     不存在的账号长得一模一样，没人能查。账号存在与否仍然一个字都不提。 */
  if(error){console.warn('[ym] resetPasswordForEmail failed:',error);
    toast('发不出去：'+(error.message||'服务端错误')+' —— 这跟邮箱有没有账号无关，请截图给管理员');return;}
  toast('如果这个邮箱有账号，信已经发出了 —— 请查收（也看一下垃圾邮件）');
}
async function doNewPw(){
  if(_authBusy||!sb)return;
  const a=($('au_np1')||{}).value||'',b=($('au_np2')||{}).value||'';
  if(a.length<8){toast('密码至少 8 位');return;}
  if(a!==b){toast('两次输入不一样');return;}
  _authBusy=true;render();
  const {error}=await sb.auth.updateUser({password:a});
  _authBusy=false;
  if(error){toast('改不了：'+error.message);render();return;}
  S.authRecovery=false;S.authTab='';toast('密码已更新');
  if(PROFILE===null||PROFILE===undefined)cloudLoad();else render();
}
function doSignIn(){
  if(_authBusy||!sb)return;_authBusy=true;

  const code=(($('au_code')||{}).value||'').trim();
  if(!email||!pw){toast('请输入邮箱和密码');_authBusy=false;return;}
  // a code typed on the LOGIN form must count too — the host logs in, they don't register
  // ⚠ 没填码就要**清掉**上一个人留下的（doSignUp 一直是这么做的，这里以前漏了）：
  //   共用设备上，A 粘过码但登录失败，B 登进来就会捡到 A 的码。
  try{if(code)localStorage.setItem(INV_KEY,JSON.stringify({code,email,exp:Date.now()+7*86400000}));
      else clearPendingCode();}catch(e){}
  toast('登录中…');
  sb.auth.signInWithPassword({email,password:pw}).then(({error})=>{
    _authBusy=false;
    if(error){toast('登录失败：'+error.message);return;}
    S.auth=false;render();toast('已登录，正在检查开通状态…');
  });
}
function doSignUp(){
  if(_authBusy||!sb)return;_authBusy=true;
  const email=($('au_email').value||'').trim(),pw=$('au_pw').value||'';
  const code=(($('au_code')||{}).value||'').trim();
  if(!email||pw.length<6){toast('请输入邮箱和至少6位密码');_authBusy=false;return;}
  // Bound to this ADDRESS — that binding, not the clock, is what stops a shared device spending
  // somebody's seat on the wrong account. The window was 30 minutes, which broke silently the
  // moment SMTP started working: with confirmation on, the trip is 注册 → 收信 → 点链接, the link
  // usually opens in the phone's mail browser, and localStorage there is empty. A week matches
  // how long an invite lives.
  try{if(code)localStorage.setItem(INV_KEY,JSON.stringify({code,email,exp:Date.now()+7*86400000}));
      else clearPendingCode();}catch(e){}
  sb.auth.signUp({email,password:pw,options:{emailRedirectTo:RESET_REDIRECT}}).then(({data,error})=>{
    _authBusy=false;
    /* 重复邮箱有**两种**返回形态，两种都要接住：
         确认邮件 ON  → 没有 error，但 user.identities 是空数组（混淆过的假用户）
         确认邮件 OFF → 422 "already registered"（现在就是这个 —— 确认邮件已关）
       以前只接了第一种，于是第二种落进下面的通用 error 分支，主办看到的是一句英文原文。 */
    const dupErr=error&&/already registered|already been registered/i.test(error.message||'');
    const dupShadow=!error&&data&&data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0;
    if(dupErr||dupShadow){
      S.authEmail=email;
      toast('这个邮箱已经注册过了 —— 请直接用它「登录」（忘了密码就点下面的「忘记密码了」）');return;}
    if(error){toast('注册失败：'+error.message);return;}
    /* 拿着成员码在主办台注册的人**不是**在申请当主办 —— 别再对他说「等待管理员批准」。
       账号建好后 cloudLoad() 会拿这串码去 ym_bind_code，把他绑到发码的那个主办名下。 */
    const asMember=!!memberInvite(code);
    toast(data.session?(asMember?'账号已建好，正在按邀请码把你绑到主办方名下'
                        :code?'注册成功，正在校验邀请码':'注册成功 — 等待管理员批准')
                      :'确认邮件已发送，请查收后回来登录');
    S.auth=false;render();
  });
}
function useCode(){
  const el=$('au_code2');const c=(el&&el.value||'').trim();
  if(!c){toast('请输入邀请码');return;}
  redeemInvite(c,false).then(r=>{if(r==='ok')cloudLoad();});
}
function recheck(){
  if(!SESSION){toast('请先登录');return;}
  toast('正在检查…');
  cloudLoad().then(()=>{if(!canCloud())toast('还没有被批准 — 请稍后再试');});
}
function doSignOut(){clearPendingCode();   // never carry a code across identities
  // …and never carry the previous host's volunteer data either: PENDING holds their members'
  // names and 确认完成 stays wired, so the next person on this device could flip a chip.
  PENDING=[];CODES={};JOINREQ=null;LEDGER=null;capStop();   // 手机拍的通道不能跨账号留着
  /* ⚠ 这几个**界面状态**也必须清。authSheet 里 S.memberOnly 那三个分支排在登录表单**前面**，
     所以一个成员退出登录之后，下一个人打开抽屉看到的还是「这是一个成员账号」
     （邮箱那一格已经空了，因为 SESSION 没了）—— 登录表单再也点不到，只能刷新页面。
     退出登录的意思是「把上一个人留下的一切都清掉」，不只是数据。 */
  S.memberOnly=0;S.memberWhy='';S.noJoin=0;S.nameDup=false;S.joinDone=false;S.pOpen=null;
  if(_pendT){clearInterval(_pendT);_pendT=null;}
  if(sb)sb.auth.signOut().then(()=>{PROFILE=null;ADMIN=null;POSTS=null;S.auth=false;render();});}

// how many DISTINCT events have used this library item (by refId)
function usedEvents(refId){if(!refId)return 0;const s=new Set();
  STORE.events.forEach(e=>{let hit=false;[e.header].concat(e.rows).forEach(h=>{
    (h.resources||[]).concat(h.money||[]).forEach(c=>{if(c.refId===refId)hit=true;});});
    if(hit)s.add(e.id);});
  return s.size;}
// past events at the SAME venue (+ the most recent 场地-type cost, if any)
function venueHistory(e){const v=(e.venue||'').trim();if(!v)return null;
  const past=STORE.events.filter(x=>x.id!==e.id&&(x.venue||'').trim()===v)
    .sort((a,b)=>(a.date||'')<(b.date||'')?1:-1);
  if(!past.length)return null;
  let lastCost=null;const vc=allMoneyChips(past[0]).find(x=>/场地|场租|租金|会場|venue/i.test(x.c.name));
  if(vc)lastCost=vc.c.actual!=null?vc.c.actual:vc.c.plan;
  return {count:past.length,lastCost,dates:past.map(x=>fmtDate(x.date))};}
function venueHistDetail(){const e=ev();const vh=venueHistory(e);if(vh)toast((e.venue||'').trim()+' — 办过：'+vh.dates.join('、'));}

function applyTpl(id){if(S.readonly)return;const t=STORE.library.templates.find(x=>x.id===id),e=ev();if(!t)return;
  if(!e){const ne=instantiate(t);STORE.events.push(ne);S.evId=ne.id;}
  else{
    if(e.rows.length&&!confirm('当前台本已有 '+e.rows.length+' 个环节，用模板覆盖？'))return;
    const ne=instantiate(t);e.rows=ne.rows;e.header=ne.header;
  }
  S.view='sheet';S.drawer=false;save();render();toast('模板已铺入台本');}
function applyIdea(id){if(S.readonly)return;const i=STORE.library.ideas.find(x=>x.id===id),e=ev();if(!i||!e)return;
  const chips=(i.res||[]).map(q=>{const r=STORE.library.resources.find(x=>x.role===q||x.name===q);
    return r?{id:uid(),refId:r.id,name:r.name,role:r.role,type:r.type,status:0}:null;}).filter(Boolean);
  // 灵感本来就带着「约 N 分」，以前铺进台本时被丢掉了 —— 现在它就是这一行的时长
  e.rows.push({id:uid(),time:'',seg:i.seg,dur:parseInt(i.dur,10)||undefined,owner:'',resources:chips,money:[]});
  S.sel=e.rows[e.rows.length-1].id;S.drawer=false;save();render();toast('已加入环节：'+i.seg);}
function applyRes(id){if(S.readonly)return;const r=STORE.library.resources.find(x=>x.id===id),e=ev();if(!r||!e)return;
  const tgt=S.sel==='header'?e.header:e.rows.find(x=>x.id===S.sel);if(!tgt){toast('先点选一行');return;}
  tgt.resources.push({id:uid(),refId:r.id,name:r.name,role:r.role,type:r.type,status:0});
  S.drawer=false;save();render();toast(r.name+' 已挂上');}
function applyMoney(id){if(S.readonly)return;const m=STORE.library.money.find(x=>x.id===id),e=ev();if(!m||!e)return;
  const tgt=S.sel==='header'?e.header:e.rows.find(x=>x.id===S.sel);if(!tgt){toast('先点选一行');return;}
  tgt.money.push({id:uid(),refId:m.id,name:m.name,kind:m.kind,plan:m.amount,unit:m.unit,actual:null});
  S.drawer=false;save();render();toast(m.name+' 已挂上');}

function aiPhrase(el,kind,ctx,longForm){
  if(S.readonly)return;

  if(btn){btn.disabled=true;btn.textContent='…';}
  const done=()=>{if(btn){btn.disabled=false;btn.innerHTML=ico('ai');}};
  fetch(API+'/api/phrase',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({text:t,kind:kind||'',context:ctx||'',long:!!longForm,
      user_token:(typeof SESSION!=='undefined'&&SESSION&&SESSION.access_token)||null})})
  .then(r=>r.json()).then(res=>{done();

   放手时不是按坐标算索引，而是**把 DOM 的顺序读回模型**：中途 render() 一次就会前功尽弃，
   所以拖动全程不 render，只挪节点。 */
let _drag=null;
function rowDragStart(ev2,id){
  if(S.readonly)return;
  ev2.preventDefault();ev2.stopPropagation();
  const card=document.querySelector('[data-rid="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  if(!card)return;
  _drag={id,card};card.classList.add('dragging');
  document.addEventListener('pointermove',rowDragMove);
  document.addEventListener('pointerup',rowDragEnd,{once:true});
  document.addEventListener('pointercancel',rowDragEnd,{once:true});

function rowDragMove(ev2){
  if(!_drag)return;
  const y=ev2.clientY;
  [...document.querySelectorAll('.rowcard')].forEach(c=>{
    if(c===_drag.card)return;
    const b=c.getBoundingClientRect();
    if(y>b.top&&y<b.bottom)
      c.parentNode.insertBefore(_drag.card,y<b.top+b.height/2?c:c.nextSibling);
  });
}
function rowDragEnd(){
  document.removeEventListener('pointermove',rowDragMove);
  if(!_drag)return;
  _drag.card.classList.remove('dragging');_drag=null;
  const e=ev();if(!e)return;
  const order=[...document.querySelectorAll('.rowcard')].map(c=>c.getAttribute('data-rid'));
  const by={};e.rows.forEach(r=>by[r.id]=r);
  const next=order.map(id=>by[id]).filter(Boolean);
  // 只有当 DOM 里的行和模型里的行**一一对应**时才接受这个新顺序 —— 少一行就说明读到的
  // 不是这份台本（比如另一个视图也有 .rowcard），那时候写回去会静默丢环节。
  if(next.length===e.rows.length)e.rows=next;

}

function calHtml(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1);const start=first.getDay();const dim=new Date(y,m+1,0).getDate();
  const t=todayStr();
  let cells='日一二三四五六'.split('').map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<start;i++)cells+='<div class="day out"></div>';
  for(let d=1;d<=dim;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const here=STORE.events.filter(e=>e.date===ds);
    cells+=`<div class="day ${ds===t?'today':''}"><span class="num">${d}</span>
      ${here.map(e=>`<div class="dot">${e.demo?'◇':'●'} ${esc(e.name.slice(0,6))}</div>`).join('')}</div>`;}
  return `<div class="cal">${cells}</div>`;
}

/* 已经堆进来的重复示例（owner 的库里 181 项，一套种子才 48）—— mergeLibrary 修好的是「以后不再
   多」，这个是「把已经多出来的收掉」。只合并 示例：主办自己建的同名条目一个都不动。
   ⚠ 台本上的牌子用 refId 指向库里的条目，所以删之前必须把 refId 改指到留下的那一条，
   否则「用过几场」和「保存回资产库」会指向一个已经不存在的 id。 */
function dupDemo(){
  const map={};let n=0;
  ['templates','ideas','resources','money'].forEach(k=>{
    const seen={};
    (STORE.library[k]||[]).forEach(x=>{
      if(!x||!x.demo)return;
      const key=String(x.name||x.seg||'').trim()+'|'+String(x.kind||'');
      if(seen[key]){map[x.id]=seen[key];n++;}else seen[key]=x.id;});});
  return {map,n};
}
function mergeDupDemo(){
  const {map,n}=dupDemo();if(!n)return;

  STORE.events.forEach(e=>[e.header].concat(e.rows||[]).forEach(h=>{

const PEO_CATS=[['volunteer','志愿者'],['guest','嘉宾'],['donor','捐赠人']];

// A guest met at an event is filed in the registry, so the same person attending twice is
// ONE record that accumulates history (V1.0: 一个嘉宾可以参加多个活动).
function fileGuest(p){
  if(p.libId&&STORE.library.resources.some(r=>r.id===p.libId))return p.libId;
  const key=(p.name||'').trim();if(!key)return null;
  // Auto-merge on 姓名+性别 is how ONE person attending twice accumulates history. But 重名 is common,
  // and a merged record can now hold an ACCOUNT — at which point the merge would show one guest the
  // other's events and 号牌. So never auto-merge into a record that has been granted one; that
  // person must be linked deliberately (从名册选), by the host's own hand.
  let rec=peoList('guest').find(r=>!r.code&&(r.name||'').trim()===key
    &&(!r.gender||!p.gender||r.gender===p.gender));
  if(!rec&&peoList('guest').some(r=>r.code&&(r.name||'').trim()===key))
    toast('名册里已有同名嘉宾（已发账号）— 若是同一人，请改从名册选');
  if(!rec){
    rec={id:uid(),cat:'guest',type:'人',name:key,gender:p.gender||'',
      occupation:p.job||'',role:''};
    Object.assign(rec,p.profile||{});
    rec.name=key;                                  // profile fields must not clobber identity
    if(p.demo)rec.demo=true;                        // a seeded guest stays 示例 in the registry
    STORE.library.resources.push(rec);
  }else if(p.profile){
    Object.keys(p.profile).forEach(k=>{if(p.profile[k]&&!rec[k])rec[k]=p.profile[k];});
    if(p.job&&!rec.occupation)rec.occupation=p.job;
  }
  p.libId=rec.id;
  return rec.id;
}

  const out=[];
  STORE.events.forEach(e=>(e.participants||[]).forEach(p=>{

    out.push({event:e.name,date:e.date,demo:!!e.demo,arrived:!!p.arrived,
      badge:p.gender+p.n,evals:p.evals||[]});}));
  return out;
}

/* ONE field renderer + ONE writer, shared by 资料卡 (edit) and 新建 (add) —— owner 2026-07-27:
   「增加新项目的时候需要完整的录入，现在提供的是演示功能」。两套表单各写一遍字段，正是它们
   会走散的原因：加字段时只改了一边。现在两边都从 LIB_FIELDS 长出来。 */
function libFieldsHtml(kind,rec,pfx){
  const val=k=>k==='resStr'?((rec.res||[]).join('、')):(rec[k]==null?'':rec[k]);
  return LIB_FIELDS[kind].map(f=>{
    const [k,label,type,opts]=f;
    if(type==='sel'){
      const cur=String(val(k)||(k==='used'&&rec.used?'1':''));
      const os=opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o||'—'];
        return `<option value="${esc(v)}" ${cur===String(v)?'selected':''}>${esc(l)}</option>`;}).join('');
      return `<label class="fld" style="display:block;margin:9px 0"><span class="lbl">${esc(label)}</span>
        <select id="${pfx}${k}">${os}</select></label>`;
    }
    if(type==='ta')return `<label class="fld" style="display:block;margin:9px 0"><span class="lbl">${esc(label)}</span>
      <span class="fldmic"><textarea id="${pfx}${k}" rows="2">${esc(val(k))}</textarea>${micBtn(pfx+k,label)}</span></label>`;
    if(type==='date')return `<label class="fld" style="display:block;margin:9px 0"><span class="lbl">${esc(label)}</span>
      <input id="${pfx}${k}" type="date" value="${esc(val(k))}"></label>`;
    // 数字格没有话筒 —— 对着话筒念金额只会得到「一万二」这种转写，反而要回头改
    const numeric=/^(qty|value|amount|unit|unit2|dur|age|totalAmount|totalCount|goodsCount)$/.test(k);
    return `<label class="fld" style="display:block;margin:9px 0"><span class="lbl">${esc(label)}</span>
      ${numeric?`<input id="${pfx}${k}" value="${esc(val(k))}">`
        :`<span class="fldmic"><input id="${pfx}${k}" value="${esc(val(k))}">${micBtn(pfx+k,label)}</span>`}</label>`;
  }).join('');
}
function libReadInto(kind,pfx,rec){
  LIB_FIELDS[kind].forEach(f=>{
    const k=f[0];const el=$(pfx+k);if(!el)return;
    let v=String(el.value||'').trim();
    if(k==='resStr'){rec.res=v?v.split(/[,，、/]+/).map(x=>x.trim()).filter(Boolean):[];return;}
    // a blank 单价 means "no per-head price", NOT zero — storing 0 made every money chip claim ¥0/人
    if(k==='unit'){const n=parseInt(v.replace(/[^\d]/g,''),10)||0;if(n)rec.unit=n;else delete rec.unit;return;}
    if(k==='dur'||k==='amount'){rec[k]=parseInt(v.replace(/[^\d]/g,''),10)||0;return;}
    if(k==='value'){const n=parseInt(v.replace(/[^\d]/g,''),10)||0;if(n)rec.value=n;else delete rec.value;return;}
    // 已使用 是个开关，卡片上点的和这里选的必须落在同一个真值上；归档的前提也在这里守住
    if(k==='used'){if(v==='1')rec.used=true;else{delete rec.used;delete rec.archived;}return;}
    if(v)rec[k]=v;else delete rec[k];
  });
  // 大类改成非消耗品时，消耗品专有的字段一起清掉 —— 留着会在卡片上显示一个说不通的「保存期限」
  if(kind==='goods'&&rec.gclass!=='consume'){delete rec.used;delete rec.expiry;delete rec.category;delete rec.archived;}
}

function ticketInfo(e){
  const t=[];allMoneyChips(e).forEach(x=>{const c=x.c;
    if(c.kind==='in'&&c.unit>0&&c.name.indexOf('门票')>=0)t.push(c);});

// A 门票 chip splits by gender only if its NAME says so. 「门票」/「早鸟门票」 bills EVERYONE who
// showed up — the old two-way ternary fell through to 女, silently halving the take.
/* ---------- 逐笔收款 (owner 2026-07-28) ----------
   「现在登记收入要先建一个收支项；但主办更想要 —— **收到一笔报名费就记一条**。」
   现实就是这样：报名费多半是提前一个一个转过来的，不是活动当天一次性收齐。
   🔴 唯一真正的风险是**重复计账**：门票那条汇总（confirmTickets）算的是
      単価 × **到场人数**，它不知道谁已经单独交过了。所以逐笔记过的人要从头数里扣掉 ——
      两边自动互斥，主办不用记住自己在用哪一种。0022 的唯一索引是数据库那一侧的兜底。 */
function feeRows(e){return e?(LEDGER||[]).filter(r=>r.src==='fee'&&r.event_id===e.id&&r.status!=='void'):[];}
// 「一个人都没交」和「总账还没读到」是两回事 —— 后者画成前者，主办会以为钱没收到
function feeReady(){return !canCloud()||LEDGER!==null;}
// payer_ref 已经不在名单里的 fee 行（人被删了）。它们仍然在账上，但**扣不掉任何人** ——
// 默默计进「已收 N 人」就是在说谎，那句话的意思是「这 N 个人不会被门票汇总重复算」。
function feeOrphans(e){if(!e)return [];
  const has={};(e.participants||[]).forEach(p=>{has[p.id]=1;});
  return feeRows(e).filter(r=>!has[r.payer_ref]);}
function feeOf(e,p){return p?feeRows(e).find(r=>r.payer_ref===p.id)||null:null;}
function feePaidIds(e){const s={};feeRows(e).forEach(r=>{if(r.payer_ref)s[r.payer_ref]=1;});return s;}
// 到场、且**没有**单独记过款的人 —— 门票汇总只该算这些人
function arrUnpaid(e,g){const paid=feePaidIds(e);
  return e.participants.filter(p=>p.gender===g&&p.arrived&&!paid[p.id]).length;}
function ticketHeads(e,c){const n=String(c.name||'');
  const m=n.indexOf('男')>=0,w=n.indexOf('女')>=0;
  if(m&&!w)return arrUnpaid(e,'男');
  if(w&&!m)return arrUnpaid(e,'女');
  return arrUnpaid(e,'男')+arrUnpaid(e,'女');

// 这一场里某个性别的门票单价 —— 逐笔收款的默认金额从这里来，省得每次手打
function feeUnit(e,g){
  const t=ticketInfo(e).find(c=>String(c.name||'').indexOf(g)>=0)||ticketInfo(e)[0];

function feeSum(e){return feeRows(e).reduce((s,r)=>s+(r.amount||0),0);}

  if(!feeReady()){toast('总账还没读到 —— 先刷新一下，免得重复记账');loadLedger(1);return;}
  if(feeOf(e,p)){toast(p.name+' 已经记过一笔了 —— 要改就去总账里「取消」那一条重记');return;}

async function feeAdd(p,v){

  if(!amt){toast('金额填一下');return;}
  const pay=RC_PAY.indexOf(v[1])>=0?v[1]:'現金';
  const day=/^\d{4}-\d{2}-\d{2}$/.test(v[2]||'')?v[2]:todayStr();
  /* ⚠ **不编税额**。参加費是内部証憑，票面上根本没有内訳；用 amt/1.1 反推出来的
     「10% 消費税」不是读取，是捏造 —— 而且进的是税理士当事实读的那一列。
     这条规矩这个文件里已经写过一次（rcTax：读不到就空着，改过金额的旧明细直接丢掉），
     owner 也裁过「按含税来记，税务问题交给税理士思考」。amount 永远是税込，那一列是权威。 */
  // 裸 insert，然后读错误码 —— 0011 §3：部分唯一索引不许被 on conflict 点名
  const {error}=await sb.from('ym_entry').insert({
    host:SESSION.user.id,entry_date:day,paid_date:day,direction:'in',amount:amt,
    tax:[],tax_total:0,
    account:'売上高(参加費)',payment:pay,vendor:p.name||'参加者',reg_no:'',
    memo:'参加費 '+(p.name||'')+(p.n?'（'+p.gender+p.n+'）':''),
    event_id:e.id,chip_id:'',payer_ref:p.id,src:'fee',member_code:'',confidence:'hand',
    image_id:'',image_url:'',image_mime:null,image_name:''});
  if(error){
    // 0023 之后唯一索引只盖 posted，所以撞上就是「确实还有一条活着的」，不是被取消的那条挡路
    if(error.code==='23505'){toast(p.name+' 名下已经有一条没取消的报名费了');loadLedger(1);return;}
    toast(ledgerNotReady(error)?'没记进总账 —— 数据库迁移 0022 还没应用'
      :'没记进总账：'+error.message);return;}
  await loadLedger(1);render();
  toast('已记一笔 '+yen(amt)+' —— 门票汇总会自动跳过 '+(p.name||'这个人'));

function confirmTickets(){const e=ev();const ts=ticketInfo(e);if(!ts.length)return;
  /* ⚠ 「没有单独记账的人」和「总账还没读到」必须分开。LEDGER 还是 null 时 feeRows() 返回空，
     门票汇总就**不会**扣掉那些人 —— 同一笔钱进两次账。宁可让主办多点一下刷新。
     （同一条教训：LEDGER=LEDGER||[] 曾经让总账整场显示 ¥0 而屏幕上写着「还没有记录」。） */
  if(canCloud()&&LEDGER===null){
    toast('还没读到总账 —— 先等一下或刷新，免得和「单独记的报名费」重复入账');
    loadLedger(1);return;}
  ts.forEach(c=>{c.actual=(c.unit||0)*ticketHeads(e,c);});
  save();render();toast('门票已入账（可在收支牌上修改）');
  if(!canCloud())return;
  // 現金売上には外部証憑が無いので「内部証憑」を一本立てる —— 相手方・年月日・内容・対価が
  // 帳簿に残らないと誰も再現できない。頭数は今まで捨てていた（product しか残らなかった）。
  // 遅れて来た一人でやり直せるよう UPDATE 優先（ym_entry_one_ticket が backstop）。
  Promise.all(ts.map(c=>{
    const heads=ticketHeads(e,c),amt=(c.unit||0)*heads;
    /* 同 feeAdd：門票也是内部証憑，票面上没有内訳。以前这里用 amt/1.1 反推一个 10% ——
       那是捏造，不是读取（rcTax 为同一件事留过一整段说明）。owner 裁的是
       「按含税来记，税务问题交给税理士思考」，所以只留税込的 amount。 */
    const row={host:SESSION.user.id,entry_date:e.date||todayStr(),paid_date:e.date||todayStr(),
      direction:'in',amount:amt,tax:[],tax_total:0,
      account:'売上高(参加費)',payment:'現金',vendor:'当日参加者',reg_no:'',
      // 証憑は再現できなければ意味がない：頭数から**外した**人数もここに書く
      memo:(c.name||'门票')+' '+yen(c.unit)+' × '+heads+'名'
        +(feeRows(e).length?'（另有 '+feeRows(e).length+' 人已单独记账，未计入）':''),
      event_id:e.id,chip_id:c.id,src:'ticket',member_code:'',confidence:'hand',
      image_id:'',image_url:'',image_mime:null,image_name:''};
    const old=(LEDGER||[]).find(r=>r.src==='ticket'&&r.chip_id===c.id&&r.event_id===e.id);
    return old
      ? sb.from('ym_entry').update({amount:row.amount,tax:row.tax,tax_total:row.tax_total,
          memo:row.memo,status:'posted',void_reason:''}).eq('id',old.id)
      : sb.from('ym_entry').insert(row);
  })).then(rs=>{
    const bad=rs.find(r=>r&&r.error);
    if(bad)toast(ledgerNotReady(bad.error)?'门票没进总账 —— 数据库迁移 0018 还没应用（收支牌已经记下了）'
      :'门票台账未写入：'+bad.error.message);

}

/* 当天也看得到时刻表 (owner 2026-07-27)：现场真正会变的是**时长** —— 某个环节拖长了，

function dayRun(e){
  const rows=e.rows,SCH=evSchedule(e);
  const nextIdx=rows.findIndex(r=>!r.actual);
  let lastDone=-1;rows.forEach((r,i)=>{if(r.actual)lastDone=i;});
  const endM=evEndMin(e);
  const bar=`<div class="schedbar"><span>${ico('go')}${rows.length} 个环节</span>
    <span class="num">${e.start?esc(e.start):'--:--'}${endM!=null?' → 预计结束 '+esc(hm(endM)):''}</span></div>`;
  return bar+rows.map((r,i)=>{
    const cls=r.actual?(i===lastDone?'now':'done'):(i===nextIdx?'next':'');
    return `<div class="runrow ${cls}" role="button" tabindex="0" onclick="tapRun('${r.id}')">
      <span class="rt">${esc(r.time||hm(SCH[i].start)||'--:--')}</span>
      <span class="rs">${esc(r.seg||'（未命名）')}${r.owner?` <span class="ow">· ${esc(r.owner)}</span>`:''}</span>
      <input class="durin" value="${esc(r.dur||'')}" placeholder="分" inputmode="numeric" title="改时长 —— 后面自动顺延"
        onclick="event.stopPropagation()" onchange="event.stopPropagation();rowDur('${r.id}',this.value)">
      ${i===lastDone&&r.actual?'<span class="tag9">进行中</span>':''}
      ${i===nextIdx?'<span class="tag9" style="color:var(--brass-dim)">下一项</span>':''}
      <span class="ra">${r.actual?'实际 '+esc(r.actual):''}</span></div>`;
  }).join('')+`<p class="note9">点一行＝记下实际开始时间（再点撤销）。改「分」＝改时长，后面的时刻和预计结束会跟着动；计划时刻不变，复盘看差距。</p>`;
}

function recStart(){
  if(S.recPhase==='rec')return;   // works from the 记录 tab (with 号牌 selected) or the mic fab anywhere
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    REC.chunks=[];REC.mr=new MediaRecorder(stream);REC.secs=0;
    REC.mr.ondataavailable=ev2=>REC.chunks.push(ev2.data);
    REC.mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());recSend();};
    REC.mr.start();S.recPhase='rec';
    const b=$('recbtn');if(b)b.classList.add('rec');
    const mf=$('micfab');if(mf)mf.classList.add('rec');
    const s=$('recsec');if(s)s.textContent='0s · 松开结束';
    REC.timer=setInterval(()=>{REC.secs++;
      const el=$('recsec');if(el)el.textContent=REC.secs+'s · 松开结束';
      const ln=$('recline');if(ln)ln.style.width=Math.min(REC.secs*8+12,88)+'%';},1000);

function recStop(){

function recSend(){
  const type=(REC.mr&&REC.mr.mimeType)||'audio/webm';

    fetch(API+'/api/voice',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({audio_b64:String(fr.result).split(',')[1],media_type:type.split(';')[0],roster:ymRoster()})})

    .catch(e2=>{S.recPhase='idle';toast('识别失败：'+e2.message);render();});

/* ================= 口述：对着输入框说话 (owner 2026-07-27) =================
   「这些窗口都应该开通语音输入，这里才是最需要的地方。」在手机上把一个个窗口的输入框
   敲满，是这个 app 里最费劲的动作 —— 所以每个文本框旁边都给一个话筒。
   走的是已经在用的 /api/voice（MediaRecorder → Gemini），只是 mode:'dictate'：
   只转写、不判断意图，因此不需要活动上下文，任何窗口都能用。
   ⚠ 和浮动话筒是两套状态：那个是「说一句话 → AI 猜你要做什么」，这个是「把我说的写进这一格」。
   混用一个 REC 会互相打断，所以这里自己拿一份 MediaRecorder。 */
let DIC={mr:null,chunks:[],id:null,stream:null};
function micBtn(inputId,label){

function dicToggle(id){
  if(DIC.id===id){dicStop();return;}
  if(DIC.id){dicStop();return;}                 // 一次只录一格
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('这个浏览器不支持录音');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    DIC.stream=stream;DIC.chunks=[];DIC.id=id;
    DIC.mr=new MediaRecorder(stream);
    DIC.mr.ondataavailable=ev2=>DIC.chunks.push(ev2.data);
    DIC.mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());dicSend(id);};
    DIC.mr.start();
    // 不 render()：一次重绘会把这个窗口里已经打了一半的字全部换回保存过的值
    const b=document.querySelector('.micbtn[onclick*="'+id+'"]');if(b)b.classList.add('rec');

function dicStop(){

function dicSend(id){
  const type=(DIC.mr&&DIC.mr.mimeType)||'audio/webm';
  const blob=new Blob(DIC.chunks,{type});
  DIC.mr=null;DIC.chunks=[];DIC.id=null;
  if(!blob.size){toast('没录到声音');return;}
  toast('转写中…');
  const fr=new FileReader();
  fr.onload=()=>{
    fetch(API+'/api/voice',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({audio_b64:String(fr.result).split(',')[1],
        media_type:type.split(';')[0],roster:{mode:'dictate'},
        user_token:(typeof SESSION!=='undefined'&&SESSION&&SESSION.access_token)||null})})
    .then(r=>r.json()).then(res=>{
      const el=$(id);const b=document.querySelector('.micbtn.busy');if(b)b.classList.remove('busy');
      const t=String((res&&res.transcript)||'').trim();

      if(!el){toast('听到：'+t);return;}

      el.value=el.value&&el.value.trim()?el.value.replace(/\s+$/,'')+' '+t:t;
      el.dispatchEvent(new Event('change',{bubbles:true}));

    .catch(e2=>{const b=document.querySelector('.micbtn.busy');if(b)b.classList.remove('busy');
      toast('转写失败：'+e2.message);});
  };
  fr.readAsDataURL(blob);
}

/* ---- ⬆ roster CSV import (嘉宾名册 导入 — Excel 另存为 CSV) ---- */
function csvImport(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  const fr=new FileReader();fr.onload=()=>importRoster(String(fr.result));fr.readAsText(f);
