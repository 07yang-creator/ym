function csvParseLine(l){
  const out=[];let cur='',q=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){out.push(cur);cur='';}
    else cur+=ch;}
  out.push(cur);return out;
}
function importRoster(txt){
  const e=ev();if(!e)return;
  const lines=txt.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){toast('CSV 至少要有表头和一行数据');return;}
  const head=csvParseLine(lines[0]);
  const idx=n=>head.findIndex(h=>h.trim().indexOf(n)>=0);
  const iName=idx('姓名'),iG=idx('性别'),iAge=idx('年龄'),iJob=idx('职业'),
        iTel=idx('联系'),iInc=idx('收入'),iMar=idx('婚姻'),iArea=idx('居住')<0?idx('地区'):idx('居住');
  if(iName<0){toast('没找到「姓名」列 — 第一行需是表头');return;}
  let added=0;
  lines.slice(1).forEach(l=>{
    const c=csvParseLine(l);const name=(c[iName]||'').trim();if(!name)return;
    const g=(iG>=0&&(c[iG]||'').indexOf('男')>=0)?'男':'女';
    const n=Math.max(0,...e.participants.filter(p=>p.gender===g).map(p=>p.n))+1;
    const gv=i=>i>=0?(c[i]||'').trim():'';
    const p={id:uid(),gender:g,n,name,job:gv(iJob),arrived:false,at:null,evals:[],
      profile:{age:gv(iAge),contact:gv(iTel),income:gv(iInc),marital:gv(iMar),area:gv(iArea)}};
    e.participants.push(p);fileGuest(p);      // also files into the 嘉宾名册
    added++;});
  save();render();toast('已导入 '+added+' 人（Excel 名单另存为 CSV 即可）');
}
/* ================= 票据 → 台账 (Y8) =================
   四个入口（任务·主办台·复盘·捐助者）共用 ONE capture + ONE 确认卡 + ONE writer。差别只有 ctx。
   台账（ym_entry）是钱的权威；money chip 的 actual 从此是它的显示副本（rcSettle 全量重算）。
   图片永不进 ym_doc.payload：主办拍的经 /api/ym_file 进主办自己的 Google Drive，表里只留引用；
   成员传的在 ym_submit.file_data，入账时同样转存一份到 Drive（0017 §2：ym_revoke_code 会删掉
   ym_submit 行，帐簿必须自带凭证）。 */
const RC_PAY=['現金','クレジット','電子マネー','振込','立替','その他'];
// 立替 = a volunteer fronted the money → we owe them → 未払金 (a LIABILITY).
// 立替金 is an ASSET (money WE fronted for someone else) and would be the wrong side.
const RC_CTR={'現金':'現金','クレジット':'未払金','電子マネー':'未払金','振込':'普通預金',
              '立替':'未払金','その他':'未払金'};
const RC_ACCT=['会場費','消耗品費','会議費','接待交際費','広告宣伝費','旅費交通費','通信費',
               '印刷製本費','支払手数料','外注費','雑費','売上高(参加費)','受取寄付金','雑収入'];
let LEDGER=null;                    // ym_entry cache. NEVER holds image/parse — see loadLedger.
let LEDGER_ERR='';                  // 上一次读失败的原因；空状态靠它区分「没有」和「没读到」

// 課税/免税. 缘满沙龙 ≈ ¥6M 課税売上高 → 免税事業者、且 2割特例 covers 令和8年分 —— 仕入税額控除
// はそもそも関係ない。だから既定は免税で、インボイス関連の表示は一切出さない。データは両方の
// 場合とも保存する（parse.py が返すものを捨てないだけで、コストはゼロ）。
/* 记账一律按**含税**，消費税的课否判定交给税理士 (owner 2026-07-27)。
   所以这里没有 課税/免税 开关，也没有 非適格 / 経過措置 / 少額特例 的任何提示 ——
   那些都是「让主办替税理士思考」。amount 永远是税込，这一列才是权威。
   票面上真读到的税率明细照存（对税理士有用、且不花钱），**读不到就不编**。 */
// 借方/貸方 は direction + payment の純粋関数。だから payment はサーバ側で CHECK 列挙してある
// —— このマップが全域でないと、記帳できない行が生まれる。
function rcJournal(r){const ctr=RC_CTR[r.payment]||'現金';
  return r.direction==='out'
    ? {dr:r.account||'雑費',cr:ctr}
    : {dr:(r.payment==='現金'?'現金':r.payment==='振込'?'普通預金':'未収入金'),cr:r.account||'売上高(参加費)'};}
// 要核对 = 解析服务没响应 ∪ 没写勘定科目。税に関する判定は入っていない（税理士の領分）。
function rcCheck(r){return r.confidence==='mock'||!r.account;}
function num0(v){const n=parseInt(String(v==null?'':v).replace(/[^\d]/g,''),10);return isNaN(n)?0:n;}
// parse.py promises YYYY-MM-DD and validates NOTHING, so 2026/6/9 and 2026年6月9日 both arrive.
function dateOf(s){const m=String(s||'').match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
  return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):'';}
/* 税率ごとの内訳は「票面に書いてあったもの」だけ。合計と合わなければ捨てる。
   ⚠ 以前はここで 10% 内税として**組み立てて**いた。だが 8% の軽減税率も 非課税 も
   同じ顔で 10% に化けるので、それは読み取りではなく**捏造**であり、税理士が読む列に
   作り話が入る。金額は税込で記帳してあるのだから、内訳が無いのは何も失っていない
   —— 課否判定は税理士の仕事 (owner 2026-07-27「按含税来记，税务问题交给税理士思考」)。 */
function rcTax(lines,total){
  const ok=['10','8','0','非課税'];
  const out=(lines||[]).filter(x=>x&&ok.indexOf(String(x.rate))>=0)
    .map(x=>({r:String(x.rate),b:Math.max(0,num0(x.base)),t:Math.max(0,num0(x.tax))}));
  const sum=out.reduce((s,x)=>s+x.b+x.t,0);
  if(out.length&&total&&Math.abs(sum-total)<=2)return out;   // 端数 2 円までは一致とみなす
  return [];}

function loadLedger(force){
  if(!canCloud())return Promise.resolve();
  if(LEDGER&&!force)return Promise.resolve();
  // never select parse — the list must not drag the raw OCR across the wire (the same
  // discipline loadPending() applies to file_data). 图片本来就只是一个 Drive 链接。
  /* ⚠ payer_ref 必须在这张清单里。少了它，feeOf()/feePaidIds() 读到的永远是 undefined，
     于是「已经单独交过钱的人」一个都认不出来 —— 0022 那整套防重复计账在客户端**全线失效**，
     报名费和门票汇总会同时入账。2026-07-28 复查抓到：**列清单是一道会静默失效的门**，
     而我自己的浏览器验证之所以过了，是因为手工塞了带 payer_ref 的假行，没走这条真路。 */
  return sb.from('ym_entry').select('id,voucher_no,entry_date,paid_date,direction,amount,'+
      'tax_total,tax,account,payment,vendor,reg_no,memo,event_id,chip_id,payer_ref,src,src_submit,'+
      'member_code,confidence,status,void_reason,image_id,image_url,image_name,created_at')
    .order('entry_date',{ascending:false}).order('seq',{ascending:false}).limit(3000)
    .then(({data,error})=>{
      // ⚠ 以前这里写 LEDGER=LEDGER||[]，而 [] 是真值 —— 一次网络抖动之后 loadLedger 永远
      // 早退，总账整场显示 ¥0，CSV 导出一张空表，而且屏幕上写的是「还没有记录」。
      // 读失败就让它继续是 null（下次还会去读），另外记一笔，好让空状态说实话。
      if(error){toast('台账读取失败：'+error.message);LEDGER_ERR=error.message||'读取失败';render();return;}
      LEDGER_ERR='';LEDGER=data||[];render();});      // ← D3 defect (a): the missing render()
}

/* ---- capture: the ONE component all four entry points call ---- */
/* ================= 手机拍 —— 桌面 ↔ 手机的扫码通道 (owner 2026-07-28) =================
   「电脑上那个按钮只是选一张照片，很难用。」—— 票在手里，相机在手机上。
   **直接复用 0005_capture.sql 已经建好的那条通道**（jjcashflow 客户端在用的同一条），
   一行 SQL 都不用加，因为它跟 cashflow 没有任何耦合：
     · capture_session.owner = auth.uid()（ym 主办和会计用的是同一个 auth）
     · p_draft 是**不透明 jsonb** → ym 直接把 /api/parse 的原始结果丢进去，
       电脑这边再喂给已有的 rcSeed/rcCard，那张逐格确认卡一个字都不用改
     · cap_submit 匿名可调、凭 token、10 分钟过期、**一次只允许一张未认领的**
       （所以不会覆盖掉你还没确认的那张）
     · cap_claim 只有 owner 能调，原子消费，并**在服务端**记一次 OCR 用量
   ⚠ 手机那一侧是**匿名**的，所以它打 /api/parse 时没有 user_token —— 计量由 cap_claim
     在电脑认领时记，一张一次，客户端伪造不了。套件里那条「每个调用点都带 user_token」
     的断言相应放宽为「带 token **或** 走 cap_submit」。 */
const CAP_TTL=10*60*1000;                 // 0005：capture_session 10 分钟过期
let CAP={token:null,url:null,timer:null,busy:false,exp:0};
function capQrLib(){return new Promise(res=>{
  if(window.qrcode)return res();

  s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';

async function capOpen(){

     而不是作废掉手机上正扫着的那一个。 */
  if(CAP.token&&Date.now()<CAP.exp){capDraw();await capQrLib();capDraw();capPoll();return;}
  capStop();
  try{await sb.from('capture_session').delete().eq('owner',SESSION.user.id).eq('status','open');}catch(e){}
  const {data,error}=await sb.from('capture_session').insert({owner:SESSION.user.id}).select('id').single();
  if(error){toast('开不了会话：'+error.message);return;}

// 只收起界面，**会话留着** —— 认领一张之后走这条：手机还要接着拍下一张
function capHide(){const h=$('capwrap');if(h)h.remove();}
function capStop(){if(CAP.timer){clearInterval(CAP.timer);CAP.timer=null;}
  CAP={token:null,url:null,timer:null,busy:false,exp:0};}
/* 用户主动关（✕ / 点背景）才真的销毁会话。
   ⚠ 但**先认领一次**：手机可能刚传回一张（status='ready'），而轮询在主办正确认别的票据时
     是暂停的（capPoll 的 S.rc 互斥）。无条件 delete 会把那一张连图片一起弄没，两边都没有提示。
     delete 也加上 .eq('status','open') 兜底 —— 万一认领失败，也不会删掉 ready 的那一行。 */
async function capClose(){
  const tok=CAP.token;
  capHide();
  if(!tok||!sb||!SESSION){capStop();return;}
  let pending=null;
  try{const {data}=await sb.rpc('cap_claim',{p_token:tok});if(data&&data.draft)pending=data;}catch(e){}
  if(pending){
    // 手机传回的那张还没被确认 —— 别丢，直接打开确认卡；会话这一轮就到此为止
    capStop();
    try{await sb.from('capture_session').delete().eq('id',tok).eq('status','open');}catch(e){}
    capTake(pending);toast('手机刚传回一张 —— 先把它确认掉');
    return;}
  capStop();
  try{await sb.from('capture_session').delete().eq('id',tok).eq('status','open');}catch(e){}
}
/* 草稿是**匿名手机**传来的，一个字都不能信 —— 逐格夹到 rcSeed 认得的形状和上限。
   （rcSeed 里已经有 num0/dateOf/T 号正则那几道，这里补的是长度、条数和枚举。） */
function capClean(raw){
  raw=raw||{};
  const s=(v,n)=>String(v==null?'':v).slice(0,n||120);
  const tax=Array.isArray(raw.tax_lines)?raw.tax_lines.slice(0,12).map(t=>({
    rate:s((t||{}).rate,6),base:+((t||{}).base)||0,tax:+((t||{}).tax)||0})):[];
  return {source:raw.source==='mock'?'mock':'ai',
    confidence:['high','medium','low'].indexOf(raw.confidence)>=0?raw.confidence:'medium',
    is_receipt:raw.is_receipt!==false,
    direction:raw.direction==='in'?'in':'out',
    issue_date:s(raw.issue_date,10),
    vendor:s(raw.vendor,120),
    total_incl_tax:Math.max(0,Math.min(100000000,+raw.total_incl_tax||0)),
    invoice_reg_no:s(raw.invoice_reg_no,20),
    suggested_account:s(raw.suggested_account,40),
    payment_method:s(raw.payment_method,10),
    tax_lines:tax};
}
/* 认领到的一张 → ym 自己的确认卡。
   ⚠ 手机那一侧**明确支持 PDF**（请求書多半是 PDF），所以白名单必须认它 ——
     以前只认 data:image，PDF 会静默变成 img:''，账记下了而**証憑一个字节都没留**，
     屏幕上还照常说「原图已存进网盘」。带不回来的时候必须说出来。 */
const CAP_IMG_RE=/^data:(image\/(?:png|jpe?g|webp)|application\/pdf);base64,([A-Za-z0-9+/=]+)$/;
function capTake(data){
  const raw=String(data.image||'');
  const m=CAP_IMG_RE.exec(raw);
  const pdf=m&&m[1]==='application/pdf';
  S.rc={d:capClean(data.draft),ctx:{src:'host',evId:''},
        img:m?m[2]:'',mime:m?m[1]:'image/jpeg',name:'手机拍.'+(pdf?'pdf':'jpg')};
  rcSeed('');capHide();render();
  if(raw&&!m)toast('⚠ 手机传回来了，但原件没能带过来 —— 入账前请自己另存一份');
  else toast('手机传回来一张 —— 请核对');
}
function capPoll(){
  if(CAP.timer)clearInterval(CAP.timer);
  CAP.timer=setInterval(async()=>{
    if(!CAP.token){capStop();return;}
    /* ⚠ 轮询**不跟着二维码窗口走**。认领一张之后我们只收起窗口、会话留着 ——
       两边文案承诺的「可以连着拍」全靠这条：手机接着传，主办确认完上一张就自动接住下一张。
       （以前这里是 `if(!$('capwrap'))capClose()`，于是第一张确认完通道就被销毁了，
        手机上第二张按下去只会看到一句日文的「セッションが見つかりません」。） */
    if(Date.now()>=CAP.exp){                     // 0005 的 cap_claim 不看 expires_at，得我们自己看
      const had=!!$('capwrap');capStop();
      if(had)capDraw();                          // 会画成「已过期 —— 重新生成」那一屏
      else toast('手机拍的二维码已过期 —— 要接着拍请重新点「手机拍」');
      return;}
    if(CAP.busy||S.rc)return;                    // 已经有一张在确认了，别覆盖
    CAP.busy=true;
    try{
      const {data}=await sb.rpc('cap_claim',{p_token:CAP.token});
      if(data&&data.draft)capTake(data);
    }catch(e){}
    finally{CAP.busy=false;}
  },1600);
}

function capStat(t){const e=$('cap_stat');if(e)textInto(e,t);}
function textInto(el,t){el.textContent=String(t==null?'':t);}
function capShoot(inp,token){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  capStat('处理图片中…');
  const go=(b64,mime)=>{
    if(!b64||b64.length>600000){capStat('这张太大或打不开（约 400KB 以内），请重拍');return;}
    capStat('识别中…');
    // ⚠ 匿名，没有 user_token —— 用量由 cap_claim 在电脑认领时在**服务端**记一次
    fetch(API+'/api/parse',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({image:b64,media_type:mime})})
    .then(r=>r.json()).catch(()=>({}))
    .then(res=>{
      if(res&&res.is_receipt===false){capStat('这张不像票据，请重拍');return;}
      capStat('传给电脑…');
      return sb.rpc('cap_submit',{p_token:token,p_draft:res||{},
        p_image:'data:'+mime+';base64,'+b64})
        .then(({error})=>{
          if(error){
            /* 0005 的报错是日文原文，中文界面里直接甩出来没人看得懂。三种情况分开说，
               而且每一种都要说**下一步做什么** —— 手机上没有别的线索可循。 */
            const t=String((error&&error.message)||error||'');
            capStat(/有効期限|expire/i.test(t)?'二维码过期了 —— 请让电脑那边重新点一次「手机拍」'
              :/見つかりません|not found/i.test(t)?'这个二维码已经失效 —— 请重新扫一次电脑上的码'
              :/前の写真|確認して/.test(t)?'上一张还没在电脑上确认 —— 确认完再拍下一张'
              :'传不过去：'+t);
            return;}
          capStat('');
          const d=$('cap_done');if(!d)return;
          d.innerHTML='';
          const box=document.createElement('div');box.className='rvsec';
          const h=document.createElement('div');h.style.cssText='font-size:15px;font-weight:700;color:var(--ok)';
          h.textContent='✓ 已传回电脑';

    rd.onload=()=>go(String(rd.result).split(',')[1]||'','application/pdf');
    rd.readAsDataURL(f);return;}
  shrink(f,b64=>go(b64,'image/jpeg'));
}
function rcShoot(inp,ctx){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(!canCloud()){toast(SESSION?'等主办方账号通过审核后才能记账':'票据要登录后才能入账 —— 台账在云端');return;}
  toast('识别票据中…');    // 相机圆钮 (fab menu) 已经不存在了 —— 这里没有菜单要关
  if(f.type==='application/pdf'){
    if(f.size>400000){toast('这个 PDF 太大了（约 400KB 以内）');return;}
    const rd=new FileReader();
    rd.onload=()=>rcParse(String(rd.result).split(',')[1]||'','application/pdf',f.name||'票据.pdf',ctx);
    rd.readAsDataURL(f);return;}
  shrink(f,b64=>rcParse(b64,'image/jpeg',f.name||'票据.jpg',ctx));

function rcParse(b64,mime,name,ctx){
  if(!b64||b64.length>600000){toast('这张太大或打不开（约 400KB 以内），请重拍');return;}
  const open=(res,conf)=>{S.rc={d:res||{},ctx:Object.assign({},ctx||{}),img:b64,mime,name};
    rcSeed(conf);render();};
  fetch(API+'/api/parse',{method:'POST',headers:{'content-type':'application/json'},
    // user_token: parse.py's log_usage() verifies this JWT server-side. Without it every ym OCR
    // call is unmetered — and none ever has been.
    body:JSON.stringify({image:b64,media_type:mime,
      user_token:(SESSION&&SESSION.access_token)||undefined})})
  .then(r=>r.json()).then(res=>{
    if(res&&res.is_receipt===false){toast('这张不像票据，请重拍');return;}
    open(res,'');})
  // 圏外でも取りこぼさない：画像は握ったまま手入力に落とす（会場の WiFi は必ず死ぬ）。
  .catch(()=>{open({},'hand');toast('没连上识别服务 —— 请手工填一下，原图已经留着了');});
}
// AI 只提议。parse 结果搬进可编辑草稿，一次；之后 render() 不再覆盖主办改过的值。
function rcSeed(force){
  const R=S.rc,d=R.d||{},c=R.ctx||{};
  // EVERY failure path in parse.py returns HTTP 200 with the fabricated MOCK at confidence 'high'.
  // source==='mock' is the ONLY safe outage signal — without this branch the book silently accrues
  // ¥1,382 コピー代 lines from ファミリーマート 渋谷店 with a fabricated T-number.
  const mock=d.source==='mock';
  R.conf=force||(mock?'mock':String(d.confidence||''));
  const total=mock?0:num0(d.total_incl_tax);
  const e=c.evId?STORE.events.find(x=>x.id===c.evId):null;
  R.dir=c.forceDir||(d.direction==='in'?'in':'out');       // donor: FORCED, never trusted
  R.pay=c.selfPaid?'立替':(RC_PAY.indexOf(d.payment_method)>=0?d.payment_method:'現金');
  R.who=c.src==='vol'?(c.selfPaid?'self':'advance'):'host';
  R.more=false;
  R.tax=mock?[]:rcTax(d.tax_lines,total);
  R.seedAmt=total;            // rcConfirm 靠它判断「主办改过金额没有」
  const reg=mock?'':String(d.invoice_reg_no||'').replace(/\s/g,'').toUpperCase();
  R.f={date:(mock?'':dateOf(d.issue_date))||(e&&e.date)||todayStr(),
       paid:'',amt:total?String(total):'',
       vendor:mock?'':String(d.vendor||'').slice(0,120),
       reg:/^T\d{13}$/.test(reg)?reg:'',
       acct:c.account||(mock?'':String(d.suggested_account||'').slice(0,40))
            ||(R.dir==='in'?'売上高(参加費)':''),
       memo:c.memo||'',chip:c.chipId||'',ev:c.evId||''};
}
function rcKeep(){const R=S.rc;if(!R)return;const g=i=>{const el=$(i);return el?el.value:undefined;};
  ['date','paid','amt','vendor','reg','acct','memo','chip','ev'].forEach(k=>{
    const v=g('rc_'+k);if(v!==undefined)R.f[k]=v;});
  const p=g('rc_pay');if(p!==undefined)R.pay=p;}
function rcSet(k,v){rcKeep();S.rc[k]=v;
  if(k==='dir'){S.rc.f.chip='';
    if(RC_ACCT.indexOf(S.rc.f.acct)<0)S.rc.f.acct='';}
  render();}

// 0018 还没应用时数据库回的是 42703「column "image" does not exist」—— 那是触发器里的列名，
// 跟主办拍的这张票据毫无关系，所以单独认出来，说人话。
/* 「这张表还差一条迁移」到底长什么样，取决于**哪一层**先拒绝：
     · 数据库拒绝（列真的不存在）→ 42703
     · **PostgREST 的 schema cache 先拒**（它在请求到达数据库之前就发现字段不认识）→ PGRST204
     · CHECK 约束不认新枚举值（比如 src='fee' 而 0022 还没应用）→ 23514
   以前只认第一种，于是 0022 没应用时 feeAdd 那句「迁移还没应用」**永远不会出现**，
   主办看到的是一句 PostgREST 的英文原文。 */
function ledgerNotReady(e){const m=String((e&&e.message)||'')+' '+String((e&&e.code)||'');
  return /42703|PGRST204|23514/.test(m)||/schema cache/i.test(m)
    ||/column .*(image|payer_ref).* does not exist/i.test(m);}
/* ---- THE ONE WRITER ---- */
/* 票据图片 → 主办自己的 Google Drive，按 <活动>/<类型> 分目录 (owner 2026-07-27)。
   走 /api/ym_file：Apps Script 的 /exec 对公网开放，所以那边只有上传能力、没有删除；
   这边先确认调用者是已批准主办或有效成员，才转发一个字节。
   Drive 没配好时端点回 503 —— 那时账照记，只是没有图，不该因此丢掉主办刚拍的东西。 */
async function rcUpload(b64,mime,name,ev){
  try{
    const group=ev?((ev.name||'活动')+' · '+(ev.date||'')).trim():'';
    const r=await fetch(API+'/api/ym_file',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({user_token:(SESSION&&SESSION.access_token)||undefined,
        action:'upload_media',group,kind:'票据',
        filename:String(name||'票据.jpg').slice(0,120),mime_type:mime,content_base64:b64})});
    if(!r.ok)return null;
    const j=await r.json();
    return j&&j.ok?{id:String(j.file_id||''),url:String(j.url||'')}:null;
  }catch(e){return null;}
}
let _rcBusy=false;
async function rcConfirm(){
  const R=S.rc;if(!R||S.readonly||!canCloud())return;
  // Drive 上传 + insert 之间有好几秒。主办的账没有 src='host' 的唯一索引兜底，
  // 第二次点就是**第二笔真账**（金额翻倍，而且两张凭证长得一模一样）。
  if(_rcBusy){toast('正在入账，别重复点');return;}
  _rcBusy=true;
  try{await rcConfirmDo(R);}finally{_rcBusy=false;}

async function rcConfirmDo(R){
  rcKeep();const f=R.f,c=R.ctx||{};
  const amount=num0(f.amt);
  if(!amount){toast('金额不能为空');return;}
  const date=dateOf(f.date);
  if(!date){toast('計上日填一下 —— 帳簿は日付から始まる');return;}   // never blocks on 科目
  const reg=String(f.reg||'').trim().toUpperCase();
  if(reg&&!/^T\d{13}$/.test(reg)){toast('登録番号是 T + 13 位数字 —— 不确定就清空');return;}
  /* 税額の内訳は AI が読んだ**あの金額**に対するもの。主办把金额改掉（OCR 看错一位是常事）
     以后还沿用旧内訳，CSV 里的 税抜+税額 就和 税込 对不上 —— 消費税申告に使えない行になる。
     金额一变就按内税 10% 重算；寄付は 不課税 なので、そもそも税を立てない。 */
  const donation=(c.src==='donor')||f.acct==='受取寄付金';
  // 金额被改过 → 票面读到的内訳已经不属于这个数字了，直接丢掉（不重算、更不编）
  const tax=(donation||amount!==num0(R.seedAmt))?[]:R.tax.map(t=>({r:t.r,b:t.b,t:t.t}));
  // 图片先进主办自己的 Drive，帳簿里只留引用 (owner 2026-07-27)。上传失败不挡主办自己拍的那张
  // —— 一行没有图的账目仍然是有用的记录。但成员/捐赠者交来的必须带凭证（0017 §2 的 CHECK），
  // 因为 ym_submit 那行随时会被 取消授权 删掉；那种情况下宁可不入账，也不能记一笔无据的钱。
  let img={id:'',url:''};
  if(R.img){
    const evv=f.ev?STORE.events.find(x=>x.id===f.ev):null;
    img=await rcUpload(R.img,R.mime,R.name,evv)||{id:'',url:''};
    if(!img.id&&(c.src==='vol'||c.src==='donor')){
      toast('图片没能存进网盘 —— 成员交来的票据必须连凭证一起入账，请稍后再试');return;}
  }
  const row={host:SESSION.user.id,entry_date:date,paid_date:f.paid||null,
    direction:R.dir,amount,tax,tax_total:Math.min(amount,tax.reduce((s,t)=>s+t.t,0)),
    account:String(f.acct||'').slice(0,40),payment:R.pay,
    vendor:String(f.vendor||'').slice(0,120),reg_no:reg,memo:String(f.memo||'').slice(0,500),
    event_id:f.ev||'',chip_id:f.chip||'',
    src:c.src||'host',src_submit:c.submitId||null,member_code:c.memberCode||'',
    confidence:R.conf||'',parse:R.d&&R.d.source?R.d:null,
    image_id:img.id,image_url:img.url,
    image_mime:img.id?R.mime:null,image_name:img.id?String(R.name||'票据.jpg').slice(0,200):''};
  const {data,error}=await sb.from('ym_entry').insert(row).select('id,voucher_no').single();
  if(error){toast(/duplicate|unique/i.test(error.message)?'这张票据已经入过账了'
    // 0017 的 ym_entry_cap() 数了一列不存在的 image；0018 之前每一次入账都会 42703 回滚。
    // 说清楚是数据库那一步没做，别让主办以为是自己拍错了。
    :ledgerNotReady(error)?'台账还没开通 —— 数据库迁移 0018 还没应用。卡还留着，应用后再点一次'
    :'入账失败：'+error.message+' —— 卡还留着，联网后再点一次');return;}   // card stays open
  if(c.submitId){const u=await sb.from('ym_submit').update({status:'accepted'}).eq('id',c.submitId);
    if(u.error)toast('已入账，但回执未标记：'+u.error.message);
    loadPending();}
  S.rc=null;
  await loadLedger(true);
  rcSettle(row.event_id,row.chip_id);
  render();toast('已入账 '+data.voucher_no+' · '+yen(amount)
    +(R.img&&!img.id?' —— 图片没能存进网盘，账目已记下':''));
}
// 志愿者自付：一行台账都不写。只把提交标成已确认 —— 钱留在 ym_submit.cost（贡献记录）。
async function rcSelfOnly(){
  const c=(S.rc||{}).ctx||{};S.rc=null;render();

    loadPending();}

/* chip.actual 是台账的显示副本。用 Σ 全量重算（不是 +=），所以取消一张、改一张，都能诚实地重结。
   c.rc 只有一个含义（凭证张数）；cpM 的白名单会自动把它丢掉 —— 新活动没有实际发生额，正确。
   evId で引くので、別のイベントを開いていても正しく決まる（D3 defect (c)）。 */
function rcSettle(evId,cid){
  if(!evId||!cid)return;
  const e=STORE.events.find(x=>x.id===evId);if(!e)return;
  let c=null;[e.header].concat(e.rows).forEach(h=>(h.money||[]).forEach(m=>{if(m.id===cid)c=m;}));
  if(!c)return;                                   // a 任务 chip has no actual — correct no-op
  const rows=(LEDGER||[]).filter(r=>r.chip_id===cid&&r.status==='posted');
  if(!rows.length){
    // 取消了最后一张。actual 是台账的副本，副本必须跟着空掉 —— 否则牌子上留着一个没有任何凭证
    // 支撑的数字，而且 复盘 的对账行会说「一致」。c.rc 是「这条曾由台账结算」的唯一标记：没有它
    // 就说明这个实际额是主办自己手填的（execCost / editMoney），那不是我们的，不能替他抹掉。
    if(c.rc!=null){c.actual=null;delete c.rc;save();}
    return;
  }
  let s=0;rows.forEach(r=>{s+=(r.direction===c.kind)?r.amount:-r.amount;});
  c.actual=s;c.rc=rows.length;save();
}
// 从成员上传的那张（ym_submit）入账：取字节 → 识别 → 同一张确认卡。
// selfPaid は SUBMIT 行から取る —— cost は file 行ではなく submit 行にある（member L~430）。
function rcFromSubmit(sid,src){
  if(!canCloud())return;
  // 只读回看（已归档活动）里不该有写入动作 —— 捐赠条上的「入账」以前没挡，
  // 一点就真的记一笔账，还白烧一次 OCR 调用。
  if(S.readonly){toast('只读回看 —— 退出只读才能入账');return;}
  const r=PENDING.find(x=>x.id===sid);if(!r){toast('这条已经不在了');return;}
  const sub=PENDING.find(x=>x.kind==='submit'&&x.chip_id===r.chip_id
    &&String(x.member_code||'')===String(r.member_code||'')&&x.event_id===r.event_id);
  const selfPaid=src==='vol'&&!!(sub&&(parseInt(sub.cost,10)||0)>0);
  toast('读取并识别中…');
  sb.from('ym_submit').select('file_name,file_mime,file_data,amount,note').eq('id',sid).maybeSingle()
    .then(({data,error})=>{
      if(error||!data||!data.file_data){toast('读取失败');return;}
      const b64=String(data.file_data).replace(/[^A-Za-z0-9+/=]/g,'');   // 0014's XSS lesson
      const mime=/^(image\/(jpeg|png|webp|heic|heif)|application\/pdf)$/.test(data.file_mime||'')
        ?data.file_mime:'image/jpeg';
      rcParse(b64,mime,data.file_name||'票据',{
        src,submitId:sid,memberCode:r.member_code||'',
        evId:r.event_id||'',chipId:src==='donor'?'':(r.chip_id||''),
        selfPaid,forceDir:src==='donor'?'in':null,
        account:src==='donor'?'受取寄付金':'',
        memo:src==='donor'?('捐赠 · '+pendWho(r)):String(data.note||'').slice(0,120)});});
}
// 凭证原图 —— 只在主办点开时取一次。BUILD THE NODE, never attribute HTML (0014's XSS fix).

function ledFy(){return S.ledFy===undefined?new Date().getFullYear():S.ledFy;}
function ledYears(){const s={};(LEDGER||[]).forEach(r=>s[Number(String(r.entry_date).slice(0,4))]=1);
  const y=Object.keys(s).map(Number).sort((a,b)=>b-a);
  const n=new Date().getFullYear();if(y.indexOf(n)<0)y.unshift(n);return y;}
const LED_F=[['all','全部'],['out','支出'],['in','收入'],['open','未決済'],['check','要核对']];
/* 给税理士的 CSV 用 ledExportRows()，不是 ledRows()。
   年度和活动是**范围**，该跟着走；但 支出/収入/未決済/要核对 是屏幕上的**放大镜** ——
   主办点开「要核对」逐条清理，然后按「総勘定元帳 CSV」，导出来的却只有那几条没核对的，
   而且文件名和表头都不会说。帳簿少行是所有错误里最难发现的一种。 */
function ledExportRows(){const keep=S.ledF;S.ledF='all';const r=ledRows();S.ledF=keep;return r;}
function ledRows(){
  const fy=ledFy(),f=S.ledF||'all';
  return (LEDGER||[]).filter(r=>{
    if(fy!=='all'&&Number(String(r.entry_date).slice(0,4))!==fy)return false;
    if(S.ledEv==='__none'&&r.event_id)return false;
    if(S.ledEv&&S.ledEv!=='__none'&&r.event_id!==S.ledEv)return false;
    if(f==='in')  return r.status==='posted'&&r.direction==='in';
    if(f==='out') return r.status==='posted'&&r.direction==='out';
    if(f==='open')return r.status==='posted'&&!r.paid_date&&r.payment!=='現金';
    if(f==='check')return r.status==='posted'&&rcCheck(r);
    return true;})
    .sort((a,b)=>(String(a.entry_date)+a.voucher_no)<(String(b.entry_date)+b.voucher_no)?1:-1);}
// VOID ROWS ARE EXCLUDED FROM EVERY ACCUMULATOR — design 2's ledger did not foot with itself
// because line() honoured `void` and the totals did not.
// 消費税 is split by DIRECTION: a lumped 10% bucket cannot produce a 納付税額, and design 1
// exported exactly that.
function ledTotals(rows){
  const t={in:0,out:0,taxIn:0,taxOut:0,rate:{},open:0,nodoc:0,check:0};
  rows.forEach(r=>{if(r.status!=='posted')return;
    if(r.direction==='in'){t.in+=r.amount;t.taxIn+=r.tax_total||0;}
    else{t.out+=r.amount;t.taxOut+=r.tax_total||0;}
    (r.tax||[]).forEach(l=>{const k=String(l.r||'');if(!k)return;
      t.rate[k]=t.rate[k]||{b:0,t:0};t.rate[k].b+=l.b||0;t.rate[k].t+=l.t||0;});
    if(!r.paid_date&&r.payment!=='現金')t.open+=r.amount;
    if(!r.image_url&&r.src!=='ticket')t.nodoc++;
    if(rcCheck(r))t.check++;});
  t.net=t.in-t.out;return t;}
// 税理士が最初に見るのは明細ではなく科目別の集計。総勘定元帳のロールアップ。
function ledByAccount(rows){const m={};
  rows.forEach(r=>{if(r.status!=='posted')return;
    const k=(r.direction==='in'?'収入':'支出')+' · '+(r.account||'（未分類）');
    m[k]=m[k]||{n:0,amt:0,tax:0};m[k].n++;m[k].amt+=r.amount;m[k].tax+=r.tax_total||0;});
  return Object.keys(m).sort().map(k=>({k,v:m[k]}));}
function evName(id){const e=STORE.events.find(x=>x.id===id);return e?e.name:'';}

// 自费 —— OUTSIDE every total, on purpose (hard constraint 4). ACCEPTED ym_submit rows only.
function ledSelfNote(){

/* 税区分は**書かない**。以前はここが '免税事業者' や '課税仕入10%(経過80%)' を断定していたが、
   その判定こそ税理士の仕事であり、こちらが埋めた欄は「確認済みの事実」として読まれてしまう。
   票面から読めた税率だけは 税率/税抜/消費税 の列に残すので、区分はそれを見て埋めてもらう。 */
function taxKubun(){return '';}
function ledSrc(s){return s==='vol'?'志願者':s==='donor'?'寄付':s==='ticket'?'内部(門票)':'主催';}
// ① 税理士が読む帳簿。一行 per 税率 —— 税込ひとまとめでは消費税申告に使えない。
function exportLedger(){
  const rows=ledExportRows();
  const out=[['証憑番号','計上日','決済日','取引先','登録番号','摘要','勘定科目','借方','貸方',
    '収支','税込金額','税率','税抜','消費税','税区分','活動(部門)','出所','原本','入力日時','状態','取消理由']];
  rows.forEach(r=>{const j=rcJournal(r);
    const tx=(r.tax&&r.tax.length)?r.tax:[{r:'',b:r.amount,t:0}];
    tx.forEach((l,i)=>out.push([i?'':r.voucher_no,i?'':r.entry_date,i?'':(r.paid_date||'未決済'),
      i?'':r.vendor,i?'':r.reg_no,i?'':r.memo,i?'':(r.account||'（未分類）'),i?'':j.dr,i?'':j.cr,
      i?'':(r.direction==='in'?'収入':'支出'),i?'':r.amount,
      l.r||'',l.b||0,l.t||0,taxKubun(r,l.r),
      i?'':(evName(r.event_id)||'一般費用'),i?'':ledSrc(r.src),i?'':(r.image_url?'あり':'なし'),
      i?'':r.created_at,i?'':(r.status==='void'?'取消':''),i?'':r.void_reason]));});
  const t=ledTotals(rows);
  out.push([]);
  out.push(['合計','収入',t.in,'支出',t.out,'差引',t.net]);
  // 票面から読み取れた分だけ添える。読めなかった行は 税率/税抜/消費税 が空欄のまま＝「不明」。
  const rk=Object.keys(t.rate).sort();
  if(rk.length){out.push(['（票面から読み取れた税率内訳）']);
    rk.forEach(k=>out.push(['税率 '+k,'税抜',t.rate[k].b,'税額',t.rate[k].t]));}
  out.push(['※ 金額はすべて税込。消費税の課否判定・税区分は記載していません（税理士にお任せしています）']);
  out.push(['※ 税率欄が空の行は、票面から内訳を読み取れなかった行です（推計はしていません）']);
  out.push(['※ 自費（志願者負担・主催が償還しない分）は本表に含まれません']);
  dlCSV('総勘定元帳_'+ledFy()+'.csv',out);}
// ② 会計ソフト取込用の仕訳。勘定奉行の「汎用データ受入」は受入形式を OBC 側で列ごとに定義でき
//    るので、奉行専用レイアウトを推測して固定するより、日本の会計ソフトが共通で読める仕訳形式を
//    出して税理士に一度マッピングしてもらうほうが確実。弥生/MF/freee も同じ列で入る。
//    日付は 計上日 —— 帳簿と同じ発生主義で揃える（決済日で切ると自分の記帳基準と矛盾する）。
function exportJournal(){
  const rows=ledExportRows().filter(r=>r.status==='posted');
  const out=[['伝票日付','伝票番号','借方科目','借方金額','借方税区分','貸方科目','貸方金額','貸方税区分',
    '消費税額','摘要','取引先名','登録番号','部門','証憑番号']];
  rows.forEach(r=>{const j=rcJournal(r);
    const tx=(r.tax&&r.tax.length)?r.tax:[{r:'',b:r.amount,t:0}];
    const memo=(r.memo||r.vendor||r.account||'').slice(0,60);
    // ⚠ 曾经是 `(l.b||0)+(l.t||0)||r.amount` —— 一个 0 円 的税率桶（模型返回 {rate:'0',base:0,tax:0}
    // 是常事）会掉进 `||r.amount`，于是同一张票据在仕訳里出现**两条全额**，帳簿凭空多一倍。
    // tx 为空时上面已经兜底成 [{b:r.amount}]，所以这里不需要、也不能再兜一次。
    tx.forEach(l=>{const amt=(l.b||0)+(l.t||0);if(!amt)return;
      const z=taxKubun(r,l.r);
      if(r.direction==='out')out.push([r.entry_date,r.voucher_no,j.dr,amt,z,j.cr,amt,'対象外',
        l.t||0,memo,r.vendor,r.reg_no,evName(r.event_id),r.voucher_no]);
      else out.push([r.entry_date,r.voucher_no,j.dr,amt,'対象外',j.cr,amt,z,
        l.t||0,memo,r.vendor,r.reg_no,evName(r.event_id),r.voucher_no]);});});
  dlCSV('仕訳_'+ledFy()+'.csv',out);}

function viewPost(){

  const grp=k=>POSTS.filter(p=>p.kind===k);

// the dialog steals the caret; put it back where the host left it before execCommand runs
function peRestore(r){peFocusBody();if(!r)return;
  const s=window.getSelection();if(s){s.removeAllRanges();s.addRange(r);}}
function pePaste(e){
  e.preventDefault();
  const cd=e.clipboardData||window.clipboardData;if(!cd)return;
  const html=cd.getData('text/html'),txt=cd.getData('text/plain')||'';
  if(html&&window.ymSanitize){
    const frag=window.ymSanitize.frag(html);
    const sel=window.getSelection();
    if(!sel||!sel.rangeCount){$('po_body').appendChild(frag);return;}
    const r=sel.getRangeAt(0);r.deleteContents();
    const last=frag.lastChild;r.insertNode(frag);
    if(last){r.setStartAfter(last);r.collapse(true);sel.removeAllRanges();sel.addRange(r);}
  }else{
    try{document.execCommand('insertText',false,txt);}catch(e2){}
  }
}

function syncEventPost(e,announce){

/* ================= 管理 — admin only (0012) =================
   Server-side is the boundary: profile_upd_admin + is_admin() gate every write here, and
   ym_invite is unreadable to non-admins. This tab is the operator surface, not the guard. */
let ADMIN=null;
function adminLoad(){
  if(!canCloud()||!PROFILE||!PROFILE.is_admin){ADMIN={people:[],codes:[]};return;}
  // ym registrations only — cashflow client/accountant sign-ups stay in the 会计工作台 admin
  // screen. Which table a row is in IS the answer to "where did this registration come from".
  /* 第三条查询是 owner ⑤ 的平台侧：ym_code 带着 host 和 member，管理员读得到全表
     （0015:312 的 ym_code_admin policy）。有了它这一屏才答得出两个问题：
       · 「这个编号是谁邀请的」—— 每一条成员账号后面写上归属的主办
       · 「待批准里这个人到底是不是主办」—— 名下已经有成员码的人**不是**来申请当主办的，
         他只是点错了门（ym 首页以前只有一个「主办登录」按钮）。批准他就等于凭空造了
         一个主办：能铸码、能写 ym_doc、能把帖子发到公开首页。 */
  Promise.all([
    sb.from('ym_member').select('user_id,email,role,status,created_at').order('created_at',{ascending:false}),
    sb.from('ym_invite').select('*').order('created_at',{ascending:false}),
    sb.from('ym_code').select('code,role,paid,host,member,revoked,bound_at')
  ]).then(([p,c,k])=>{
    if(p.error)toast('读取用户失败：'+p.error.message);
    if(c.error)toast('读取邀请码失败：'+c.error.message);
    ADMIN={people:p.data||[],codes:c.data||[],mcodes:k.error?[]:(k.data||[])};render();
  });
}
// 这个 uid 名下有哪些成员编码（＝TA 是别的主办的志愿者/嘉宾/捐赠者）
function adminCodesOf(uid){
  return ((ADMIN&&ADMIN.mcodes)||[]).filter(x=>x.member===uid&&!x.revoked&&x.role!=='H');
}
// 主办用邮箱认（这一屏本来就是按邮箱列的）。故意不查 public_name：0019 没应用时
// 多要一列会让整条 select 42703 失败，管理员那一屏会**整块变空**——比少一个名字糟得多。
function adminHostName(uid){
  const m=((ADMIN&&ADMIN.people)||[]).find(x=>x.user_id===uid);
  return (m&&m.email)||String(uid||'').slice(0,8);
}

    ${adminMembersBlock()}

}
/* owner ⑤ 的平台侧：「这个参加者来自谁的邀请」。按主办分组，每条只显示编号 · 身份 ·
   注册与否 —— **不显示成员的邮箱**（0014 §7：主办按名册上的名字认人，平台不做身份汇总；
   要查具体人走数据库）。这一屏只回答归属，不回答「他是谁」。 */
function adminMembersBlock(){
  const rows=((ADMIN&&ADMIN.mcodes)||[]).filter(x=>x.role!=='H');
  if(!rows.length)return `<div class="sec">成员账号</div>
    <div class="rvsec"><div class="note9">还没有主办给成员发过邀请码。</div></div>`;
  const byHost={};rows.forEach(x=>{(byHost[x.host]=byHost[x.host]||[]).push(x);});
  const groups=Object.keys(byHost).map(h=>{
    const list=byHost[h].sort((a,b)=>String(a.code).localeCompare(String(b.code)));
    const on=list.filter(x=>x.member).length;
    return `<div class="rvrow" style="flex-wrap:wrap;gap:8px">
      <span class="c2">${esc(adminHostName(h))}
        <span class="lbl"> 名下 ${list.length} 个编号 · 已注册 ${on}</span></span>
      <span style="flex:1 0 100%;font-size:11px;color:var(--muted);line-height:1.9">${
        list.map(x=>`${esc(x.code)}${x.revoked?'（已停用）':x.member?'✓':'（待注册）'}`).join(' · ')}</span>
    </div>`;}).join('');
  return `<div class="sec">成员账号 — 谁在谁名下 ${rows.length}</div>
    <div class="rvsec">${groups}
      <p class="note9">成员的注册申请<b>不进这一屏</b> —— 它们直接落到对应主办的「用户」页
        （owner 2026-07-28）。这里只回答归属。</p></div>`;
}
/* 把一个别人家的成员批成主办方，是这一屏能犯的最贵的错（TA 立刻能铸码、能写 ym_doc、
   能把帖子发到公开首页）。所以这一步要多问一句 —— 并且给出真正该做的那件事。 */
function adminSetMember(uid){
  const mine=adminCodesOf(uid);
  ask({title:'这是一个成员账号',
    note:'这个人是「'+adminHostName(mine[0]&&mine[0].host)+'」名下的成员（'+mine.map(x=>x.code).join('、')+'）。'
      +'TA 多半只是点错了门 —— ym 首页以前只有一个「主办登录」。批准为主办方等于凭空多一个'
      +'能铸码、能发布到公开首页的人。真要让 TA 当主办，请在下面输入 确认 两个字。',
    fields:[{label:'输入「确认」继续',ph:'确认'}],ok:'仍然批准为主办方',
    fn:v=>{if((v[0]||'').trim()!=='确认'){toast('已取消 —— 请让 TA 去 /member/ 用自己的邀请码登录');return;}
      adminSet(uid,'approved');}});
}
function adminSet(uid,status){
  if(!status)return;
  // assert on the returned ROW, not merely on the absence of an error: the ym_member trigger
  // silently reverts status for a non-admin caller, which would otherwise "succeed"
  sb.from('ym_member').update({status}).eq('user_id',uid).select('user_id,status').then(({data,error})=>{
    if(error){toast('操作失败：'+error.message);return;}
    const row=data&&data[0];
    if(!row){toast('没有更新任何账号');return;}
    ADMIN=null;render();
    toast(row.status===status?(status==='rejected'?'已停用':'已批准'):'服务器未接受该修改（权限不足）');
  });
}
function adminNewCode(){
  const note=($('ac_note').value||'').trim();
  const uses=parseInt(($('ac_uses').value||'1').replace(/[^\d]/g,''),10)||1;
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';           // no look-alike glyphs
  const buf=new Uint32Array(12);crypto.getRandomValues(buf);
  const body=[...buf].map(x=>A[x%A.length]).join('');
  const code='YM-'+body.slice(0,4)+'-'+body.slice(4,8)+'-'+body.slice(8,12);
  sb.from('ym_invite').insert({code,note,uses_left:uses,
    created_by:SESSION.user.id}).select('code').then(({error})=>{
      if(error){toast('生成失败：'+error.message);return;}
      ADMIN=null;render();adminCopyCode(code);
    });
}
function adminCopyCode(c){
  (navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject())
    .then(()=>toast('已复制邀请码 '+c),()=>prompt('邀请码：',c));

function adminRevokeCode(c){
  if(!confirm('作废邀请码 '+c+'？'))return;
  sb.from('ym_invite').update({uses_left:0}).eq('code',c).select('code,uses_left').then(({data,error})=>{
    if(error){toast('作废失败：'+error.message);return;}
    if(!data||!data.length||data[0].uses_left!==0){toast('没有作废（可能已失效或无权限）');ADMIN=null;render();return;}
    ADMIN=null;render();toast('已作废');

}

function parseHM(t){if(!t||!/^\d{1,2}:\d{2}$/.test(t))return null;const a=t.split(':');return (+a[0])*60+(+a[1]);}
function hm(m){if(m==null)return '';const x=((m%1440)+1440)%1440;
  return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');}
function fmtGap(plan,act){
  const p=parseHM(plan),a=parseHM(act);

  const d=a-p;if(!d)return {cls:'ontime',txt:'准点'};

}

/* ---- 志愿者 per-event 服务时长/工作评价 (V1.0; feeds the member share) ---- */
/* 已确认的提交 —— 复盘和用户一览要看「本人申报」的工时/自费，而那些行 status 已经是 accepted，
   不在 loadPending 的结果里。单独按需取，不进 60 秒轮询：accepted 行只会越积越多。 */
let ACCEPTED=[],_accAt=0;
function loadAccepted(force){
  if(!canCloud())return Promise.resolve();
  if(!force&&Date.now()-_accAt<30000)return Promise.resolve();
  _accAt=Date.now();
  return sb.from('ym_submit')
    .select('id,member_code,event_id,chip_id,kind,note,hours,cost,diff,created_at')
    .eq('status','accepted').order('created_at')
    .then(({data,error})=>{if(error)return;ACCEPTED=data||[];render();});
}
// 本人申报的合计 —— 只数 submit/done，claim 和 join 不带工时
function selfTally(code,evId){
  const rows=ACCEPTED.filter(r=>String(r.member_code||'')===code
    &&(r.kind==='submit'||r.kind==='done')&&(!evId||r.event_id===evId));
  return {n:rows.length,
    hours:rows.reduce((s,r)=>s+(parseFloat(r.hours)||0),0),
    cost:rows.reduce((s,r)=>s+(parseInt(r.cost,10)||0),0),rows};
}
function volSection(e){
  // 三种指派方式都要覆盖：refId（从名册挂的人牌）、volId（抢单赢来的硬链接）、
  // 姓名（主办直接在任务上打的名字）。只认 refId 会把整个任务系统里的人漏光。
  const seen={},people=[],idx=volNameIndex();
  const add=(id)=>{if(!id||seen[id])return;const p=STORE.library.resources.find(x=>x.id===id);
    if(!p||catOf(p)!=='volunteer')return;seen[id]=1;people.push(p);};
  allResChips(e).forEach(x=>{const c=x.c;
    if((c.type||'人')==='人'&&c.refId)return add(c.refId);
    if((c.type||'')==='任务'){
      if(c.volId)return add(c.volId);
      const who=String(c.role||c.owner||'').trim();
      if(who&&idx[who]&&idx[who]!=='DUP')add(idx[who]);}});
  if(!people.length)return '';
  e.volLog=e.volLog||{};
  const rows=people.map(p=>{const log=e.volLog[p.id]||{};
    const a=codeOf(p),t=a?selfTally(a.code,e.id):{n:0,hours:0,cost:0};
    const said=t.n?`<span class="selfrep">本人申报 ${t.hours%1?t.hours.toFixed(1):t.hours}h${
      t.cost?' · 自费 '+yen(t.cost):''}</span>`:'<span class="selfrep none">本人未申报</span>';
    return `<div class="rvrow volrow">
      <span class="c2">${ico('person')}${esc(p.name)}${a?`<span class="num" style="color:var(--brass);font-size:10.5px"> ${esc(a.code)}</span>`:''}
        <span class="muted" style="font-size:11px"> ${esc(p.role||'')}</span></span>
      ${said}
      <input style="width:78px;padding:5px 8px" placeholder="主办记时长h" inputmode="decimal" value="${esc(log.hours||'')}"
        onchange="volLog('${escJs(p.id)}','hours',this.value)">
      <input style="flex:1.3;padding:5px 8px" placeholder="工作评价" value="${esc(log.review||'')}"
        onchange="volLog('${escJs(p.id)}','review',this.value)"></div>`;}).join('');
  return `<div class="rvsec"><div class="hd"><span class="lbl">志愿者 · 本人申报 / 主办登记</span></div>${rows}
    <p class="note9" style="margin:8px 0 0"><b>本人申报</b>是 TA 自己交任务时填的、你已确认的数字；
      <b>主办记时长</b>是你自己的记录，两者分开存、不相加。TA 在自己页面上两个都看得到。</p></div>`;
}

function volLog(refId,k,v){const e=ev();e.volLog=e.volLog||{};
  e.volLog[refId]=e.volLog[refId]||{};e.volLog[refId][k]=v.trim();save();}

/* ---- save-back builder: what this event can teach the library ---- */
function startSaveBack(){S.saveBack=buildSaveBack(ev());render();}
function buildSaveBack(e){
  const L=STORE.library;
  const dur=i=>{const a=parseHM(e.rows[i].time),b=e.rows[i+1]?parseHM(e.rows[i+1].time):null;
    return a!=null&&b!=null&&b>a?b-a:15;};
  const ideas=[];e.rows.forEach((r,i)=>{
    if(r.seg&&!L.ideas.some(x=>x.seg===r.seg)&&!ideas.some(x=>x.seg===r.seg))
      ideas.push({on:true,seg:r.seg,dur:dur(i),res:r.resources.map(c=>c.role||c.name).slice(0,3)});});
  const rseen={},res=[];
  allResChips(e).forEach(x=>{const c=x.c;
    if(rseen[c.name]||L.resources.some(y=>y.name===c.name))return;
    if((c.type||'人')==='任务')return; rseen[c.name]=1;res.push({on:true,name:c.name,type:c.type||'人',role:c.role||'',
      cat:(c.type==='物')?'goods':'volunteer'});});
  const mseen={},money=[];
  allMoneyChips(e).forEach(x=>{const c=x.c;
    if(c.actual==null||mseen[c.name])return;mseen[c.name]=1;
    const it=c.refId?L.money.find(y=>y.id===c.refId):L.money.find(y=>y.name===c.name);
    if(it){if(it.amount!==c.actual)money.push({on:true,mode:'update',refId:it.id,name:c.name,from:it.amount,to:c.actual,kind:c.kind});}
    else money.push({on:true,mode:'new',refId:null,name:c.name,from:null,to:c.actual,kind:c.kind});});
  return {tpl:{on:true,name:(e.name||'活动')+' 模板'},ideas,res,money};
}
function sbToggle(kind,i){const sb=S.saveBack;
  if(kind==='tpl')sb.tpl.on=!sb.tpl.on;else sb[kind][i].on=!sb[kind][i].on;render();}

  if(sb.money.length){h+=`<div class="sbsec">收支项价格</div>`+
    sb.money.map((x,i)=>sbItem(x.on,`sbToggle('money',${i})`,esc(x.name)+(x.mode==='update'?'（更新价格）':'（新收支项）'),
      (x.from!=null?yen(x.from)+' → ':'')+yen(x.to))).join('');}
  if(!sb.ideas.length&&!sb.res.length&&!sb.money.length)
    h+=`<div class="note9">环节、资源、价格都已在库里 — 只需存模板。</div>`;
  h+=`<div class="scbtns" style="border:0;padding-top:6px">
    <button class="btn" style="flex:1" onclick="applySaveBack()">确认保存</button>
    <button class="btn ghost sm" onclick="S.saveBack=null;render()">取消</button></div></div>`;
  return h;

function applySaveBack(){
  const sb=S.saveBack,L=STORE.library,e=ev();let n=0;
  // whitelist-copy: a saved template must NOT carry execution state (status/due/ignored) or an
  // ad-hoc 任务 chip into future events (owner 2026-07-21 — a real leak the review caught)
  const cpR=c=>c.type==='任务'
    ?{id:uid(),type:'任务',name:c.name,status:0}                                  // a job: keep the description; 人/资源/时间 re-allocated
    :{id:uid(),refId:c.refId,name:c.name,type:c.type,role:c.role,status:0};   // reset to 待办
  const cpM=c=>({id:uid(),refId:c.refId,name:c.name,kind:c.kind,plan:c.plan,unit:c.unit,actual:null});
  const noTask=arr=>(arr||[]).filter(c=>c.type!=='任务');   // header one-off chores don't belong in a template
  const live=arr=>(arr||[]).filter(c=>!c.ignored);          // 搁置'd items were set aside — don't seed the next event
  if(sb.tpl.on){L.templates.push({id:uid(),name:sb.tpl.name,
    note:e.rows.length+'环节 · 来自 '+fmtDate(e.date),
    // rows KEEP their 要做的事 (jobs) so the same 环节 auto-suggests them next time (owner: absorb & reappear)
    rows:e.rows.map(r=>({id:uid(),time:r.time,seg:r.seg,dur:r.dur,owner:r.owner,desc:r.desc,
      resources:live(r.resources).map(cpR),money:r.money.map(cpM)})),
    header:{resources:noTask(live(e.header.resources)).map(cpR),money:e.header.money.map(cpM)}});n++;}
  sb.ideas.filter(x=>x.on).forEach(x=>{L.ideas.push({id:uid(),seg:x.seg,dur:x.dur,res:x.res});n++;});
  sb.res.filter(x=>x.on).forEach(x=>{L.resources.push({id:uid(),name:x.name,type:x.type,
    cat:x.cat||(x.type==='物'?'goods':'volunteer'),role:x.role});n++;});
  sb.money.filter(x=>x.on).forEach(x=>{
    if(x.refId){const it=L.money.find(y=>y.id===x.refId);if(it)it.amount=x.to;}
    else L.money.push({id:uid(),name:x.name,kind:x.kind,amount:x.to});n++;});
  S.saveBack=null;save();render();toast('已保存回资产库（'+n+' 项）— 下一场从这里开始');
}
/* ---- exports ---- */
/* 取引先名 は OCR が読んだ文字列＝モデル由来。=SUM(...) や @… で始まる値は Excel/Numbers が
   **数式として実行**するので、税理士が開いた瞬間に走る。先頭に ' を足して無害化する
   （CSV インジェクション対策の定石。表示上は税理士のツールが ' を落とす）。 */
function csvEsc(v){v=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(v))v="'"+v;
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function dlCSV(name,rows){
  const txt='﻿'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

    window.addEventListener('resize',()=>{

      if(S.exTask)positionExDlg();});}

    if(S._exPos){dlg.style.left=S._exPos.left+'px';dlg.style.top=S._exPos.top+'px';dlg.style.transform='none';}return;}
  const r=node.getBoundingClientRect(),dw=dlg.offsetWidth,dh=dlg.offsetHeight,M=10;

  if(top+dh>window.innerHeight-M)top=Math.max(M,r.top-dh-8);   // not enough room below → flip above
  left+=window.scrollX;top+=window.scrollY;   // absolute + document coords → the dialog scrolls with the tree
  dlg.style.left=left+'px';dlg.style.top=top+'px';dlg.style.transform='none';S._exPos={left,top};
}
/* ---- trunk = execution timeline: helpers ---- */
function planStart(e){return e.runAt||todayStr();}     // top of trunk = 计划完成日 (进入执行 那天)
function dayFrac(e,dayStr){                              // 0 = top(计划开始) … 1 = root(活动日)
  const a=Date.parse(planStart(e)+'T00:00:00'),b=Date.parse((e.date||'')+'T00:00:00'),d=Date.parse((dayStr||'')+'T00:00:00');
  if(isNaN(b)||isNaN(d)||!(b>a))return 0.5;
  return Math.max(0,Math.min(1,(d-a)/(b-a)));
}
function taskDay(e,x){const c=x.c,b=x.bucket;           // a task's day on the trunk; null → canopy (待办)
  if(b===0)return null;
  if(c.due)return c.due;                                // dated → its deadline day
  if(b===2)return c.doneAt||todayStr();                 // done → the day it was finished
  return todayStr();                                    // doing, undated → the 今天 line
}
function stampDone(c){if(taskBucket(c)===2){if(!c.doneAt)c.doneAt=todayStr();}else{c.doneAt=undefined;}}

/* 日段树 — walk the calendar day by day. Each day is a GRID ROW as tall as its own content, and
   runs of empty days collapse into one elastic segment. Nothing is absolutely positioned, so two
   same-day cards simply stack: overlap is a layout invariant, not a tuned gap. One layout at every
   width (375px → desktop); execMobile survives only as the no-date fallback. */
function execTree(e,todo,doing,done){
  const A=planStart(e),B=e.date||'',T=todayStr(),d=daysTo(e);
  if(!B||!(B>A))return execMobile(e,todo,doing,done);          // degenerate window → old stack
  const cl=s=>s<A?A:(s>B?B:s), md=s=>(+s.slice(5,7))+'/'+(+s.slice(8,10));
  const addDays=(s,n)=>{const q=new Date(s+'T00:00:00');q.setDate(q.getDate()+n);
    return q.getFullYear()+'-'+String(q.getMonth()+1).padStart(2,'0')+'-'+String(q.getDate()).padStart(2,'0');};
  const L={},R={},DUE={};
  done .forEach(x=>{const k=cl(taskDay(e,x));(L[k]=L[k]||[]).push(x);});
  doing.forEach(x=>{const k=cl(taskDay(e,x));(R[k]=R[k]||[]).push(x);});
  [...todo,...doing,...done].forEach(x=>{if(x.c.due){const k=cl(x.c.due);
    DUE[k]=Math.max(DUE[k]||1,(x.c.due<T&&x.bucket<2)?2:1);}});   // 2 = 逾期 → red ●
  const rows=[];let gap=0,gPast=true,k=A,guard=0;
  while(k<=B&&guard++<2000){                                    // ISO strings compare correctly — no Date math here
    if(L[k]||R[k]||DUE[k]||k===T||k===A||k===B){
      if(gap){rows.push({gap:gap,past:gPast});gap=0;gPast=true;}
      rows.push({day:k,l:L[k]||[],r:R[k]||[],due:DUE[k],today:k===T,past:k<T});
    }else{gap++;if(k>=T)gPast=false;}
    k=addDays(k,1);
  }
  if(gap)rows.push({gap:gap,past:gPast});
  const CAP=window.innerWidth>=900?{l:6,r:12}:{l:4,r:8};
  const cell=(arr,day,side)=>{const key=day+side,open=(S.exOpen||{})[key],
      show=open?arr:arr.slice(0,CAP[side]);
    return show.map(x=>`<div class="tlwrap"><i class="stem"></i>${taskCard(x)}</div>`).join('')
      +(arr.length>CAP[side]?`<button class="tlmore" onclick="exDay('${key}')">${open?'收起 ▴':'＋ 还有 '+(arr.length-CAP[side])+' 项 ▾'}</button>`:'');};
  const row=r=>r.gap
    ? `<div class="tlcell l gapc"></div>`
     +`<div class="tlspine gap${r.past?' past':''}" style="--gh:${Math.min(84,Math.max(22,r.gap*6))}px">`
     +`${r.gap>=2?`<span class="dlab">空 ${r.gap} 天</span>`:''}</div>`
     +`<div class="tlcell r gapc"></div>`
    : `<div class="tlcell l" data-day="${r.day}">${cell(r.l,r.day,'l')}</div>`
     +`<div class="tlspine${r.past?' past':''}" data-day="${r.day}">`
     +`${r.today?'<i class="tltick"></i>':''}`
     +`<span class="dlab${r.today?' now':''}">${r.today?'今天':md(r.day)}</span>`
     +`${r.due?`<i class="tldl${r.due===2?' over':''}"></i>`:''}</div>`
     +`<div class="tlcell r" data-day="${r.day}">${cell(r.r,r.day,'r')}</div>`;
  const total=todo.length+doing.length+done.length,pct=total?Math.round(done.length/total*100):0;
  const canopy=`<div class="tlcanopy"><div class="hd"><i class="dot"></i>待办 <span style="opacity:.6;font-weight:400">${todo.length}</span></div>
    ${todo.length?`<div class="row">${todo.map(taskCard).join('')}</div>`:'<div class="exempty" style="opacity:.7">没有待办 — 都在推进或已完成</div>'}
    <button class="exadd" onclick="exAddTodo()">＋ 加一个待办</button>${publishBar(e)}</div>`;
  const cd=d<0?String(-d):(d===0?'今天':String(d)),
        lab=d<0?(-d)+' 天前 · 已过':(d===0?'就是今天':'还有 '+d+' 天');
  return `<div style="text-align:center;margin-top:8px">${heroHtml(e)}</div>
    <div class="exsum"><div class="exbar"><i style="width:${pct}%"></i></div>
      <div class="lg"><span class="a">待办 <b>${todo.length}</b></span><span>进行中 <b>${doing.length}</b></span><span class="g">完成 <b>${done.length}</b></span></div></div>
    ${canopy}
    <div class="extop">▲ 计划开始 ${fmtDate(A)}</div>
    <div class="extl"><div class="tlhdr l">完成</div><div class="tlhdr c"></div><div class="tlhdr r">进行中</div>
      ${rows.map(row).join('')}</div>
    <div class="tlbase"><div class="cd${(d<0||d<=3)?' over':''}">${cd}</div>
      <div class="lab">${lab} · ${fmtDate(e.date)} 活动日</div></div>`;
}

/* ---------- 志愿者报上来的（0014 ym_submit）—— 主办确认才翻状态 ----------
   A volunteer tapping 完成 writes an ADDITIVE pending row. Nothing here writes chip.status; the
   only conversion is pendAccept(), which calls the host's own existing exSet(). */
let PENDING=[],_pendT=null;
function loadPending(){
  if(!canCloud())return;
  // never select file_data — the poll would drag base64 receipts across the wire every minute
  sb.from('ym_submit').select('id,member_code,event_id,chip_id,kind,note,hours,cost,amount,diff,file_name,file_mime,created_at')
    .eq('status','pending').order('created_at')
    .then(({data,error})=>{if(error)return;
      const next=data||[],same=JSON.stringify(next)===JSON.stringify(PENDING);
      PENDING=next;
      // A minute-timer that repaints is a minute-timer that eats whatever the host was typing:
      // render() rebuilds every editor from SAVED state. Repaint only on real change, never
      // while an editor is open — each of those closes with its own render().
      // S.rc 也要挡：确认卡里主办正在照着票面手填，60 秒的轮询重绘会把没读回 R.f 的
      // 那几格换回旧值 —— 一张票据填到一半被悄悄清空，人只会以为自己没打上。
      if(!same&&!S.postEdit&&!S.jobEdit&&!S.rc&&!S.libEdit&&!S.libAdd&&!$('askwrap')&&!$('grantwrap'))render();});
  if(!_pendT)_pendT=setInterval(()=>{if(canCloud())loadPending();else{clearInterval(_pendT);_pendT=null;}},60000);
}
// em filters to ONE submitter: two volunteers can report on the same chip, and the host must not
// accept B's receipt under A's name with a single tap.
// code filters to ONE submitter: two volunteers can report on the same chip, and the host must not
// accept B's receipt under A's name with a single tap.
// 抢单 is EXCLUDED here, structurally rather than by a render-time branch: 交任务 means 「我做完了」
// and 抢单 means 「这件事给我」. A claim reaching pendBlock() would be rendered as 传了票据 with a
// 确认完成 button wired to exSet(cid,2) — one tap would mark an untouched task 完成 and stamp the
// claim 'accepted', which also (correctly) frees the arbiter. Two verbs, two boxes, two accessors.
// 'give' も同じ理由で構造的に外す：捐赠票据 は chip に紐づかず（chip_id=''）、任务の 确认完成
// ボタンの下に置かれるべきものでもない。それ専用の入口は giveStrip()。
function pendFor(cid,mc){const e=ev();
  return PENDING.filter(r=>r.chip_id===cid&&r.kind!=='claim'&&r.kind!=='join'&&r.kind!=='give'
    &&(!e||r.event_id===e.id)&&(!mc||String(r.member_code||'')===mc));}
// 0016 guarantees AT MOST ONE live claim per chip, so this is always one person or nobody.
// PENDING holds only status='pending' rows (loadPending filters), so a 退回'd or already-assigned
// claim is not here — which is exactly right: both have left the arbiter too.
function claimFor(cid){const e=ev();
  return PENDING.find(r=>r.kind==='claim'&&r.chip_id===cid&&(!e||r.event_id===e.id))||null;}
// the roster name behind a 编码, so the host reads 「小林 交任务了」 not V0014
function pendCount(e){return e?PENDING.filter(r=>r.event_id===e.id).length:0;}
// the roster name behind an address, so the host reads 「小林 说完成了」 not an email
// the roster name behind a 编码, so the host reads 「小林 交任务了」 not V0014
// the 名册 RECORD behind a 编码 — claimAccept needs the record (for its id), not just the name
function personByCode(mc){const c=String(mc||'');if(!c)return null;
  return STORE.library.resources.find(x=>{const a=CODES[x.id];return a&&a.code===c;})||null;}
function pendWho(r){const c=String(r.member_code||'');
  const p=personByCode(c);
  return p?p.name:(c||'成员');}
function pendBlock(cid){
  const rows=pendFor(cid);if(!rows.length)return '';
  const cs=[];rows.forEach(r=>{const c=String(r.member_code||'');if(cs.indexOf(c)<0)cs.push(c);});
  return cs.map(mc=>{
    const mine=pendFor(cid,mc);
    const done=mine.filter(r=>r.kind==='submit'||r.kind==='done'),files=mine.filter(r=>r.kind==='file');
    const h=done.reduce((s,r)=>s+(parseFloat(r.hours)||0),0);

    return `<div class="pendbox">

      ${h||co?`<div class="pn">工时 ${esc(h)}h${co?' · 自费 '+yen(co)+'（不进收支）':''}</div>`:''}
      ${done.filter(r=>r.note).map(r=>`<div class="pn">「${esc(r.note)}」</div>`).join('')}
      ${files.map(r=>`<div class="pf two">
        <span style="flex:1" onclick="pendOpenFile('${escJs(r.id)}')">${ico('clip')}${esc(r.file_name||'附件')}</span>
        <span class="rz" onclick="rcFromSubmit('${escJs(r.id)}','vol')">${ico('coin')}入账</span></div>`).join('')}
      <div id="pendview_${esc(cid)}"></div>
      <div class="df" style="margin-top:8px">
        <button class="btn sm" style="flex:1" onclick="pendAccept('${escJs(cid)}','${escJs(mc)}')">确认完成</button>
        <span class="bk" style="color:var(--muted);cursor:pointer;font-size:11px;align-self:center;padding:0 8px"
          onclick="pendReject('${escJs(cid)}','${escJs(mc)}')">退回</span></div></div>`;}).join('');

async function pendAccept(cid,mc){
  if(S.readonly||!canCloud())return;
  const rows=pendFor(cid,mc);if(!rows.length)return;
  const evId=rows[0].event_id;
  // local-first: confirming from a second device whose copy of this event is stale would push the
  // stale doc over the 800ms debounce and quietly undo work done elsewhere.
  if(!ev()||ev().id!==evId){await cloudLoad();S.evId=evId;}
  if(!chipById(cid)){toast('这项已经不在台本里了');loadPending();return;}
  exSet(cid,2);                                   // the host's own hand — RES_ST semantics untouched
  // ⚠ 票据行**不跟着确认**。PENDING 只装 pending，一旦把 file 行标成 accepted，它就从
  // pendBlock 消失，而「入账」按钮只长在那里 —— 先点了「确认完成」的主办，从此再也没有
  // 任何入口把那张票据记进帳簿。任务完成 ≠ 钱记完，两件事两个按钮。
  const ids=pendFor(cid,mc).filter(r=>r.kind!=='file').map(r=>r.id);
  if(!ids.length){loadPending();return;}
  const {error}=await sb.from('ym_submit').update({status:'accepted'}).in('id',ids);
  if(error)toast('已翻状态，但回执未标记：'+error.message);
  loadPending();
}
async function pendReject(cid,mc,sid){
  if(S.readonly||!canCloud())return;
  // 捐赠票据 は chip を持たないので pendFor では引けない（構造的に除外してある）。cid='' が
  // 「これは捐赠のほう」という合図 —— giveStrip() だけがそう呼び、行 id を名指しで渡す。
  // 同じ人が同じ回に二枚出していても、押した一枚だけが戻る。
  const rows=cid?pendFor(cid,mc)
    :PENDING.filter(r=>r.kind==='give'&&r.id===sid&&String(r.member_code||'')===mc);
  if(!rows.length)return;
  ask({title:'退回这一项？',note:'必须写清楚要 TA 改什么 —— TA 只看得到这句话。',
    fields:[{label:'退回说明（必填）',ph:'例如：票据拍糊了，请重拍一张'}],ok:'退回',
    fn:async(v)=>{
      const why=(v[0]||'').trim();
      if(!why){toast('请写一句退回说明');return;}
      // 退回 the CLAIM only. Rejecting the 票据 too strands them: there is no member UPDATE policy.
      const done=rows.filter(r=>r.kind==='submit'||r.kind==='done');
      const ids=(done.length?done:rows).map(r=>r.id);
      const {error}=await sb.from('ym_submit')
        .update({status:'rejected',host_note:why.slice(0,2000)}).in('id',ids);
      if(error){toast('退回失败：'+error.message);return;}
      toast('已退回 —— TA 可以改完再报一次');loadPending();}});
}

/* ---------- 抢单 (PLAN-Y7 §B6) —— 数据库已经定了胜负，主办只决定要不要把事交出去 ----------
   ym_claim_task() guarantees at most one live claim per chip, so claimFor() is always ONE person.
   确认指派 is the ONLY thing that writes the chip, and it runs in the HOST'S session: chip.volId +
   chip.role go into ym_doc, exactly as if the host had typed the name. Nothing member-side ever
   writes ym_doc (hard constraint 1), and 0016 does not even READ it — this function is where the
   host's own document gets its say about whether the task is still assignable. */
function claimBlock(cid){
  const r=claimFor(cid);if(!r)return '';
  const p=personByCode(r.member_code);
  return `<div class="pendbox">
    <div class="ph">${ico('hand')}${esc(p?p.name:(r.member_code||'成员'))} 接了这件事${r.diff?' · 难度 '+esc(r.diff):''}</div>
    <div class="pn">先点先得，已经判给 TA 了 —— 别人再点只会看到「该任务已经被领取」。
      确认后这件事就出现在 TA 自己的页面上，可以交工时和票据。</div>
    ${p?'':`<div class="pn" style="color:var(--alarm)">名册里找不到这个编号 —— 先在名册补一条再指派。</div>`}
    <div class="df" style="margin-top:8px">
      <button class="btn sm" style="flex:1" ${p?'':'disabled'}
        onclick="claimAccept('${escJs(cid)}')">确认指派给 TA</button>
      <span class="lnkdel" onclick="claimReject('${escJs(cid)}')">退回</span></div></div>`;
}
/* 转化点。ORDER IS LOAD-BEARING: 先写台本 → 等发布推上去（这一步让任务离开所有人的认领池）→
   最后才删掉那条认领回执（这一步才把 0016 的唯一索引让出来）。反过来会出现「已经归 TA 了，
   但池子里还挂着、名额又空着」的一秒钟，别人能在那一秒里抢到一件已经有主的事。 */
async function claimAccept(cid){
  if(S.readonly||!canCloud())return;
  const r=claimFor(cid);if(!r)return;
  // local-first, exactly as pendAccept: confirming from a second device whose copy of this event
  // is stale would push that stale doc over the 800ms debounce and quietly undo work done elsewhere
  if(!ev()||ev().id!==r.event_id){await cloudLoad();S.evId=r.event_id;}
  const c=chipById(cid);
  if(!c){toast('这项已经不在台本里了 —— 已清掉这条认领');await claimDrop(r.id);render();return;}
  const p=personByCode(r.member_code);
  if(!p){toast('名册里找不到这个编号 —— 先在名册补一条，再指派');return;}
  // THE HOST'S OWN DOCUMENT HAS THE LAST WORD. 0016 checks the published pool, which lags the 台本
  // by one save; this checks the live chip, which only this session can see. `c.volId===p.id` is
  // the retry path: if the receipt delete failed last time, tapping again finishes the job.
  if(!unclaimed(c)&&c.volId!==p.id){
    toast('这项已经有负责人 / 已搁置 / 已完成了 —— 请改用「退回」');return;}
  // 归 TA 了：volId 是硬链接（重名或空名的名册记录也能准确送达），role 只是给人看的
  c.volId=p.id;c.role=p.name;c.open=undefined;
  save();                       // ym_doc + ym_share — HOST session only
  await pushShares();           // the chip leaves EVERY pool before the arbiter slot is freed
  const ok=await claimDrop(r.id);
  render();
  toast(ok?('已指派给 '+p.name+' —— TA 的页面上会出现这件事')
         :'已指派，但这条认领回执没清掉 —— 再点一次「确认指派」即可');
}
/* 退回 = status 'rejected' + 一句必填说明 (§B3)。0016 §1 的唯一索引只盖 pending，所以这一下
   立刻把名额让回认领池，同时把解释留给 TA 看 —— 删行也能让出名额，但会把解释一起销毁。 */
function claimReject(cid){
  if(S.readonly||!canCloud())return;
  const r=claimFor(cid);if(!r)return;
  ask({title:'退回这次认领？',
    note:'这件事会立刻回到认领池，别人可以接。必须写一句说明 —— TA 只看得到这句话。',
    fields:[{label:'说明（必填）',ph:'例如：这件事我另外安排了，你先做签到台'}],ok:'退回',
    fn:async(v)=>{
      const why=(v[0]||'').trim();

// 删掉一条认领回执。指派完成后这条行已经没有读者了（谁抢到的记录是 chip.volId 本身），而留着它
// 会永远占住 ym_submit_claim_one：主办日后收回负责人、重新发布，这件事就再也没人接得了。
async function claimDrop(id){
  const {error}=await sb.from('ym_submit').delete().eq('id',id);

// fetch the bytes for ONE row, only when the host actually asks to look
function pendOpenFile(sid){
  if(!canCloud())return;
  const box=$('pendview_'+((PENDING.find(r=>r.id===sid)||{}).chip_id||''));if(!box)return;
  box.textContent='读取中…';
  sb.from('ym_submit').select('file_name,file_mime,file_data').eq('id',sid).maybeSingle()
    .then(({data,error})=>{
      if(error||!data){box.textContent='读取失败';return;}
      // file_data is MEMBER-controlled. Interpolating it into src="…" let a quote inside the
      // "base64" break out of the attribute and run script on the host's origin — i.e. the host's
      // session token. Strip to the base64 charset, re-pin the mime, and BUILD THE NODE rather
      // than assembling attribute HTML. (0014 also CHECKs the charset server-side.)
      const b64=String(data.file_data||'').replace(/[^A-Za-z0-9+/=]/g,'');
      const mime=/^(image\/(jpeg|png|webp|heic|heif)|application\/pdf)$/.test(data.file_mime||'')
        ? data.file_mime : 'image/jpeg';
      const src='data:'+mime+';base64,'+b64;
      const name=data.file_name||'票据';
      box.textContent='';
      if(mime==='application/pdf'){
        const a=document.createElement('a');a.className='pf';a.href=src;
        a.download=name;a.textContent='下载 '+name;box.appendChild(a);
      }else{
        const im=document.createElement('img');im.src=src;
        im.style.cssText='max-width:100%;border-radius:6px;margin-top:6px';box.appendChild(im);
      }});
}

        onclick="event.stopPropagation();S.evId='${e.id}';go('signup')">${ico('person')}${esc(signupText(e))}</span>`}
      <div class="dc-t">${esc(e.name)||'未命名'}${dtag(e)}</div>
      <div class="dc-m">${fmtDate(e.date)}${e.start?' '+esc(e.start):''}${f.length?` · 待办 <b>${f.length}</b>`:''}${pendCount(e)?` · <span style="color:var(--brass)">● 待确认 ${pendCount(e)}</span>`:''}</div>
      ${ph==='archived'?'':`<div class="dc-acts">
        ${ph==='current'?go2(`goExec('${e.id}')`,ico('go')+'执行看板'):''}
        ${go2(`S.evId='${e.id}';go('sheet')`,'计划')}
        ${go2(`S.evId='${e.id}';go('signup')`,'报名')}
        ${go2(`S.evId='${e.id}';goDay()`,'当天')}
        ${go2(`S.evId='${e.id}';goReview()`,'复盘')}
      </div>`}
      <div class="dc-brief">环节 ${e.rows.length} · 待办 ${f.length} · 收支差额 ${yen(mt.planNet)}　— 点击进入${act} →${(ph==='hot'||ph==='archived')?`　·　<span class="t" onclick="event.stopPropagation();cloneEvent('${e.id}')">${ico('again')}再办一场</span>`:''}</div></div>`;};
  const sec=(k,hint)=>`<div class="sec">${PHASE_LABEL[k]} ${groups[k].length?'· '+groups[k].length:''}</div>`+
    (groups[k].length?groups[k].map(evCard).join(''):`<div class="note9" style="margin:0 2px 10px">${hint}</div>`);
  return `<div class="main" style="max-width:640px;margin:0 auto">
    <div class="evsw" style="margin-bottom:12px">
      <button class="btn sm" onclick="newEvent();go('sheet')">＋ 新活动</button>
      <label class="btn ghost sm" style="cursor:pointer">${ico('cam')}记一张票据
        <input type="file" accept="image/*,application/pdf" capture="environment" style="display:none"
          onchange="rcShoot(this,{src:'host',evId:''})"></label>
      ${/* 电脑上「选一张文件」很难用 —— 票在手里，相机在手机上（owner 2026-07-28）。
           手机上这个按钮也留着：扫自己没意义，但换一台手机拍、或者让同伴拍，都用得上。 */''}
      <button class="btn ghost sm" onclick="capOpen()">${ico('qr')}手机拍</button>
      <button class="btn ghost sm" onclick="go('ledger')">${ico('books')}总账</button></div>
    ${sec('current','正在进行的活动会出现在这里（在计划页点「进入执行」）。')}
    ${sec('plan','筹备中的活动。')}
    ${sec('hot','刚结束、还在跟进复盘的活动（14 天内）。')}
    ${sec('archived','已归档的活动 — 点开只读回看。')}
    ${S.peek?peekCard():''}
  </div>`;
}
// one click opens directly (owner: no confirm / transfer): 当前→执行树 · 筹备→计划 · 归档→只读 · 仍热→复盘
function deskOpen(id){const e=STORE.events.find(x=>x.id===id);if(!e)return;const ph=evPhase(e);S.peek=null;
  if(ph==='current')goExec(id);
  else if(ph==='archived')openArchived(id);
  else if(ph==='hot'){S.evId=id;S.view='review';render();}
  else {S.evId=id;go('sheet');}}
function peek(id){S.peek=id;render();}
function peekCard(){
  const e=STORE.events.find(x=>x.id===S.peek);if(!e){S.peek=null;return '';}
  const ph=evPhase(e),f=followUps(e),mt=moneyTotals(e);
  const open=ph==='current'?`goExec('${e.id}')`:ph==='archived'?`openArchived('${e.id}')`:`S.evId='${e.id}';go('sheet')`;
  const openLbl=ph==='current'?ico('go')+'打开执行看板':ph==='archived'?ico('eye')+'只读回看':ph==='hot'?'复盘 / 跟进':'打开计划';
  return `<div class="drawerbg" onclick="S.peek=null;render()"></div>
    <div class="modal-g"><div class="rvsec" style="margin:0">
      <div class="hd"><span class="lbl">${PHASE_LABEL[ph]}</span>
        <button class="btn ghost sm" onclick="S.peek=null;render()">✕</button></div>
      <div style="font-size:16px;font-weight:700;margin:2px 0">${esc(e.name)||'未命名'}${dtag(e)}</div>
      <div class="note9" style="margin:0 0 8px">${fmtDate(e.date)}${e.start?' '+esc(e.start):''}${e.venue?' · '+esc(e.venue):''}</div>
      <div style="font-size:12.5px;line-height:1.9">环节 ${e.rows.length} · 待办 ${f.length} · 收支差额 ${yen(mt.planNet)}</div>
      <button class="btn" style="width:100%;margin-top:12px" onclick="S.peek=null;${ph==='hot'?`S.evId='${e.id}';S.view='review';render()`:open}">${openLbl}</button>
    </div></div>`;
}
function openArchived(id){S.evId=id;S.readonly=true;go('sheet');}

/* ================= boot ================= */
/* 手机侧的拍照页：?cap=<token> 就是全部凭据（0005 的设计 —— 手机对表零权限，
   只能通过 cap_submit 这一个匿名函数把结果塞回那个 token 对应的会话）。
   必须**在这里**分流：不 seed、不 render、不 authInit —— 那一页不该有登录、
   不该有主办台的任何内容，也不该在别人的手机上写下这台设备的 STORE。 */
const CAP_TOKEN=new URLSearchParams(location.search).get('cap');
if(CAP_TOKEN&&sb){
  capPhone(CAP_TOKEN);
}else{
  STORE=load();
  if(!STORE||!STORE.library){STORE=seed();save();}
  ensureY2();
  S.evId=STORE.events[0]?STORE.events[0].id:null;
  render();
  authInit();
}
</script>
